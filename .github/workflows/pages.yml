# Publie QuenTools (Infikit et Patrimoine AI) sur GitHub Pages à chaque push sur la branche par défaut.
# Une seule fois : Settings → Pages → Source : « GitHub Actions ».
name: Publier sur GitHub Pages

on:
  push:
    branches: [main, master, claude/infirmiere-ordonnances-upload-26nl16, claude/busy-noether-9hb80f]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}infikit/
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html _site/
          rsync -a --exclude oauth-worker infikit _site/
          rsync -a --exclude cors-worker patrimoine _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
