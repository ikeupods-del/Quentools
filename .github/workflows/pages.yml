# Publie QuenTools (site vitrine, Infikit, Freelance Kit, Gourmet AI, Wouf) sur GitHub Pages à chaque push sur la branche par défaut.
# Une seule fois : Settings → Pages → Source : « GitHub Actions ».
name: Publier sur GitHub Pages

on:
  push:
    branches: [main, master, claude/infirmiere-ordonnances-upload-26nl16]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Rien n'est publié si les tests de Wouf échouent (contenu, configuration, relais, parcours utilisateur).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: wouf/package-lock.json }
      - run: npm ci
        working-directory: wouf
      - run: npx playwright install --with-deps chromium
        working-directory: wouf
      - run: npm test
        working-directory: wouf

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}wouf/
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html 404.html _site/
          rsync -a assets _site/
          rsync -a ebook _site/
          rsync -a realisations _site/
          rsync -a devis _site/
          rsync -a admin _site/
          rsync -a demo _site/
          rsync -a exemples _site/
          rsync -a --exclude oauth-worker infikit _site/
          rsync -a freelance _site/
          rsync -a gourmet _site/
          rsync -a --exclude billing-worker --exclude tests --exclude docs --exclude node_modules --exclude 'package*.json' --exclude '.gitignore' wouf _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
