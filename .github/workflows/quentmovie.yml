name: QuentMovie — application Mac

# Construit l'application Mac (.dmg) sur un vrai Mac de GitHub et la publie dans « Releases ».
# Les applications installées y trouvent leurs mises à jour automatiques (maj.js) : publier une nouvelle
# version = changer « version » dans quentmovie/package.json et ajouter ses nouveautés dans NOUVEAUTES.md.
# Déclenchement : chaque modification de quentmovie/ sur la branche par défaut, ou le bouton « Run workflow ».
# Une version déjà publiée n'est pas republiée.
on:
  workflow_dispatch:
    inputs:
      modele:
        description: "Modèle de l'IA pour l'essai rapide : standard ou precis"
        type: string
        default: standard
      exemples:
        description: "Essai rapide de l'IA seulement : écrit des scripts d'exemple et cherche leurs photos (sans construire l'application)"
        type: boolean
        default: false
  push:
    branches: ['claude/infirmiere-ordonnances-upload-26nl16']
    paths: ['quentmovie/**', '.github/workflows/quentmovie.yml']
    tags: ['quentmovie-v*']

concurrency:
  group: quentmovie-mac
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  exemples:
    if: ${{ inputs.exemples }}
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: quentmovie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances
        env:
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
        run: npm ci
      - name: Écrire des scripts d'exemple (textes et photos choisies)
        run: QM_BUDGET_MIN=32 QM_IA_DEBUG=1 QM_MODELE="${{ inputs.modele }}" QM_RESEAU=1 QM_BASE="$RUNNER_TEMP/qm-ia" node tests/ia-exemples.js
  mac:
    if: ${{ !inputs.exemples }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: quentmovie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances
        env:
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
        run: npm ci
      - name: Contrôler le moteur (effets, transitions, export)
        run: npm test
      - name: Contrôler le moteur sans ffprobe (comme sur un Mac à puce Apple sans Rosetta)
        run: QM_SANS_FFPROBE=1 node tests/run.js | tail -5 && QM_SANS_FFPROBE=1 node tests/generateur.js && QM_SANS_FFPROBE=1 node tests/pistes.js
      - name: Essai réel du générateur (Wikipédia, images, voix du Mac, montage)
        run: QM_RESEAU=1 QM_SANS_FFPROBE=1 node tests/generateur-reel.js
      - name: Essai réel des voix naturelles et de la reconnaissance de la voix (téléchargement des modèles)
        run: QM_RESEAU=1 node tests/parole.js
      - name: Essai réel de l'IA locale et du téléchargement depuis un lien
        run: QM_RESEAU=1 QM_BASE="$RUNNER_TEMP/qm-autotest" node tests/ia.js
      - name: Construire l'application
        run: npm run dist
      - name: Lancer l'application installée et l'essayer (carte graphique, enregistrement, conversion, voix)
        run: |
          QM_AUTOTEST="$PWD/autotest.json" QM_BASE="$RUNNER_TEMP/qm-autotest" dist/mac-arm64/QuentMovie.app/Contents/MacOS/QuentMovie || true
          cat autotest.json
          node -e '
            const r = require("./autotest.json"), ko = [];
            if (r.erreur) ko.push("erreur : " + r.erreur);
            if (!r.page || r.page.version !== require("./package.json").version) ko.push("page non chargée");
            if (!r.detourage || !r.detourage.webgl2 || r.detourage.erreur || !(r.detourage.msMedian > 0)) ko.push("détourage");
            if (!r.prise || !r.prise.import || !(r.prise.duree > 2)) ko.push("prise du studio");
            if (!r.ia || r.ia.erreur || !(r.ia.scenes >= 2)) ko.push("IA locale");
            if (!r.lecture || !r.lecture.direct || !(r.lecture.avance > 1)) ko.push("lecture immédiate");
            if (!r.parole || !r.parole.dispo || !/\.m4a$/.test(r.parole.essai || "")) ko.push("voix naturelle");
            if (!r.parole || !/voix naturelle/i.test(r.parole.ecoute || "")) ko.push("reconnaissance de la voix");
            if (ko.length) { console.log("Échecs :", ko.join(", ")); process.exit(1); } else console.log("Application : tout fonctionne");'
      - name: Contrôler que chaque programme livré tourne sur puce Apple
        run: |
          fautifs=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q '^Mach-O'; then
              a=$(lipo -archs "$f" 2>/dev/null || echo '?')
              case " $a " in *" arm64 "*|*" arm64e "*) ;; *) echo "Pas compatible puce Apple : $f ($a)"; fautifs=1;; esac
            fi
          done < <(find dist/mac-arm64/QuentMovie.app -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.node' -o -name '*.so' \) -print0)
          exit $fautifs
      - uses: actions/upload-artifact@v4
        with:
          name: QuentMovie-mac
          path: quentmovie/dist/*.dmg
      - name: Publier la version
        if: github.ref == 'refs/heads/claude/infirmiere-ordonnances-upload-26nl16'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qx "quentmovie-v$VERSION"; then
            echo "La version $VERSION est déjà publiée : rien à faire (changer la version dans package.json pour publier)."
            exit 0
          fi
          node scripts/notes-version.js "$VERSION" > notes.md
          gh release create "quentmovie-v$VERSION" dist/QuentMovie-$VERSION-arm64.dmg \
            --title "QuentMovie $VERSION" --notes-file notes.md --target "${{ github.sha }}"
