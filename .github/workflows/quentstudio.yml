name: QuentStudio — application Mac

# Construit QuentStudio (.dmg) sur un vrai Mac de GitHub, l'essaie, puis le publie dans « Releases ».
# Publier une nouvelle version = changer quentstudio/version.txt et ajouter sa section dans quentstudio/NOUVEAUTES.md.
# Déclenchement : chaque modification de quentstudio/ sur la branche par défaut, ou le bouton « Run workflow ».
on:
  workflow_dispatch:
  push:
    branches: ['claude/infirmiere-ordonnances-upload-26nl16']
    paths: ['quentstudio/**', '.github/workflows/quentstudio.yml']

concurrency:
  group: quentstudio-mac
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: quentstudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construire l'application et le .dmg
        run: bash build_mac.sh
      - name: Contrôles (scénarios, anti-répétition, calage, QuentInvest, rendu réel avec la voix Piper)
        run: |
          python -m pip install --quiet -r requirements.txt
          export QS_DATA="$RUNNER_TEMP/qs-voix"
          python -c "import voice; assert voice.assurer_modele(), 'voix introuvable'; print(voice.locuteurs())"
          export PATH="$PWD/build-mac/bin:$PATH"   # ffmpeg livré dans l'application (le runner n'en a pas)
          QS_DATA= QS_MODELES_SOURCE="$RUNNER_TEMP/qs-voix/modeles" python verifier.py
      - name: Essayer l'application construite (deux vidéos réelles, voix, ffmpeg et AirDrop livrés)
        run: |
          # comme sur un Mac d'utilisateur : les certificats du Python de construction n'existent pas, l'app doit utiliser les siens
          CA=$(python -c "import ssl; p = ssl.get_default_verify_paths(); print(p.openssl_cafile)")
          [ -f "$CA" ] && sudo mv "$CA" "$CA.masque" || true
          QS_DATA="$RUNNER_TEMP/qs-app" dist/QuentStudio.app/Contents/MacOS/QuentStudio --essai "$PWD/essai.json"
          cat essai.json
          python - <<'PY'
          import json, sys
          r = json.load(open("essai.json")); ko = []
          if r.get("erreur"): ko.append("erreur : " + r["erreur"])
          if r.get("version") != open("version.txt").read().strip(): ko.append("version")
          if "QuentStudio.app" not in r.get("ffmpeg", ""): ko.append("ffmpeg livré non utilisé")
          if "QuentStudio.app" not in r.get("airdrop", ""): ko.append("AirDrop livré absent")
          if len(r.get("videos", [])) != 2: ko.append("vidéos manquantes")
          for v in r.get("videos", []):
              if v["duree"] != "00:01:02.00": ko.append(f"durée {v['serie']} : {v['duree']}")
              if v["voix"] != "piper": ko.append(f"voix {v['serie']} : {v['voix']}")
          print("Échecs : " + ", ".join(ko) if ko else "Application : tout fonctionne")
          sys.exit(1 if ko else 0)
          PY
      - uses: actions/cache@v4
        with:
          path: ~/Movies/QuentMovie/modeles
          key: ia-qwen3-4b-instruct-2507-q4km
      - name: Essayer l'IA intégrée de l'application (sujet libre QuentInvest avec Wikipédia, sketchs Quentools)
        # informatif : la machine virtuelle de GitHub n'a pas la puce graphique d'un vrai Mac, l'IA y est très lente ;
        # un échec ou un dépassement de délai ici n'empêche pas la publication
        continue-on-error: true
        timeout-minutes: 25
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          QS_DATA="$RUNNER_TEMP/qs-ia" dist/QuentStudio.app/Contents/MacOS/QuentStudio --essai-ia "$PWD/essai-ia.json" || true
          cat essai-ia.json
          python - <<'PY'
          import json, sys
          r = json.load(open("essai-ia.json")); ko = []
          if r.get("erreur"): ko.append("erreur : " + r["erreur"])
          if not r.get("moteur"): ko.append("moteur d'IA absent de l'application")
          if r.get("etat") != "ok": ko.append("IA non prête : " + str(r.get("etat")))
          if "IA" not in (r.get("invest") or {}).get("mode", ""): ko.append("épisode QuentInvest non écrit par l'IA")
          if len((r.get("quentools") or {}).get("titres", [])) != 3: ko.append("sketchs Quentools")
          print("Échecs : " + ", ".join(ko) if ko else "IA intégrée : tout fonctionne")
          sys.exit(1 if ko else 0)
          PY
      - name: Essayer la fenêtre native
        run: |
          python - <<'PY'
          import os, subprocess
          env = {**os.environ, "QS_DATA": os.environ["RUNNER_TEMP"] + "/qs-app"}
          try:
              subprocess.run(["dist/QuentStudio.app/Contents/MacOS/QuentStudio", "--essai-fenetre", os.path.abspath("fenetre.json")], env=env, timeout=120)
          except subprocess.TimeoutExpired:
              print("Fenêtre : délai dépassé")
          PY
          cat fenetre.json || echo "Pas de résultat (fenêtre non affichable sur cette machine)"
      - name: Contrôler que chaque programme livré tourne sur puce Apple
        run: |
          fautifs=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q '^Mach-O'; then
              a=$(lipo -archs "$f" 2>/dev/null || echo '?')
              case " $a " in *" arm64 "*|*" arm64e "*) ;; *) echo "Pas compatible puce Apple : $f ($a)"; fautifs=1;; esac
            fi
          done < <(find dist/QuentStudio.app -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.so' \) -print0)
          exit $fautifs
      - uses: actions/upload-artifact@v4
        with:
          name: QuentStudio-mac
          path: quentstudio/dist/*.dmg
      - name: Publier la version
        if: github.ref == 'refs/heads/claude/infirmiere-ordonnances-upload-26nl16'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat version.txt)
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qx "quentstudio-v$VERSION"; then
            echo "La version $VERSION est déjà publiée : rien à faire (changer version.txt pour publier)."
            exit 0
          fi
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' NOUVEAUTES.md > notes.md
          printf '\nInstallation : ouvrir le .dmg et glisser QuentStudio dans Applications. Au premier lancement, clic droit sur QuentStudio → Ouvrir.\n' >> notes.md
          gh release create "quentstudio-v$VERSION" "dist/QuentStudio-$VERSION-arm64.dmg" \
            --title "QuentStudio $VERSION" --notes-file notes.md --target "${{ github.sha }}"
