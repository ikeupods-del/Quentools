name: Studio Posts — application Mac

# Construit l'application Mac Studio Posts (.dmg) sur un vrai Mac de GitHub, l'essaie, puis la publie dans « Releases »
# (étiquette studio-posts-vX.Y.Z). Nouvelle version = changer « version » dans marketing/generateur-posts/package.json.
# Une version déjà publiée n'est pas republiée.
on:
  workflow_dispatch:
  push:
    paths: ['marketing/generateur-posts/**', 'tools/generateur-posts.js', 'tools/publications.json', 'tools/captures-posts.js', '.github/workflows/studio-posts.yml']

concurrency:
  group: studio-posts-mac
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: marketing/generateur-posts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances
        run: npm ci
      - name: Garder le modèle de l'IA locale entre deux essais
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sp-ia/modeles
          key: studio-posts-qwen3-4b-instruct-2507-q4km
      - name: Essai réel de la génération (IA locale, une publication de chaque forme)
        run: SP_DOSSIER="$RUNNER_TEMP/sp-ia" node tests/ia-reel.js
      - name: Construire l'application
        run: npm run dist
      - name: Lancer l'application construite et l'essayer (polices, modèles, bibliothèque)
        run: |
          STUDIO_AUTOTEST="$PWD/autotest.json" "dist/mac-arm64/Studio Posts.app/Contents/MacOS/Studio Posts" || true
          cat autotest.json
          node -e '
            const r = require("./autotest.json"), ko = [];
            if (r.erreur) ko.push("erreur : " + r.erreur);
            if (r.erreursConsole) ko.push("console : " + r.erreursConsole.join(" | "));
            if (!r.page || !r.page.polices) ko.push("polices non chargées");
            if (!r.page || !(r.page.modeles >= 10) || !(r.page.bibliotheque >= 40)) ko.push("modèles ou bibliothèque");
            if (r.page && r.page.trop && r.page.trop.length) ko.push("texte trop long : " + r.page.trop.join(", "));
            if (!r.page || !r.page.ia || !r.page.ia.ok) ko.push("IA locale : " + JSON.stringify(r.page && r.page.ia));
            if (!r.page || !r.page.bouton || !(r.page.captures >= 10)) ko.push("bouton Générer ou captures");
            if (ko.length) { console.log("Échecs :", ko.join(" ; ")); process.exit(1); } else console.log("Application : tout fonctionne");'
      - name: Contrôler que l'application tourne sur puce Apple
        run: |
          a=$(lipo -archs "dist/mac-arm64/Studio Posts.app/Contents/MacOS/Studio Posts")
          echo "Architectures : $a"; case " $a " in *" arm64 "*) ;; *) exit 1;; esac
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Posts-mac
          path: marketing/generateur-posts/dist/*.dmg
      - name: Publier la version
        # seulement depuis la branche par défaut (après validation et fusion) ; ailleurs, l'application reste dans les artefacts de l'essai
        if: github.ref == 'refs/heads/claude/infirmiere-ordonnances-upload-26nl16'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qx "studio-posts-v$VERSION"; then
            echo "La version $VERSION est déjà publiée : rien à faire (changer la version dans package.json pour publier)."
            exit 0
          fi
          printf '%s\n\n%s\n' "Studio Posts : publications Instagram et TikTok (images) aux couleurs du Parvis et de QuenTools. Nouveau : bouton « Générer », l'IA locale écrit la publication complète sur ton Mac." \
            "Installation : ouvrir le .dmg et glisser Studio Posts dans Applications. Au premier lancement : clic droit sur l'application → Ouvrir." > notes.md
          gh release create "studio-posts-v$VERSION" "dist/Studio-Posts-$VERSION-arm64.dmg" \
            --title "Studio Posts $VERSION" --notes-file notes.md --target "${{ github.sha }}"
