<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · QuenTools</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/Quentools/assets/logo.svg" type="image/svg+xml">
<style>
:root{--bg:#f7f6f2;--ink:#16141f;--muted:#5f5b6e;--pri:#5b3df5;--pri-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f0e15;--ink:#f3f1fa;--muted:#a9a4bd;--pri:#8b76ff;--pri-ink:#0f0e15}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
.q{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:18px;background:#5b3df5;color:#ffd23f;font-weight:900;font-size:38px}
h1{font-size:clamp(28px,6vw,40px);margin:20px 0 8px;letter-spacing:-.5px}
p{color:var(--muted);margin:0 0 24px}
a{display:inline-block;background:var(--pri);color:var(--pri-ink);padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <span class="q" aria-hidden="true">Q</span>
  <h1>Cette page n’existe pas</h1>
  <p>Le lien est peut-être incomplet, ou la page a changé d’adresse.</p>
  <a href="/Quentools/">Retour à l’accueil QuenTools</a>
</main>
</body>
</html>
