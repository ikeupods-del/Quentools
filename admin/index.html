<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administration · QuenTools</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/qt.css?v=20261001h">
<script src="../assets/qt-config.js"></script>
<style>
  .adm-head{display:flex;flex-wrap:wrap;gap:var(--s-3);align-items:center;justify-content:space-between;margin-bottom:var(--s-5)}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);margin-bottom:var(--s-6);scrollbar-width:none}
  .tabs button{flex:0 0 auto;font:600 var(--t-sm)/1 var(--f-text);padding:11px 16px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer}
  .tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
  .tabs .count{display:inline-block;min-width:20px;padding:2px 6px;margin-left:6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-3);margin-bottom:var(--s-5)}
  @media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpis div{padding:16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
  .kpis b{display:block;font:700 var(--t-xl)/1.1 var(--f-display)}.kpis span{font-size:var(--t-xs);color:var(--muted)}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:var(--s-4)}
  .filters button{font:600 var(--t-xs)/1 var(--f-text);padding:9px 13px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink);cursor:pointer}
  .filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .filters input{flex:1 1 180px;min-width:0;font:inherit;padding:9px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
  .req{display:grid;gap:var(--s-3);margin-bottom:var(--s-4)}
  .req-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  .req h3{margin:0;font-size:var(--t-lg)}
  .req .meta{display:flex;flex-wrap:wrap;gap:6px}
  .req .need{white-space:pre-wrap;margin:0;color:var(--ink);overflow-wrap:anywhere}
  .req .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .req select,.req input,.req textarea{font:inherit;font-size:var(--t-sm);padding:9px 12px;border-radius:var(--r-sm,10px);border:1px solid var(--line-2);background:var(--bg);color:var(--ink);min-width:0}
  .req textarea{width:100%;min-height:64px;resize:vertical}
  .req .who{font-size:var(--t-sm);color:var(--muted);overflow-wrap:anywhere}
  .st-nouveau{background:var(--accent-soft);color:var(--accent)}.st-gagne{background:var(--ok-soft);color:var(--ok)}.st-perdu{background:var(--bg-2);color:var(--muted)}
  .st-discussion,.st-envoye{background:var(--warn-soft);color:var(--ink)}
  .est-out{font:700 clamp(28px,6vw,44px)/1.1 var(--f-display);margin:var(--s-3) 0}
  .switch{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
  .switch input{width:20px;height:20px;accent-color:var(--accent)}
  .links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s-3)}
  .links a{display:block;padding:16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
  .links a:hover{border-color:var(--accent)}.links small{display:block;color:var(--muted);margin-top:4px}
  pre.rules{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:var(--bg-2);padding:14px;border-radius:var(--r-md);max-height:280px;overflow:auto}
  .st-encours{background:var(--accent-soft);color:var(--ink)}.st-livre{background:var(--ok-soft);color:var(--ok)}
  .req .row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
  .req .row3 input{width:100%;min-width:0}
  .flag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:600 var(--t-xs)/1 var(--f-text);background:var(--warn-soft);color:var(--ink)}
  .thread{display:grid;gap:8px;padding:12px;border-radius:var(--r-md);background:var(--bg-2);border:1px solid var(--line)}
  .msg{padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);max-width:90%;overflow-wrap:anywhere;white-space:pre-wrap;font-size:var(--t-sm)}
  .msg small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
  .msg.client{justify-self:start}.msg.admin{justify-self:end;background:var(--accent-soft)}.msg.systeme{justify-self:center;background:transparent;border-style:dashed;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:var(--s-7) var(--s-4)}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="../" aria-label="QuenTools, accueil"><img class="brand-mark" src="../assets/logo.svg" alt="" width="32" height="32">QuenTools</a>
  <span class="chip">Administration</span>
</div></header>

<main class="section" style="padding-top:var(--s-6)">
  <div class="wrap" id="app"><p class="muted">Chargement…</p></div>
</main>

<script type="module">
const C = window.QT || {}, FBV = '10.14.1';
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => (Math.round(n) || 0).toLocaleString('fr-FR') + ' €';
const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const DEMO = local && new URLSearchParams(location.search).has('demo');
const official = location.protocol === 'https:' && /^(www\.)?quentools\.fr$|^ikeupods-del\.github\.io$/.test(location.hostname);

const STATUS = [['nouveau', 'Nouvelle'], ['discussion', 'En discussion'], ['envoye', 'Devis envoyé'], ['gagne', 'Acceptée'], ['encours', 'En cours'], ['livre', 'Livrée'], ['perdu', 'Perdue']];
const WON = ['gagne', 'encours', 'livre'];
const stLabel = k => (STATUS.find(s => s[0] === k) || STATUS[0])[1];

/* Grille QuenTools (design/TARIFS.md, « Prix QuenTools conseillé ») */
const GRID = {
  'Site vitrine': [200, 400], 'Boutique Shopify': [150, 260], 'Outil sur mesure': [1000, 3000], 'Application complète': [3000, 6000]
};
const EXTRA_PAY = [500, 1500], MAINT = [15, 50];
const LEVEL = { simple: [0, .4], standard: [.3, .7], avance: [.6, 1] };

/* ---------- Données : Firestore (ou démonstration locale) ---------- */
let F = null, user = null, items = [], site = {}, tab = 'demandes', filter = 'actifs', q = '', denied = false;
async function fb() {
  if (F) return F;
  const B = `https://www.gstatic.com/firebasejs/${FBV}/`;
  const [A, Au, Fs] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
  const a = A.initializeApp(C.firebase, 'qt-admin');
  F = { Au, Fs, auth: Au.getAuth(a), db: Fs.getFirestore(a) };
  return F;
}
const demo = {
  items: [
    { id: 'd1', type: 'Site vitrine', nom: 'Julie Martin', email: 'julie@example.com', tel: '06 00 00 00 00', delai: 'Dans le mois', budget: '1 000 à 3 000 €', besoin: 'Je suis fleuriste à Nîmes et je voudrais un site simple avec mes horaires, des photos et un bouton pour commander.', status: 'nouveau', at: new Date(Date.now() - 3600e3).toISOString() },
    { id: 'd2', type: 'Outil sur mesure', nom: 'Karim B.', email: 'karim@example.com', tel: '', delai: 'Dès que possible', budget: 'Je ne sais pas encore', besoin: 'Plombier, je fais mes devis sur Excel. Je veux un outil sur téléphone pour faire un devis devant le client.', status: 'envoye', montant: 1800, note: 'Rappeler jeudi', at: new Date(Date.now() - 5 * 864e5).toISOString() },
    { id: 'd3', type: 'Application complète', nom: 'Asso Les Pattes', email: 'contact@example.org', tel: '', delai: 'Dans les 3 mois', budget: '3 000 à 6 000 €', besoin: 'Application pour suivre les adoptions et les familles d’accueil.', status: 'gagne', montant: 4200, at: new Date(Date.now() - 20 * 864e5).toISOString() }
  ], site: { announceOn: false, announce: '', announceUrl: '', available: true, availText: '' }
};
const ms = v => !v ? 0 : typeof v === 'string' ? Date.parse(v) : v.toMillis ? v.toMillis() : +v;
let notes = {}, threads = {}, openId = null, rulesOld = false, leads = [], leadsErr = false, ebookPdf = null, lq = '';
async function loadLeads() {
  leadsErr = false;
  if (DEMO) { leads = [{ name: 'Camille Durand', email: 'camille@example.com', at: new Date(), source: 'ebook' }, { name: 'Yanis K.', email: 'yanis@example.com', at: new Date(Date.now() - 864e5), source: 'ebook' }]; return; }
  try {
    const { Fs, db } = await fb();
    try { const e = await Fs.getDoc(Fs.doc(db, 'qt_ebook', 'pdf')); ebookPdf = e.exists() ? { size: Math.round((e.data().b64 || '').length * 0.75), at: e.data().updated } : null; } catch (x) { ebookPdf = null; }
    const r = await Fs.getDocs(Fs.query(Fs.collection(db, 'qt_leads'), Fs.orderBy('at', 'desc'), Fs.limit(2000)));
    leads = r.docs.map(d => d.data());
  } catch (e) { leads = []; leadsErr = true; }
}
function viewContacts() {
  if (leadsErr) return `<section class="card" style="padding:var(--s-6)"><h2 style="margin-top:0">Règles à mettre à jour</h2><p>Les contacts de l’e-book s’enregistrent dans une collection protégée. Ouvrez l’onglet <b>Règles</b>, copiez-les dans Firebase et publiez.</p><button class="btn btn-accent" data-tab="regles">Voir les règles</button></section>`;
  const week = Date.now() - 7 * 864e5, lqq = lq.trim().toLowerCase(), shown = leads.filter(l => !lqq || [l.name, l.email].join(' ').toLowerCase().includes(lqq));
  const eb = `<section class="card" style="padding:var(--s-4);margin-bottom:var(--s-4)"><h3 style="margin:0 0 6px">E-book gratuit (PDF)</h3><p class="muted" style="margin:0 0 10px">${ebookPdf ? `PDF en ligne (${Math.round(ebookPdf.size / 1024)} Ko${ms(ebookPdf.at) ? ', mis à jour le ' + new Date(ms(ebookPdf.at)).toLocaleDateString('fr-FR') : ''}). Les inscrits le téléchargent depuis la page e-book.` : 'Pas de PDF en ligne : choisissez le fichier PDF de l’e-book sur votre ordinateur, puis cliquez sur Publier le PDF.'}</p>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input type="file" id="pdf-file" accept="application/pdf"><button class="btn btn-sm btn-accent" data-do="pdf-pub">${ebookPdf ? 'Remplacer' : 'Publier'} le PDF</button>${ebookPdf ? '<button class="btn btn-sm btn-ghost" data-do="pdf-del">Retirer le PDF</button>' : ''}</div></section>`;
  return eb + `<div class="kpis"><div><b>${leads.length}</b><span>contacts inscrits à l’e-book</span></div><div><b>${leads.filter(l => ms(l.at) > week).length}</b><span>sur les 7 derniers jours</span></div></div>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--s-4)"><button class="btn btn-sm btn-accent" data-do="copy-mails">Copier les e-mails</button><button class="btn btn-sm btn-ghost" data-do="csv">Exporter en CSV</button><input type="search" id="lq" placeholder="Rechercher un contact…" value="${esc(lq)}" aria-label="Rechercher un contact" style="flex:1;min-width:160px"></div>
    ${shown.length ? shown.map(l => `<article class="card" style="padding:var(--s-4);margin-bottom:var(--s-3);display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center"><div><b>${esc(l.name || 'Sans nom')}</b><div class="muted" style="overflow-wrap:anywhere">${esc(l.email)}</div></div><span class="row" style="display:flex;gap:8px;align-items:center"><span class="chip">${ms(l.at) ? new Date(ms(l.at)).toLocaleDateString('fr-FR') : ''} · ${esc(l.source || '')}</span><button class="btn btn-sm btn-ghost" data-do="lead-del" data-email="${esc(l.email)}" aria-label="Supprimer ce contact">Supprimer</button></span></article>`).join('') : '<div class="card empty">Aucun contact pour l’instant. Ils apparaissent ici dès qu’un visiteur s’inscrit pour recevoir l’e-book.</div>'}
    <p class="muted" style="font-size:var(--t-xs)">Chaque contact a accepté de recevoir l’e-book et des nouvelles de QuenTools. Pour une demande de suppression, utilisez le bouton « Supprimer » du contact.</p>`;
}
async function load() {
  if (DEMO) { items = demo.items; site = demo.site; return; }
  const { Fs, db } = await fb();
  try {
    const snap = await Fs.getDocs(Fs.query(Fs.collection(db, 'qt_devis'), Fs.orderBy('at', 'desc'), Fs.limit(300)));
    items = snap.docs.map(d => ({ id: d.id, ...d.data() })); denied = false;
  } catch (e) { items = []; denied = /permission/i.test(e.code || e.message); }
  rulesOld = false; notes = {};
  try { const n = await Fs.getDocs(Fs.collection(db, 'qt_notes')); n.docs.forEach(d => { notes[d.id] = d.data(); }); }
  catch (e) { rulesOld = !denied && /permission/i.test(e.code || e.message); }
  for (const it of items) { const n = notes[it.id]; if (n) { it.note = n.text ?? it.note; it.echeance = n.echeance ?? it.echeance; } }
  try { const s = await Fs.getDoc(Fs.doc(db, 'qt_admin', 'config')); site = s.exists() ? s.data() : {}; } catch (e) { site = {}; }
}
async function patch(id, data) {
  const it = items.find(x => x.id === id); Object.assign(it, data);
  if (DEMO) return;
  const { Fs, db } = await fb();
  const priv = {}, pub = {};
  for (const [k, v] of Object.entries(data)) (k === 'note' || k === 'echeance' ? priv : pub)[k === 'note' ? 'text' : k] = v;
  if (Object.keys(priv).length) await Fs.setDoc(Fs.doc(db, 'qt_notes', id), priv, { merge: true });
  if (Object.keys(pub).length) await Fs.updateDoc(Fs.doc(db, 'qt_devis', id), { ...pub, updated: Fs.serverTimestamp() });
}
async function loadThread(id) {
  if (DEMO) return threads[id] || [];
  const { Fs, db } = await fb();
  const r = await Fs.getDocs(Fs.query(Fs.collection(db, 'qt_devis', id, 'messages'), Fs.orderBy('at', 'asc'), Fs.limit(200)));
  return r.docs.map(d => d.data());
}
async function addMsg(id, m) {
  const rec = { from: m.from, text: String(m.text).slice(0, 2000) };
  if (DEMO) { threads[id] = [...(threads[id] || []), { ...rec, at: new Date() }]; return; }
  const { Fs, db } = await fb();
  await Fs.addDoc(Fs.collection(db, 'qt_devis', id, 'messages'), { ...rec, at: Fs.serverTimestamp() });
}
const TPL = {
  recu: 'Bonjour {prenom},\n\nMerci pour votre demande, je l’ai bien reçue. Je reviens vers vous sous 48 h avec mes questions ou une première proposition.\n\nBien à vous,\nQuenTools',
  devis: 'Bonjour {prenom},\n\nVotre devis est prêt : vous le trouverez via le bouton « Voir le devis » de cet espace. Il précise ce qui est inclus et le prix, fixé avant de commencer. Dites-moi si vous avez des questions, ou acceptez-le directement ici.\n\nBien à vous,\nQuenTools',
  relance: 'Bonjour {prenom},\n\nJe me permets de revenir vers vous au sujet du devis envoyé. Avez-vous eu le temps d’y jeter un œil ? Je reste disponible pour l’ajuster si besoin.\n\nBien à vous,\nQuenTools',
  livraison: 'Bonjour {prenom},\n\nVotre projet est prêt et en ligne. Prenez le temps de tout vérifier : je corrige volontiers ce qui doit l’être. Merci pour votre confiance !\n\nBien à vous,\nQuenTools'
};
async function remove(id) {
  items = items.filter(x => x.id !== id);
  if (DEMO) return;
  const { Fs, db } = await fb(); await Fs.deleteDoc(Fs.doc(db, 'qt_devis', id));
}
async function saveSite(data) {
  site = { ...site, ...data };
  try { sessionStorage.removeItem('qt:config'); } catch (e) { /* ignore */ }
  if (DEMO) return;
  const { Fs, db } = await fb(); await Fs.setDoc(Fs.doc(db, 'qt_admin', 'config'), data, { merge: true });
}

/* ---------- Écrans ---------- */
const toast = (m, warn) => { const n = document.getElementById('toast'); if (!n) return; n.innerHTML = `<div class="notice${warn ? ' warn' : ''}">${esc(m)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => n.innerHTML = '', 3500); };
function shell(body) {
  const nb = items.filter(x => (x.status || 'nouveau') === 'nouveau').length;
  document.title = (nb ? `(${nb}) ` : '') + 'Administration · QuenTools';
  const t = (k, l) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`;
  app.innerHTML = `<div class="adm-head"><div><span class="eyebrow">Tableau de bord</span><h1 class="h-section" style="margin:var(--s-2) 0 0">Bonjour 👋</h1></div>
    <div class="row" style="display:flex;gap:8px;align-items:center"><span class="muted" style="font-size:var(--t-xs)">${esc(DEMO ? 'Démonstration' : user && user.email)}</span>${DEMO ? '' : '<button class="btn btn-sm btn-ghost" data-do="logout">Se déconnecter</button>'}</div></div>
    <div class="tabs" role="tablist">${t('demandes', `Demandes${nb ? `<span class="count">${nb}</span>` : ''}`)}${t('estimer', 'Estimer un prix')}${t('site', 'Réglages du site')}${t('liens', 'Raccourcis')}${t('contacts', 'Contacts')}${t('regles', 'Règles')}${rulesOld ? '<span class="count">!</span>' : ''}</div>
    <div id="toast" role="status" aria-live="polite"></div>${body}`;
}
function render() {
  shell(tab === 'demandes' ? viewRequests() : tab === 'estimer' ? viewEstimate() : tab === 'site' ? viewSite() : tab === 'regles' ? viewRules() : tab === 'contacts' ? viewContacts() : viewLinks());
  if (tab === 'estimer') estimate();
}

function rulesText() {
  const mail = (user && user.email) || 'VOTRE_ADRESSE_GMAIL';
  return `function qtAdmin() { return request.auth != null && request.auth.token.email == '${mail}' && request.auth.token.email_verified == true; }
function qtClient(d) { return request.auth != null && request.auth.token.email_verified == true && d.emailLower == request.auth.token.email.lower(); }
match /qt_admin/{doc} { allow read: if true; allow write: if qtAdmin(); }
match /qt_notes/{id} { allow read, write: if qtAdmin(); }
match /qt_ebook/{id} { allow read: if request.auth != null && request.auth.token.email_verified == true; allow write: if qtAdmin(); }
match /qt_leads/{id} {
  allow create, update: if request.auth != null && request.auth.token.email_verified == true && id == request.auth.token.email.lower()
    && request.resource.data.keys().hasOnly(['email','name','at','source','consent'])
    && request.resource.data.consent == true && request.resource.data.at is timestamp
    && request.resource.data.email == request.auth.token.email;
  allow read, delete: if qtAdmin();
}
match /qt_devis/{id} {
  allow create: if request.resource.data.keys().hasOnly(['type','besoin','delai','budget','nom','email','emailLower','tel','status','at'])
    && request.resource.data.status == 'nouveau' && request.resource.data.at is timestamp
    && request.resource.data.besoin is string && request.resource.data.besoin.size() >= 20 && request.resource.data.besoin.size() <= 3000
    && request.resource.data.nom is string && request.resource.data.nom.size() > 0 && request.resource.data.nom.size() <= 120
    && request.resource.data.email is string && request.resource.data.email.matches('^[^@ ]+@[^@ ]+[.][^@ ]+$') && request.resource.data.email.size() <= 160
    && (!('emailLower' in request.resource.data) || request.resource.data.emailLower == request.resource.data.email.lower())
    && request.resource.data.type is string && request.resource.data.type.size() <= 40
    && request.resource.data.delai is string && request.resource.data.delai.size() <= 40
    && request.resource.data.budget is string && request.resource.data.budget.size() <= 40
    && request.resource.data.tel is string && request.resource.data.tel.size() <= 30;
  allow read: if qtAdmin() || qtClient(resource.data);
  allow update: if qtAdmin() || (qtClient(resource.data)
    && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['reponse','reponseAt','clientMsgAt'])
    && request.resource.data.get('reponse', '') in ['', 'accepte', 'refuse']);
  allow delete: if qtAdmin();
  match /messages/{mid} {
    allow read: if qtAdmin() || qtClient(get(/databases/$(database)/documents/qt_devis/$(id)).data);
    allow create: if request.resource.data.keys().hasOnly(['from','text','at'])
      && request.resource.data.text is string && request.resource.data.text.size() > 0 && request.resource.data.text.size() <= 2000
      && request.resource.data.at is timestamp
      && ((qtAdmin() && request.resource.data.from in ['admin','systeme'])
        || (qtClient(get(/databases/$(database)/documents/qt_devis/$(id)).data) && request.resource.data.from == 'client'));
    allow update, delete: if qtAdmin();
  }
}`;
}
function viewRules() {
  return `<section class="card" style="padding:clamp(20px,4vw,36px)"><h2 style="margin-top:0">Règles de sécurité Firestore</h2>
    <p>À coller dans Firebase pour activer l’espace client et le suivi complet : ouvrez <a href="https://console.firebase.google.com/project/${esc(C.firebase.projectId)}/firestore/rules" target="_blank" rel="noopener">les règles</a>, remplacez le bloc <code>match /qt_…</code> existant par celui-ci (gardez les règles des autres applications), puis cliquez sur « Publier ».</p>
    ${rulesOld ? '<div class="notice warn" style="margin-bottom:var(--s-4)">Les règles actuelles ne contiennent pas encore les notes privées : mettez-les à jour.</div>' : ''}
    <pre class="rules">${esc(rulesText())}</pre><div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-accent" data-do="copy-rules">Copier les règles</button></div></section>`;
}
function viewRequests() {
  if (denied) return `<section class="card" style="padding:var(--s-6)"><h2>Une étape à faire une seule fois</h2>
    <p>Pour recevoir les demandes ici, Firebase doit savoir que vous êtes le propriétaire. Ouvrez l’onglet <b>Règles</b> et suivez les instructions.</p>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-accent" data-tab="regles">Voir les règles</button><button class="btn btn-ghost" data-do="reload">J’ai publié les règles</button></div></section>`;
  const st0 = x => x.status || 'nouveau', act = x => !['livre', 'perdu'].includes(st0(x));
  const month = Date.now() - 30 * 864e5, day = 864e5;
  const won = items.filter(x => WON.includes(st0(x))), closed = items.filter(x => [...WON, 'perdu'].includes(st0(x)));
  const relance = items.filter(x => st0(x) === 'envoye' && !x.reponse && Date.now() - (ms(x.updated) || ms(x.at)) > 7 * day);
  const retard = items.filter(x => st0(x) === 'nouveau' && Date.now() - ms(x.at) > 2 * day);
  const echus = items.filter(x => x.echeance && act(x) && Date.parse(x.echeance) <= Date.now() + day);
  const msgs = items.filter(x => ms(x.clientMsgAt) > ms(x.seenAt));
  const kpis = `<div class="kpis"><div><b>${items.filter(x => st0(x) === 'nouveau').length}</b><span>nouvelles demandes${retard.length ? ` (dont ${retard.length} sans réponse depuis 48 h)` : ''}</span></div>
    <div><b>${items.filter(x => ms(x.at) > month).length}</b><span>demandes sur 30 jours</span></div>
    <div><b>${closed.length ? Math.round(100 * won.length / closed.length) + ' %' : '—'}</b><span>taux de réussite</span></div>
    <div><b>${eur(won.reduce((s, x) => s + (+x.montant || 0), 0))}</b><span>acceptés (${eur(items.filter(x => st0(x) === 'envoye').reduce((s, x) => s + (+x.montant || 0), 0))} en attente)</span></div></div>`;
  const todo = [msgs.length && `<span class="flag">💬 ${msgs.length} nouveau${msgs.length > 1 ? 'x' : ''} message${msgs.length > 1 ? 's' : ''} client</span>`,
    relance.length && `<span class="flag">⏰ ${relance.length} devis à relancer (plus de 7 jours)</span>`,
    echus.length && `<span class="flag">📅 ${echus.length} échéance${echus.length > 1 ? 's' : ''} proche${echus.length > 1 ? 's' : ''}</span>`,
    items.filter(x => x.reponse === 'accepte' && st0(x) === 'envoye').length && `<span class="flag">✅ devis accepté par le client : à confirmer</span>`].filter(Boolean);
  const fl = [['actifs', 'À traiter'], ...STATUS, ['tous', 'Toutes']];
  const filters = `<div class="filters">${fl.map(([k, l]) => `<button data-filter="${k}" aria-pressed="${filter === k}">${l}</button>`).join('')}<input type="search" id="q" placeholder="Rechercher un nom, un mot…" value="${esc(q)}" aria-label="Rechercher"><button class="btn btn-sm btn-ghost" data-do="csv-demandes">Exporter (CSV)</button></div>`;
  const qq = q.trim().toLowerCase();
  const list = items.filter(x => filter === 'tous' ? true : filter === 'actifs' ? act(x) : st0(x) === filter)
    .filter(x => !qq || [x.nom, x.email, x.besoin, x.type, x.note].join(' ').toLowerCase().includes(qq));
  const thread = x => { const t = threads[x.id];
    return `<div class="thread">${!t ? '<span class="muted">Chargement…</span>' : t.length ? t.map(m => `<div class="msg ${esc(m.from)}"><small>${m.from === 'client' ? 'Client' : m.from === 'admin' ? 'Vous' : 'Suivi'} · ${ms(m.at) ? new Date(ms(m.at)).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : ''}</small>${esc(m.text)}</div>`).join('') : '<span class="muted">Aucun échange pour l’instant.</span>'}
      <select data-tpl aria-label="Réponse type"><option value="">Réponse type…</option><option value="recu">Demande reçue</option><option value="devis">Devis envoyé</option><option value="relance">Relance</option><option value="livraison">Livraison</option></select>
      <textarea data-msg placeholder="Votre message au client (visible dans son espace)" maxlength="2000" aria-label="Message au client"></textarea>
      <div class="row"><button class="btn btn-sm btn-accent" data-do="send">Envoyer dans l’espace client</button></div></div>`; };
  const card = x => { const st = st0(x), d = ms(x.at), nb = items.filter(i => String(i.email).toLowerCase() === String(x.email).toLowerCase()).length, unread = ms(x.clientMsgAt) > ms(x.seenAt);
    return `<article class="card req" data-id="${esc(x.id)}">
      <div class="req-top"><h3>${esc(x.nom)}</h3><span class="chip st-${st}">${stLabel(st)}</span></div>
      <div class="meta"><span class="chip">${esc(x.type)}</span><span class="chip">⏱ ${esc(x.delai)}</span><span class="chip">💶 ${esc(x.budget)}</span>${d ? `<span class="chip">${new Date(d).toLocaleDateString('fr-FR')}</span>` : ''}${nb > 1 ? `<span class="chip">🔁 ${nb} demandes de ce client</span>` : ''}${x.reponse === 'accepte' ? '<span class="flag">✅ Devis accepté par le client</span>' : x.reponse === 'refuse' ? '<span class="flag">❌ Devis refusé par le client</span>' : ''}${unread ? '<span class="flag">💬 Nouveau message</span>' : ''}</div>
      <p class="need">${esc(x.besoin)}</p>
      <div class="who">✉️ ${esc(x.email)}${x.tel ? ` · 📞 ${esc(x.tel)}` : ''}</div>
      <div class="row3"><select data-field="status" aria-label="Statut">${STATUS.map(([k, l]) => `<option value="${k}"${k === st ? ' selected' : ''}>${l}</option>`).join('')}</select>
        <input data-field="montant" type="number" min="0" step="50" inputmode="numeric" placeholder="Montant (€)" value="${x.montant ?? ''}" aria-label="Montant du devis en euros">
        <input data-field="echeance" type="date" value="${esc(x.echeance || '')}" aria-label="Échéance (rappel privé)" title="Échéance (rappel privé)"></div>
      <input data-field="lien" type="url" maxlength="400" placeholder="Lien du devis (visible client)" value="${esc(x.lien || '')}" aria-label="Lien du devis">
      <textarea data-field="note" placeholder="Note privée (rappel, ce qui a été dit…) : jamais visible par le client" aria-label="Note privée">${esc(x.note || '')}</textarea>
      <div class="row"><button class="btn btn-sm btn-accent" data-do="thread">${openId === x.id ? 'Masquer les échanges' : 'Échanges avec le client'}</button><button class="btn btn-sm btn-ghost" data-do="reply">E-mail</button>
        ${x.tel ? `<a class="btn btn-sm btn-ghost" href="tel:${esc(String(x.tel).replace(/[^\d+]/g, ''))}">Appeler</a>` : ''}
        <button class="btn btn-sm btn-ghost" data-do="estimate">Estimer</button><button class="btn btn-sm btn-ghost" data-do="copy">Copier</button>
        <button class="btn btn-sm btn-ghost" data-do="del" style="margin-left:auto">Supprimer</button></div>
      ${openId === x.id ? thread(x) : ''}</article>`; };
  return (rulesOld ? '<div class="notice warn" style="margin-bottom:var(--s-4)">Les règles Firebase ne sont pas à jour (notes privées, espace client) : ouvrez l’onglet <b>Règles</b>.</div>' : '') + kpis + (todo.length ? `<div class="row" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--s-4)">${todo.join('')}</div>` : '') + filters
    + (list.length ? list.map(card).join('') : `<div class="card empty">${items.length ? 'Aucune demande dans ce filtre.' : 'Aucune demande pour l’instant. Elles arrivent ici dès qu’un visiteur remplit le formulaire de devis.'}</div>`);
}

        <div class="field"><label for="e-lvl">Ampleur</label><select id="e-lvl">${opt('simple', 'Simple (peu de pages ou d’écrans)')}${opt('standard', 'Standard', true)}${opt('avance', 'Avancée (beaucoup de fonctions)')}</select></div></div>

    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap">${x ? '<button class="btn btn-accent" data-do="est-reply">Envoyer cette proposition</button><button class="btn btn-ghost" data-do="est-save">Noter ce montant sur la demande</button>' : ''}<button class="btn btn-ghost" data-do="est-copy">Copier le texte</button></div>
    <p class="muted" style="font-size:var(--t-xs)">Fourchettes de la grille QuenTools (design/TARIFS.md). À ajuster selon le client : c’est une aide, pas un engagement.</p></section>`;
}
let estText = '', estMid = 0;
function estimate() {
  const g = id => document.getElementById(id); if (!g('e-type')) return;
  const [lo, hi] = GRID[g('e-type').value], [a, b] = LEVEL[g('e-lvl').value];
  const r50 = n => Math.round(n / 50) * 50;
  let min = r50(lo + (hi - lo) * a), max = r50(lo + (hi - lo) * b);
  if (g('e-pay').checked) { min += EXTRA_PAY[0]; max += EXTRA_PAY[1]; }
  estMid = r50((min + max) / 2);
  g('e-out').textContent = `${eur(min)} – ${eur(max)}`;
  const m = g('e-maint').checked;
  g('e-sub').textContent = `Proposition équilibrée : ${eur(estMid)}${m ? ` + maintenance ${eur(MAINT[0])} à ${eur(MAINT[1])}/mois` : ''}`;
  const x = estFor && items.find(i => i.id === estFor), first = x ? String(x.nom).split(' ')[0] : '';
  estText = `Bonjour${first ? ' ' + first : ''},\n\nMerci pour votre demande. D’après ce que vous m’avez décrit (${g('e-type').value.toLowerCase()}${g('e-pay').checked ? ', avec paiement en ligne et administration' : ''}), je vous propose une réalisation entre ${eur(min)} et ${eur(max)}, le prix exact étant fixé ensemble avant de commencer.${m ? `\nEn option, une maintenance (mises à jour, sauvegardes, petites évolutions) entre ${eur(MAINT[0])} et ${eur(MAINT[1])} par mois.` : ''}\n\nPour la suite : un court échange pour préciser le besoin, puis une première version à tester avant de vous engager sur le reste.\n\nBien à vous,\nQuenTools`;
}

/* ---------- Actions ---------- */
const copy = async t => { try { await navigator.clipboard.writeText(t); toast('Copié ✓'); } catch (e) { toast('Copie impossible sur cet appareil', true); } };
const mailto = (x, body) => `mailto:${encodeURIComponent(x.email)}?subject=${encodeURIComponent('Votre demande de devis : ' + x.type)}&body=${encodeURIComponent(body)}`;
const fail = e => toast(/permission/i.test(e && (e.code || e.message)) ? 'Refusé : vérifiez les règles Firestore.' : 'Enregistrement impossible (connexion ?)', true);
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-tab],[data-filter],[data-do]'); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; if (tab !== 'estimer') estFor = null; if (tab === 'contacts') { await loadLeads(); } return render(); }
  if (b.dataset.filter) { filter = b.dataset.filter; return render(); }
  const card = b.closest('.req'), x = card && items.find(i => i.id === card.dataset.id), d = b.dataset.do;
  try {
    if (d === 'logout') { const { Au, auth } = await fb(); await Au.signOut(auth); }
    else if (d === 'reload') { await load(); render(); }
    else if (d === 'copy-rules') copy(rulesText());
    else if (d === 'pdf-pub') {
      const f = document.getElementById('pdf-file') && document.getElementById('pdf-file').files[0];
      if (!f) return toast('Choisissez d’abord le fichier PDF', true);
      if (f.type !== 'application/pdf') return toast('Ce fichier n’est pas un PDF', true);
      if (f.size > 700000) return toast('PDF trop lourd (700 Ko maximum)', true);
      toast('Publication du PDF…');
      const buf = new Uint8Array(await f.arrayBuffer()); let bin = ''; for (let i = 0; i < buf.length; i += 8192) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 8192));
      if (DEMO) { ebookPdf = { size: f.size, at: new Date() }; return render(); }
      const { Fs, db } = await fb(); await Fs.setDoc(Fs.doc(db, 'qt_ebook', 'pdf'), { b64: btoa(bin), name: f.name.slice(0, 120), updated: Fs.serverTimestamp() });
      await loadLeads(); render(); toast('PDF publié ✓');
    }
    else if (d === 'pdf-del') {
      if (!confirm('Retirer le PDF ? Le bouton de téléchargement ne fonctionnera plus.')) return;
      if (!DEMO) { const { Fs, db } = await fb(); await Fs.deleteDoc(Fs.doc(db, 'qt_ebook', 'pdf')); }
      ebookPdf = null; render(); toast('PDF retiré');
    }
    else if (d === 'lead-del') {
      const em = b.dataset.email; if (!em || !confirm('Supprimer définitivement le contact ' + em + ' ?')) return;
      if (!DEMO) { const { Fs, db } = await fb(); await Fs.deleteDoc(Fs.doc(db, 'qt_leads', String(em).toLowerCase())); }
      leads = leads.filter(l => l.email !== em); render(); toast('Contact supprimé');
    }
    else if (d === 'csv-demandes') {
      const q2 = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const csv = '\ufeffdate;nom;email;telephone;type;delai;budget;statut;montant;besoin\n' + items.map(x => [ms(x.at) ? new Date(ms(x.at)).toISOString().slice(0, 10) : '', x.nom, x.email, x.tel, x.type, x.delai, x.budget, stLabel(x.status || 'nouveau'), x.montant, x.besoin].map(q2).join(';')).join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'demandes-quentools.csv'; a.click();
    }
    else if (d === 'copy-mails') copy(leads.map(l => l.email).join(', '));
    else if (d === 'csv') {
      const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const csv = '\ufeffnom;email;date;source\n' + leads.map(l => [l.name, l.email, ms(l.at) ? new Date(ms(l.at)).toISOString().slice(0, 10) : '', l.source].map(q).join(';')).join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'contacts-quentools.csv'; a.click();
    }
    else if (d === 'thread') {
      if (openId === x.id) { openId = null; return render(); }
      openId = x.id; threads[x.id] = null; render();
      threads[x.id] = await loadThread(x.id); await patch(x.id, { seenAt: new Date() }); render();
    }
    else if (d === 'send') {
      const t = card.querySelector('[data-msg]').value.trim(); if (!t) return toast('Écrivez un message', true);
      await addMsg(x.id, { from: 'admin', text: t }); threads[x.id] = await loadThread(x.id); render(); toast('Message envoyé ✓');
    }
    else if (d === 'reply') { location.href = mailto(x, `Bonjour ${String(x.nom).split(' ')[0]},\n\nMerci pour votre demande. \n\nBien à vous,\nQuenTools\n\n---\nVotre message :\n${x.besoin}`); if ((x.status || 'nouveau') === 'nouveau') { await patch(x.id, { status: 'discussion' }); render(); } }
    else if (d === 'copy') copy(`${x.nom} <${x.email}>${x.tel ? ' · ' + x.tel : ''}\n${x.type} · ${x.delai} · ${x.budget}\n\n${x.besoin}`);
    else if (d === 'estimate') { estFor = x.id; tab = 'estimer'; render(); }
    else if (d === 'del') { if (confirm(`Supprimer définitivement la demande de ${x.nom} ?`)) { await remove(x.id); render(); toast('Demande supprimée'); } }
    else if (d === 'est-copy') copy(estText);
    else if (d === 'est-reply' || d === 'est-save') {
      const y = items.find(i => i.id === estFor); if (!y) return;
      await patch(y.id, { montant: estMid, status: ['gagne', 'perdu'].includes(y.status) ? y.status : 'envoye' });
      if (d === 'est-reply') location.href = mailto(y, estText); else toast(`Montant noté : ${eur(estMid)}`);
    }
    else if (d === 'save-site') {
      const f = document.getElementById('site-form'), g = n => f.elements[n];
      const url = g('announceUrl').value.trim(), fe = g('formEndpoint').value.trim();
      if (url && !/^(https:\/\/|\.{0,2}\/|#|[a-z0-9-]+\/)/i.test(url)) return toast('Le lien doit commencer par https:// ou être une page du site (ex. ebook/)', true);
      if (fe && !/^https:\/\//.test(fe)) return toast('Le relais doit commencer par https://', true);
      if (g('email').value && !g('email').checkValidity()) return toast('Adresse e-mail invalide', true);
      await saveSite({ announceOn: g('announceOn').checked, announce: g('announce').value.trim(), announceUrl: url, available: g('available').checked,
        availText: g('availText').value.trim(), email: g('email').value.trim(), tiktok: g('tiktok').value.trim().replace(/^@/, ''), formEndpoint: fe });
      toast('Réglages enregistrés ✓');
    }
  } catch (err) { fail(err); }
});
app.addEventListener('change', async e => {
  const el = e.target;
  if (el.closest('#est')) return estimate();
  const card = el.closest('.req'); if (!card || !el.dataset.field) return;
  const v = el.dataset.field === 'montant' ? (el.value === '' ? null : Math.max(0, Math.round(+el.value))) : el.value.slice(0, 2000);
  try { await patch(card.dataset.id, { [el.dataset.field]: v }); if (el.dataset.field === 'status') { await addMsg(card.dataset.id, { from: 'systeme', text: 'Statut : ' + stLabel(v) }); if (openId === card.dataset.id) threads[openId] = await loadThread(openId); } if (!['note', 'echeance', 'lien'].includes(el.dataset.field)) render(); toast('Enregistré ✓'); } catch (err) { fail(err); }
});
app.addEventListener('input', e => { if (e.target.id === 'lq') { lq = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById('lq'); n.focus(); n.setSelectionRange(pos, pos); return; } if (e.target.id === 'q') { q = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); } });

app.addEventListener('change', e => {
  const sel = e.target.closest('[data-tpl]'); if (!sel || !sel.value) return;
  const card = sel.closest('.req'), x = items.find(i => i.id === card.dataset.id), ta = card.querySelector('[data-msg]');
  ta.value = TPL[sel.value].replace('{prenom}', String(x.nom).split(' ')[0]); sel.value = '';
});

/* ---------- Connexion ---------- */
async function isOwner(email) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(email || '').trim().toLowerCase()));
  return (C.ownerHashes || []).includes([...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join(''));
}
const gate = html => { app.innerHTML = `<section class="card" style="padding:clamp(24px,5vw,48px);max-width:560px;margin:0 auto;text-align:center">${html}</section>`; };
// Actualisation automatique des demandes toutes les 90 s (sans toucher à ce que vous êtes en train de saisir).
setInterval(async () => {
  if (DEMO || !user || tab !== 'demandes' || document.hidden) return;
  const f = document.activeElement; if (f && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName)) return;
  try { await load(); render(); } catch (e) { /* réseau indisponible : on réessaiera */ }
}, 90000);
async function start() {
  if (DEMO) { await load(); return render(); }
  if (!official && !local) return gate('<h1 class="h-section">Administration</h1><p class="muted">Disponible uniquement sur le site officiel de QuenTools.</p>');
  let A;
  try { A = await fb(); } catch (e) { return gate('<h1 class="h-section">Hors connexion</h1><p class="muted">Impossible de joindre Google. Vérifiez la connexion puis rechargez.</p>'); }
  A.Au.onAuthStateChanged(A.auth, async u => {
    user = u;
    if (!u) return gate(`<h1 class="h-section">Administration</h1><p class="muted">Espace réservé au propriétaire de QuenTools.</p><button class="btn btn-accent" id="login" style="margin-top:var(--s-4)">Se connecter avec Google</button><p id="lerr" class="muted"></p>`);
    if (!(await isOwner(u.email))) return gate(`<h1 class="h-section">Accès réservé</h1><p class="muted">Le compte ${esc(u.email)} n’a pas accès à l’administration.</p><button class="btn btn-ghost" data-do="logout">Changer de compte</button>`);
    app.innerHTML = '<p class="muted">Chargement des demandes…</p>'; await load(); render();
  });
}
app.addEventListener('click', async e => {
  if (e.target.id !== 'login') return;
  try { const { Au, auth } = await fb(); await Au.signInWithPopup(auth, new Au.GoogleAuthProvider()); }
  catch (err) { const m = { 'auth/popup-closed-by-user': 'Connexion annulée', 'auth/popup-blocked': 'Autorisez les fenêtres pop-up pour ce site, puis réessayez', 'auth/unauthorized-domain': 'Domaine non autorisé dans Firebase' }; document.getElementById('lerr').textContent = m[err.code] || 'Connexion impossible'; }
});
start();
</script>
