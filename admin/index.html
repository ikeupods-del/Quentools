<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administration · QuenTools</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/qt.css">
<script src="../assets/qt-config.js"></script>
<style>
  .adm-head{display:flex;flex-wrap:wrap;gap:var(--s-3);align-items:center;justify-content:space-between;margin-bottom:var(--s-5)}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);margin-bottom:var(--s-6);scrollbar-width:none}
  .tabs button{flex:0 0 auto;font:600 var(--t-sm)/1 var(--f-text);padding:11px 16px;border-radius:999px;border:0;background:transparent;color:var(--muted);cursor:pointer}
  .tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
  .tabs .count{display:inline-block;min-width:20px;padding:2px 6px;margin-left:6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-3);margin-bottom:var(--s-5)}
  @media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpis div{padding:16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
  .kpis b{display:block;font:700 var(--t-xl)/1.1 var(--f-display)}.kpis span{font-size:var(--t-xs);color:var(--muted)}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:var(--s-4)}
  .filters button{font:600 var(--t-xs)/1 var(--f-text);padding:9px 13px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink);cursor:pointer}
  .filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .filters input{flex:1 1 180px;min-width:0;font:inherit;padding:9px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
  .req{display:grid;gap:var(--s-3);margin-bottom:var(--s-4)}
  .req-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  .req h3{margin:0;font-size:var(--t-lg)}
  .req .meta{display:flex;flex-wrap:wrap;gap:6px}
  .req .need{white-space:pre-wrap;margin:0;color:var(--ink);overflow-wrap:anywhere}
  .req .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .req select,.req input,.req textarea{font:inherit;font-size:var(--t-sm);padding:9px 12px;border-radius:var(--r-sm,10px);border:1px solid var(--line-2);background:var(--bg);color:var(--ink);min-width:0}
  .req textarea{width:100%;min-height:64px;resize:vertical}
  .req .who{font-size:var(--t-sm);color:var(--muted);overflow-wrap:anywhere}
  .st-nouveau{background:var(--accent-soft);color:var(--accent)}.st-gagne{background:var(--ok-soft);color:var(--ok)}.st-perdu{background:var(--bg-2);color:var(--muted)}
  .st-discussion,.st-envoye{background:var(--warn-soft);color:var(--ink)}
  .est-out{font:700 clamp(28px,6vw,44px)/1.1 var(--f-display);margin:var(--s-3) 0}
  .switch{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
  .switch input{width:20px;height:20px;accent-color:var(--accent)}
  .links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s-3)}
  .links a{display:block;padding:16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
  .links a:hover{border-color:var(--accent)}.links small{display:block;color:var(--muted);margin-top:4px}
  pre.rules{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:var(--bg-2);padding:14px;border-radius:var(--r-md);max-height:280px;overflow:auto}
  .empty{text-align:center;color:var(--muted);padding:var(--s-7) var(--s-4)}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="../" aria-label="QuenTools, accueil"><img class="brand-mark" src="../assets/logo.svg" alt="" width="32" height="32">QuenTools</a>
  <span class="chip">Administration</span>
</div></header>

<main class="section" style="padding-top:var(--s-6)">
  <div class="wrap" id="app"><p class="muted">Chargement…</p></div>
</main>

<script type="module">
const C = window.QT || {}, FBV = '10.14.1';
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => (Math.round(n) || 0).toLocaleString('fr-FR') + ' €';
const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const DEMO = local && new URLSearchParams(location.search).has('demo');
const official = location.protocol === 'https:' && /^ikeupods-del\.github\.io$/.test(location.hostname);

const STATUS = [['nouveau', 'Nouvelle'], ['discussion', 'En discussion'], ['envoye', 'Devis envoyé'], ['gagne', 'Gagnée'], ['perdu', 'Perdue']];
const stLabel = k => (STATUS.find(s => s[0] === k) || STATUS[0])[1];

/* Grille QuenTools (design/TARIFS.md, « Prix QuenTools conseillé ») */
const GRID = {
  'Site vitrine': [200, 400], 'Boutique Shopify': [150, 260], 'Outil sur mesure': [1000, 3000], 'Application complète': [3000, 6000]
};
const EXTRA_PAY = [500, 1500], MAINT = [15, 50];
const LEVEL = { simple: [0, .4], standard: [.3, .7], avance: [.6, 1] };

/* ---------- Données : Firestore (ou démonstration locale) ---------- */
let F = null, user = null, items = [], site = {}, tab = 'demandes', filter = 'actifs', q = '', denied = false;
async function fb() {
  if (F) return F;
  const B = `https://www.gstatic.com/firebasejs/${FBV}/`;
  const [A, Au, Fs] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
  const a = A.initializeApp(C.firebase, 'qt-admin');
  F = { Au, Fs, auth: Au.getAuth(a), db: Fs.getFirestore(a) };
  return F;
}
const demo = {
  items: [
    { id: 'd1', type: 'Site vitrine', nom: 'Julie Martin', email: 'julie@example.com', tel: '06 00 00 00 00', delai: 'Dans le mois', budget: '1 000 à 3 000 €', besoin: 'Je suis fleuriste à Nîmes et je voudrais un site simple avec mes horaires, des photos et un bouton pour commander.', status: 'nouveau', at: new Date(Date.now() - 3600e3).toISOString() },
    { id: 'd2', type: 'Outil sur mesure', nom: 'Karim B.', email: 'karim@example.com', tel: '', delai: 'Dès que possible', budget: 'Je ne sais pas encore', besoin: 'Plombier, je fais mes devis sur Excel. Je veux un outil sur téléphone pour faire un devis devant le client.', status: 'envoye', montant: 1800, note: 'Rappeler jeudi', at: new Date(Date.now() - 5 * 864e5).toISOString() },
    { id: 'd3', type: 'Application complète', nom: 'Asso Les Pattes', email: 'contact@example.org', tel: '', delai: 'Dans les 3 mois', budget: '3 000 à 6 000 €', besoin: 'Application pour suivre les adoptions et les familles d’accueil.', status: 'gagne', montant: 4200, at: new Date(Date.now() - 20 * 864e5).toISOString() }
  ], site: { announceOn: false, announce: '', announceUrl: '', available: true, availText: '' }
};
const ms = v => !v ? 0 : typeof v === 'string' ? Date.parse(v) : v.toMillis ? v.toMillis() : +v;
async function load() {
  if (DEMO) { items = demo.items; site = demo.site; return; }
  const { Fs, db } = await fb();
  try {
    const snap = await Fs.getDocs(Fs.query(Fs.collection(db, 'qt_devis'), Fs.orderBy('at', 'desc'), Fs.limit(300)));
    items = snap.docs.map(d => ({ id: d.id, ...d.data() })); denied = false;
  } catch (e) { items = []; denied = /permission/i.test(e.code || e.message); }
  try { const s = await Fs.getDoc(Fs.doc(db, 'qt_admin', 'config')); site = s.exists() ? s.data() : {}; } catch (e) { site = {}; }
}
async function patch(id, data) {
  const it = items.find(x => x.id === id); Object.assign(it, data);
  if (DEMO) return;
  const { Fs, db } = await fb(); await Fs.updateDoc(Fs.doc(db, 'qt_devis', id), { ...data, updated: Fs.serverTimestamp() });
}
async function remove(id) {
  items = items.filter(x => x.id !== id);
  if (DEMO) return;
  const { Fs, db } = await fb(); await Fs.deleteDoc(Fs.doc(db, 'qt_devis', id));
}
async function saveSite(data) {
  site = { ...site, ...data };
  try { sessionStorage.removeItem('qt:config'); } catch (e) { /* ignore */ }
  if (DEMO) return;
  const { Fs, db } = await fb(); await Fs.setDoc(Fs.doc(db, 'qt_admin', 'config'), data, { merge: true });
}

/* ---------- Écrans ---------- */
const toast = (m, warn) => { const n = document.getElementById('toast'); if (!n) return; n.innerHTML = `<div class="notice${warn ? ' warn' : ''}">${esc(m)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => n.innerHTML = '', 3500); };
function shell(body) {
  const nb = items.filter(x => (x.status || 'nouveau') === 'nouveau').length;
  const t = (k, l) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`;
  app.innerHTML = `<div class="adm-head"><div><span class="eyebrow">Tableau de bord</span><h1 class="h-section" style="margin:var(--s-2) 0 0">Bonjour 👋</h1></div>
    <div class="row" style="display:flex;gap:8px;align-items:center"><span class="muted" style="font-size:var(--t-xs)">${esc(DEMO ? 'Démonstration' : user && user.email)}</span>${DEMO ? '' : '<button class="btn btn-sm btn-ghost" data-do="logout">Se déconnecter</button>'}</div></div>
    <div class="tabs" role="tablist">${t('demandes', `Demandes${nb ? `<span class="count">${nb}</span>` : ''}`)}${t('estimer', 'Estimer un prix')}${t('site', 'Réglages du site')}${t('liens', 'Raccourcis')}</div>
    <div id="toast" role="status" aria-live="polite"></div>${body}`;
}
function render() {
  shell(tab === 'demandes' ? viewRequests() : tab === 'estimer' ? viewEstimate() : tab === 'site' ? viewSite() : viewLinks());
  if (tab === 'estimer') estimate();
}

function rulesText() {
  const mail = (user && user.email) || 'VOTRE_ADRESSE_GMAIL';
  return `function qtAdmin() { return request.auth != null && request.auth.token.email == '${mail}' && request.auth.token.email_verified == true; }
match /qt_admin/{doc} { allow read: if true; allow write: if qtAdmin(); }
match /qt_devis/{id} {
  allow create: if request.resource.data.keys().hasOnly(['type','besoin','delai','budget','nom','email','tel','status','at'])
    && request.resource.data.status == 'nouveau' && request.resource.data.at is timestamp
    && request.resource.data.besoin is string && request.resource.data.besoin.size() >= 20 && request.resource.data.besoin.size() <= 3000
    && request.resource.data.nom is string && request.resource.data.nom.size() > 0 && request.resource.data.nom.size() <= 120
    && request.resource.data.email is string && request.resource.data.email.matches('^[^@ ]+@[^@ ]+[.][^@ ]+$') && request.resource.data.email.size() <= 160
    && request.resource.data.type is string && request.resource.data.type.size() <= 40
    && request.resource.data.delai is string && request.resource.data.delai.size() <= 40
    && request.resource.data.budget is string && request.resource.data.budget.size() <= 40
    && request.resource.data.tel is string && request.resource.data.tel.size() <= 30;
  allow read, update, delete: if qtAdmin();
}`;
}

function viewRequests() {
  if (denied) return `<section class="card" style="padding:var(--s-6)"><h2>Une étape à faire une seule fois</h2>
    <p>Pour recevoir les demandes ici, Firebase doit savoir que vous êtes le propriétaire. Ouvrez <a href="https://console.firebase.google.com/project/${esc(C.firebase.projectId)}/firestore/rules" rel="noopener">Firebase → Firestore → Règles</a>, collez ce bloc à l’intérieur de <code>match /databases/{database}/documents { … }</code> (à côté des règles de Wouf), puis « Publier ».</p>
    <pre class="rules">${esc(rulesText())}</pre><div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-accent" data-do="copy-rules">Copier les règles</button><button class="btn btn-ghost" data-do="reload">J’ai publié, recharger</button></div></section>`;
  const act = x => !['gagne', 'perdu'].includes(x.status || 'nouveau');
  const month = Date.now() - 30 * 864e5;
  const won = items.filter(x => x.status === 'gagne'), closed = items.filter(x => ['gagne', 'perdu'].includes(x.status));
  const kpis = `<div class="kpis"><div><b>${items.filter(x => (x.status || 'nouveau') === 'nouveau').length}</b><span>nouvelles demandes</span></div>
    <div><b>${items.filter(x => ms(x.at) > month).length}</b><span>demandes sur 30 jours</span></div>
    <div><b>${closed.length ? Math.round(100 * won.length / closed.length) + ' %' : '—'}</b><span>taux de réussite</span></div>
    <div><b>${eur(won.reduce((s, x) => s + (+x.montant || 0), 0))}</b><span>gagné (${eur(items.filter(x => x.status === 'envoye').reduce((s, x) => s + (+x.montant || 0), 0))} en attente)</span></div></div>`;
  const fl = [['actifs', 'À traiter'], ...STATUS, ['tous', 'Toutes']];
  const filters = `<div class="filters">${fl.map(([k, l]) => `<button data-filter="${k}" aria-pressed="${filter === k}">${l}</button>`).join('')}<input type="search" id="q" placeholder="Rechercher un nom, un e-mail…" value="${esc(q)}" aria-label="Rechercher"></div>`;
  const qq = q.trim().toLowerCase();
  const list = items.filter(x => filter === 'tous' ? true : filter === 'actifs' ? act(x) : (x.status || 'nouveau') === filter)
    .filter(x => !qq || [x.nom, x.email, x.besoin, x.type, x.note].join(' ').toLowerCase().includes(qq));
  const card = x => { const st = x.status || 'nouveau', d = ms(x.at);
    return `<article class="card req" data-id="${esc(x.id)}">
      <div class="req-top"><h3>${esc(x.nom)}</h3><span class="chip st-${st}">${stLabel(st)}</span></div>
      <div class="meta"><span class="chip">${esc(x.type)}</span><span class="chip">⏱ ${esc(x.delai)}</span><span class="chip">💶 ${esc(x.budget)}</span>${d ? `<span class="chip">${new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>` : ''}</div>
      <p class="need">${esc(x.besoin)}</p>
      <div class="who">✉️ ${esc(x.email)}${x.tel ? ` · 📞 ${esc(x.tel)}` : ''}</div>
      <div class="row"><select data-field="status" aria-label="Statut">${STATUS.map(([k, l]) => `<option value="${k}"${k === st ? ' selected' : ''}>${l}</option>`).join('')}</select>
        <input data-field="montant" type="number" min="0" step="50" inputmode="numeric" placeholder="Montant du devis (€)" value="${x.montant ?? ''}" style="width:190px" aria-label="Montant du devis"></div>
      <textarea data-field="note" placeholder="Note privée (rappel, ce qui a été dit…)" aria-label="Note privée">${esc(x.note || '')}</textarea>
      <div class="row"><button class="btn btn-sm btn-accent" data-do="reply">Répondre par e-mail</button>
        ${x.tel ? `<a class="btn btn-sm btn-ghost" href="tel:${esc(String(x.tel).replace(/[^\d+]/g, ''))}">Appeler</a>` : ''}
        <button class="btn btn-sm btn-ghost" data-do="estimate">Estimer</button><button class="btn btn-sm btn-ghost" data-do="copy">Copier</button>
        <button class="btn btn-sm btn-ghost" data-do="del" style="margin-left:auto">Supprimer</button></div></article>`; };
  return kpis + filters + (list.length ? list.map(card).join('') : `<div class="card empty">${items.length ? 'Aucune demande dans ce filtre.' : 'Aucune demande pour l’instant. Elles arrivent ici dès qu’un visiteur remplit le <a href="../devis/">formulaire de devis</a>.'}</div>`);
}

let estFor = null;
function viewEstimate() {
  const x = estFor && items.find(i => i.id === estFor);
  const opt = (v, l, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${esc(l)}</option>`;
  const type = x && GRID[x.type] ? x.type : 'Site vitrine';
  return `<section class="card" style="padding:clamp(20px,4vw,36px)">
    ${x ? `<p class="muted" style="margin-top:0">Pour la demande de <b>${esc(x.nom)}</b> (budget indiqué : ${esc(x.budget)})</p>` : ''}
    <form class="form" id="est" onsubmit="return false">
      <div class="form-grid"><div class="field"><label for="e-type">Type de projet</label><select id="e-type">${Object.keys(GRID).map(k => opt(k, k, k === type)).join('')}</select></div>
        <div class="field"><label for="e-lvl">Ampleur</label><select id="e-lvl">${opt('simple', 'Simple (peu de pages ou d’écrans)')}${opt('standard', 'Standard', true)}${opt('avance', 'Avancée (beaucoup de fonctions)')}</select></div></div>
      <label class="check"><input type="checkbox" id="e-pay"> <span>Paiements en ligne et administration (+ ${eur(EXTRA_PAY[0])} à ${eur(EXTRA_PAY[1])})</span></label>
      <label class="check"><input type="checkbox" id="e-maint"> <span>Maintenance mensuelle (${eur(MAINT[0])} à ${eur(MAINT[1])} par mois)</span></label>
    </form>
    <p class="muted" style="margin:var(--s-5) 0 0">Prix conseillé</p><div class="est-out" id="e-out"></div><p class="muted" id="e-sub" style="margin-top:0"></p>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap">${x ? '<button class="btn btn-accent" data-do="est-reply">Envoyer cette proposition</button><button class="btn btn-ghost" data-do="est-save">Noter ce montant sur la demande</button>' : ''}<button class="btn btn-ghost" data-do="est-copy">Copier le texte</button></div>
    <p class="muted" style="font-size:var(--t-xs)">Fourchettes de la grille QuenTools (design/TARIFS.md). À ajuster selon le client : c’est une aide, pas un engagement.</p></section>`;
}
let estText = '', estMid = 0;
function estimate() {
  const g = id => document.getElementById(id); if (!g('e-type')) return;
  const [lo, hi] = GRID[g('e-type').value], [a, b] = LEVEL[g('e-lvl').value];
  const r50 = n => Math.round(n / 50) * 50;
  let min = r50(lo + (hi - lo) * a), max = r50(lo + (hi - lo) * b);
  if (g('e-pay').checked) { min += EXTRA_PAY[0]; max += EXTRA_PAY[1]; }
  estMid = r50((min + max) / 2);
  g('e-out').textContent = `${eur(min)} – ${eur(max)}`;
  const m = g('e-maint').checked;
  g('e-sub').textContent = `Proposition équilibrée : ${eur(estMid)}${m ? ` + maintenance ${eur(MAINT[0])} à ${eur(MAINT[1])}/mois` : ''}`;
  const x = estFor && items.find(i => i.id === estFor), first = x ? String(x.nom).split(' ')[0] : '';
  estText = `Bonjour${first ? ' ' + first : ''},\n\nMerci pour votre demande. D’après ce que vous m’avez décrit (${g('e-type').value.toLowerCase()}${g('e-pay').checked ? ', avec paiement en ligne et administration' : ''}), je vous propose une réalisation entre ${eur(min)} et ${eur(max)}, le prix exact étant fixé ensemble avant de commencer.${m ? `\nEn option, une maintenance (mises à jour, sauvegardes, petites évolutions) entre ${eur(MAINT[0])} et ${eur(MAINT[1])} par mois.` : ''}\n\nPour la suite : un court échange pour préciser le besoin, puis une première version à tester avant de vous engager sur le reste.\n\nBien à vous,\nQuenTools`;
}

function viewSite() {
  const s = site || {}, v = k => esc(s[k] ?? '');
  return `<form class="form card" id="site-form" style="padding:clamp(20px,4vw,36px)" onsubmit="return false">
    <h2 style="margin:0">Bandeau d’annonce</h2><p class="muted" style="margin:0">Une phrase en haut de l’accueil : promotion, nouvel outil, e-book…</p>
    <label class="switch"><input type="checkbox" name="announceOn"${s.announceOn ? ' checked' : ''}> Afficher le bandeau</label>
    <div class="field"><label for="s-a">Texte</label><input id="s-a" name="announce" maxlength="140" value="${v('announce')}" placeholder="Ex. Nouveau : l’e-book gratuit est disponible"></div>
    <div class="field"><label for="s-u">Lien (facultatif)</label><input id="s-u" name="announceUrl" maxlength="300" value="${v('announceUrl')}" placeholder="ebook/ ou https://…"></div>
    <h2 style="margin:var(--s-4) 0 0">Disponibilité</h2><p class="muted" style="margin:0">Remplace la pastille verte de l’accueil (vide = « 5 applications en ligne »).</p>
    <label class="switch"><input type="checkbox" name="available"${s.available !== false ? ' checked' : ''}> J’accepte de nouveaux projets</label>
    <div class="field"><label for="s-t">Texte de la pastille</label><input id="s-t" name="availText" maxlength="60" value="${v('availText')}" placeholder="Ex. 2 places pour novembre"></div>
    <h2 style="margin:var(--s-4) 0 0">Coordonnées</h2>
    <div class="form-grid"><div class="field"><label for="s-e">E-mail public</label><input id="s-e" name="email" type="email" maxlength="160" value="${v('email')}" placeholder="vide = bouton masqué"></div>
      <div class="field"><label for="s-k">Pseudo TikTok</label><input id="s-k" name="tiktok" maxlength="40" value="${v('tiktok')}" placeholder="${esc(C.tiktok || 'quentools')}"></div></div>
    <div class="field"><label for="s-f">Relais des demandes (facultatif)</label><input id="s-f" name="formEndpoint" maxlength="300" value="${v('formEndpoint')}" placeholder="https://…workers.dev/support"><small>Copie de chaque demande envoyée à ce relais (par ex. celui de Wouf). Les demandes arrivent ici dans tous les cas.</small></div>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-accent" data-do="save-site">Enregistrer</button><a class="btn btn-ghost" href="../" target="_blank" rel="noopener">Voir le site</a></div>
    <p class="muted" style="font-size:var(--t-xs);margin:0">Visible par les visiteurs sous 10 minutes environ.</p></form>`;
}
function viewLinks() {
  const L = [
    ['https://woufapp.fr/#/plus', '🐾 Wouf · administration', 'Comptes, paiements, Wouf Plus offert'],
    [`https://console.firebase.google.com/project/${C.firebase.projectId}/firestore`, '🔥 Firebase', 'Données et règles de sécurité'],
    ['https://dashboard.stripe.com/payments', '💳 Stripe', 'Paiements par carte'],
    ['https://www.paypal.com/myaccount/transactions', '🅿️ PayPal', 'Paiements reçus'],
    ['https://app.metricool.com', '📅 Metricool', 'Publications Instagram programmées'],
    ['https://www.tiktok.com/@' + (C.tiktok || 'quentools'), '🎵 TikTok', 'Compte @' + (C.tiktok || 'quentools')],
    ['https://dash.cloudflare.com', '☁️ Cloudflare', 'Relais de paiement Wouf'],
    ['https://github.com/ikeupods-del/Quentools', '🐙 GitHub', 'Code et publications']
  ];
  return `<div class="links">${L.map(([u, t, d]) => `<a href="${esc(u)}" target="_blank" rel="noopener"><b>${t}</b><small>${esc(d)}</small></a>`).join('')}</div>`;
}

/* ---------- Actions ---------- */
const copy = async t => { try { await navigator.clipboard.writeText(t); toast('Copié ✓'); } catch (e) { toast('Copie impossible sur cet appareil', true); } };
const mailto = (x, body) => `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(x.email)}&su=${encodeURIComponent('Votre demande de devis : ' + x.type)}&body=${encodeURIComponent(body)}`;
const openMail = url => { if (!window.open(url, '_blank', 'noopener')) location.href = url; };
const fail = e => toast(/permission/i.test(e && (e.code || e.message)) ? 'Refusé : vérifiez les règles Firestore.' : 'Enregistrement impossible (connexion ?)', true);
app.addEventListener('click', async e => {
  const b = e.target.closest('[data-tab],[data-filter],[data-do]'); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; if (tab !== 'estimer') estFor = null; return render(); }
  if (b.dataset.filter) { filter = b.dataset.filter; return render(); }
  const card = b.closest('.req'), x = card && items.find(i => i.id === card.dataset.id), d = b.dataset.do;
  try {
    if (d === 'logout') { const { Au, auth } = await fb(); await Au.signOut(auth); }
    else if (d === 'reload') { await load(); render(); }
    else if (d === 'copy-rules') copy(rulesText());
    else if (d === 'reply') { openMail(mailto(x, `Bonjour ${String(x.nom).split(' ')[0]},\n\nMerci pour votre demande. \n\nBien à vous,\nQuenTools\n\n---\nVotre message :\n${x.besoin}`)); if ((x.status || 'nouveau') === 'nouveau') { await patch(x.id, { status: 'discussion' }); render(); } }
    else if (d === 'copy') copy(`${x.nom} <${x.email}>${x.tel ? ' · ' + x.tel : ''}\n${x.type} · ${x.delai} · ${x.budget}\n\n${x.besoin}`);
    else if (d === 'estimate') { estFor = x.id; tab = 'estimer'; render(); }
    else if (d === 'del') { if (confirm(`Supprimer définitivement la demande de ${x.nom} ?`)) { await remove(x.id); render(); toast('Demande supprimée'); } }
    else if (d === 'est-copy') copy(estText);
    else if (d === 'est-reply' || d === 'est-save') {
      const y = items.find(i => i.id === estFor); if (!y) return;
      if (d === 'est-reply') openMail(mailto(y, estText));
      await patch(y.id, { montant: estMid, status: ['gagne', 'perdu'].includes(y.status) ? y.status : 'envoye' });
      if (d !== 'est-reply') toast(`Montant noté : ${eur(estMid)}`);
    }
    else if (d === 'save-site') {
      const f = document.getElementById('site-form'), g = n => f.elements[n];
      const url = g('announceUrl').value.trim(), fe = g('formEndpoint').value.trim();
      if (url && !/^(https:\/\/|\.{0,2}\/|#|[a-z0-9-]+\/)/i.test(url)) return toast('Le lien doit commencer par https:// ou être une page du site (ex. ebook/)', true);
      if (fe && !/^https:\/\//.test(fe)) return toast('Le relais doit commencer par https://', true);
      if (g('email').value && !g('email').checkValidity()) return toast('Adresse e-mail invalide', true);
      await saveSite({ announceOn: g('announceOn').checked, announce: g('announce').value.trim(), announceUrl: url, available: g('available').checked,
        availText: g('availText').value.trim(), email: g('email').value.trim(), tiktok: g('tiktok').value.trim().replace(/^@/, ''), formEndpoint: fe });
      toast('Réglages enregistrés ✓');
    }
  } catch (err) { fail(err); }
});
app.addEventListener('change', async e => {
  const el = e.target;
  if (el.closest('#est')) return estimate();
  const card = el.closest('.req'); if (!card || !el.dataset.field) return;
  const v = el.dataset.field === 'montant' ? (el.value === '' ? null : Math.max(0, Math.round(+el.value))) : el.value.slice(0, 2000);
  try { await patch(card.dataset.id, { [el.dataset.field]: v }); if (el.dataset.field !== 'note') render(); toast('Enregistré ✓'); } catch (err) { fail(err); }
});
app.addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); } });

/* ---------- Connexion ---------- */
async function isOwner(email) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(email || '').trim().toLowerCase()));
  return (C.ownerHashes || []).includes([...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join(''));
}
const gate = html => { app.innerHTML = `<section class="card" style="padding:clamp(24px,5vw,48px);max-width:560px;margin:0 auto;text-align:center">${html}</section>`; };
async function start() {
  if (DEMO) { await load(); return render(); }
  if (!official && !local) return gate('<h1 class="h-section">Administration</h1><p class="muted">Disponible uniquement sur le site officiel de QuenTools.</p>');
  let A;
  try { A = await fb(); } catch (e) { return gate('<h1 class="h-section">Hors connexion</h1><p class="muted">Impossible de joindre Google. Vérifiez la connexion puis rechargez.</p>'); }
  A.Au.onAuthStateChanged(A.auth, async u => {
    user = u;
    if (!u) return gate(`<h1 class="h-section">Administration</h1><p class="muted">Espace réservé au propriétaire de QuenTools.</p><button class="btn btn-accent" id="login" style="margin-top:var(--s-4)">Se connecter avec Google</button><p id="lerr" class="muted"></p>`);
    if (!(await isOwner(u.email))) return gate(`<h1 class="h-section">Accès réservé</h1><p class="muted">Le compte ${esc(u.email)} n’a pas accès à l’administration.</p><button class="btn btn-ghost" data-do="logout">Changer de compte</button>`);
    app.innerHTML = '<p class="muted">Chargement des demandes…</p>'; await load(); render();
  });
}
app.addEventListener('click', async e => {
  if (e.target.id !== 'login') return;
  try { const { Au, auth } = await fb(); await Au.signInWithPopup(auth, new Au.GoogleAuthProvider()); }
  catch (err) { const m = { 'auth/popup-closed-by-user': 'Connexion annulée', 'auth/popup-blocked': 'Autorisez les fenêtres pop-up pour ce site, puis réessayez', 'auth/unauthorized-domain': 'Domaine non autorisé dans Firebase' }; document.getElementById('lerr').textContent = m[err.code] || 'Connexion impossible'; }
});
start();
</script>
