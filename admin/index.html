}

  if (c.bloque) return { k: 'susp', l: 'Site suspendu', solde };

function viewStats() {
  const st0 = x => x.status || 'nouveau', won = items.filter(x => WON.includes(st0(x))), pend = items.filter(x => st0(x) === 'envoye'), closed = items.filter(x => [...WON, 'perdu'].includes(st0(x)));
  const sum = a => a.reduce((s, x) => s + (+x.montant || 0), 0);
  const months = Array.from({ length: 6 }, (_, i) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 5 + i); return { key: isoDay(d).slice(0, 7), label: d.toLocaleDateString('fr-FR', { month: 'short' }), v: 0 }; });
  won.forEach(x => { const m = months.find(z => z.key === isoDay(ms(x.at) || Date.now()).slice(0, 7)); if (m) m.v += +x.montant || 0; });
  let remises = 0; items.forEach(x => { if (x.devisData && WON.includes(st0(x))) { try { const k = QTD.calc(JSON.parse(x.devisData)); remises += k.remise + k.remLines; } catch (e) { /* devis illisible */ } } });
  const max = Math.max(1, ...months.map(m => m.v)), bw = 600 / months.length;
  const svg = `<svg viewBox="0 0 600 200" role="img" aria-label="Chiffre d’affaires des devis acceptés, par mois" style="width:100%;height:auto;display:block">${months.map((m, i) => { const h = Math.round(140 * m.v / max), x = i * bw + bw * .18;
    return `<rect x="${x}" y="${160 - h}" width="${bw * .64}" height="${h || 2}" rx="8" style="fill:${m.v ? 'var(--accent)' : 'var(--line-2)'}"/>${m.v ? `<text x="${x + bw * .32}" y="${152 - h}" text-anchor="middle" font-size="20" font-weight="700" style="fill:var(--ink)">${eur(m.v)}</text>` : ''}<text x="${x + bw * .32}" y="186" text-anchor="middle" font-size="20" style="fill:var(--muted)">${esc(m.label)}</text>`; }).join('')}</svg>`;
  const fun = [['Demandes reçues', items.length], ['Devis envoyés', items.filter(x => ['envoye', ...WON, 'perdu'].includes(st0(x))).length], ['Acceptés', won.length], ['Livrés', items.filter(x => st0(x) === 'livre').length]];
  const fmax = Math.max(1, fun[0][1]), types = {}; items.forEach(x => { const t = types[x.type] = types[x.type] || { n: 0, w: 0, v: 0 }; t.n++; if (WON.includes(st0(x))) { t.w++; t.v += +x.montant || 0; } });
  return `<div class="kpis"><div><b>${eur(sum(won))}</b><span>acceptés au total</span></div><div><b>${won.length ? eur(sum(won) / won.length) : '—'}</b><span>panier moyen</span></div>
      <div><b>${closed.length ? Math.round(100 * won.length / closed.length) + ' %' : '—'}</b><span>taux de réussite</span></div><div><b>${eur(sum(pend))}</b><span>en attente de réponse (${pend.length})</span></div></div>
    <section class="card" style="padding:var(--s-5);margin-bottom:var(--s-4)"><h2 style="margin:0 0 var(--s-3);font-size:var(--t-lg)">Devis acceptés par mois</h2>${svg}<p class="muted" style="margin:var(--s-2) 0 0;font-size:var(--t-xs)">Classés par mois de la demande, sur 6 mois.</p></section>
    <section class="card" style="padding:var(--s-5);margin-bottom:var(--s-4)"><h2 style="margin:0 0 var(--s-3);font-size:var(--t-lg)">De la demande à la livraison</h2>${fun.map(([l, n]) => `<div class="fun"><span>${l}</span><div><i style="width:${Math.round(100 * n / fmax)}%"></i></div><b>${n}</b></div>`).join('')}</section>
    <section class="card" style="padding:var(--s-5);margin-bottom:var(--s-4)"><h2 style="margin:0 0 var(--s-3);font-size:var(--t-lg)">Par type de projet</h2>${Object.entries(types).sort((a, b) => b[1].n - a[1].n).map(([t, v]) => `<div class="fun" style="grid-template-columns:1fr"><span><b>${esc(t)}</b><br><span class="muted">${v.n} demande${v.n > 1 ? 's' : ''} · ${v.w} accepté${v.w > 1 ? 's' : ''}${v.v ? ' · ' + eur(v.v) : ''}</span></span></div>`).join('') || '<p class="muted">Pas encore de données.</p>'}
      <p class="muted" style="margin:var(--s-3) 0 0;font-size:var(--t-sm)">Remises accordées sur les devis acceptés : <b>${eur(remises)}</b></p></section>`;
}

async function isOwner(email) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(email || '').trim().toLowerCase()));
  return (C.ownerHashes || []).includes([...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join(''));
}

}, 90000);

  if (DEMO) { await load(); return render(); }

  try { A = await fb(); } catch (e) { return gate('<h1 class="h-section">Hors connexion</h1><p class="muted">Impossible de joindre Google. Vérifiez la connexion puis rechargez.</p>'); }

    if (!(await isOwner(u.email))) return gate(`<h1 class="h-section">Accès réservé</h1><p class="muted">Le compte ${esc(u.email)} n’a pas accès à l’administration.</p><button class="btn btn-ghost" data-do="logout">Changer de compte</button>`);
    app.innerHTML = '<p class="muted">Chargement des demandes…</p>'; await load(); render();
  });
}
app.addEventListener('click', async e => {

});
