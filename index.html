<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuenTools</title>
<style>
:root{--bg:#eef1f7;--tx:#172036;--card:#fff;--a:#3048c9;--m:#5b6580}
@media (prefers-color-scheme:dark){:root{--bg:#0f1422;--tx:#eef1f8;--card:#1a2033;--a:#7d8fff;--m:#a4adc6}}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
main{width:100%;max-width:420px}h1{margin:0 0 4px}p{color:var(--m);margin:0 0 20px}
a.app{display:block;background:var(--card);color:var(--tx);text-decoration:none;border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
a.app b{display:block;font-size:1.1rem;color:var(--a)}a.app span{color:var(--m);font-size:.9rem}
</style>
</head>
<body><main>
<h1>QuenTools</h1><p>Des applis simples, installables, sans compte à créer.</p>
<a class="app" href="infikit/"><b>Infikit</b><span>L’assistant des infirmières à domicile</span></a>
<a class="app" href="patrimoine/"><b>Patrimoine AI</b><span>Suivi de patrimoine, marchés et assistant IA</span></a>
</main></body></html>
