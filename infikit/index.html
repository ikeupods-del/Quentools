<style>
:root{
  --bg:#eef1f7;--card:#ffffff;--ink:#172036;--muted:#5d6780;--line:#dde3ef;--soft:#f5f7fc;
  --pri:#3048c9;--pri2:#2438a8;--pri-soft:#e7ebff;--sun:#f5a300;--sun-soft:#fff3d6;
  --ok:#17875b;--ok-soft:#dcf5ea;--bad:#c9341c;--bad-soft:#fde4df;--shadow:0 1px 2px rgba(23,32,54,.06),0 6px 18px rgba(23,32,54,.06);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1422;--card:#182036;--ink:#eef1f8;--muted:#9aa5c0;--line:#27314b;--soft:#1d2640;
  --pri:#7d8fff;--pri2:#9aa8ff;--pri-soft:#232e55;--sun:#ffc24d;--sun-soft:#3a2f14;--ok:#4fd39a;--ok-soft:#153a2b;--bad:#ff7d66;--bad-soft:#3e1d18;--shadow:none}}
:root[data-theme="dark"]{--bg:#0f1422;--card:#182036;--ink:#eef1f8;--muted:#9aa5c0;--line:#27314b;--soft:#1d2640;
  --pri:#7d8fff;--pri2:#9aa8ff;--pri-soft:#232e55;--sun:#ffc24d;--sun-soft:#3a2f14;--ok:#4fd39a;--ok-soft:#153a2b;--bad:#ff7d66;--bad-soft:#3e1d18;--shadow:none}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
a{color:var(--pri)}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 18px 10px;display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-size:21px;letter-spacing:-.01em;flex:1;min-width:0}
.top h1 small{display:block;font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}
.flag{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700}
main{flex:1;padding:0 14px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs div{display:flex;max-width:560px;width:100%}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:12px;color:var(--muted);font-weight:700}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--pri);background:var(--pri-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-weight:700}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.icon{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;background:var(--soft);border:1px solid var(--line);flex:none}
.icon svg{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--pri-soft);color:var(--pri2);font-size:13px;font-weight:700;margin:2px 4px 2px 0}
.chip.sun{background:var(--sun-soft);color:#8a5a00}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.sun{color:var(--sun)}}
:root[data-theme="dark"] .chip.sun{color:var(--sun)}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
h2{font-size:17px;margin:18px 4px 8px}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--soft)}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* ---- tournée : le fil ---- */
.dayhead{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.dayhead .grow{text-align:center}
.dayhead b{font-size:18px;display:block}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:20px;letter-spacing:-.01em}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:700}
.fil{position:relative;padding-left:62px}
.fil::before{content:"";position:absolute;left:30px;top:12px;bottom:12px;width:3px;border-radius:3px;background:repeating-linear-gradient(to bottom,var(--line) 0 8px,transparent 8px 14px)}
.stop{position:relative}
.stop .time{position:absolute;left:-62px;top:12px;width:56px;text-align:center;font-weight:700;font-size:14px;padding:5px 0;border-radius:10px;background:var(--card);border:2px solid var(--pri);color:var(--pri)}
.stop.done .time{background:var(--ok);border-color:var(--ok);color:#fff}
.stop.done .card{opacity:.82}
.stop .num{font-size:12px;color:var(--muted);font-weight:700}
.stop h3{margin:0;font-size:17px}
.stop .addr{font-size:14px;color:var(--muted);margin:2px 0 6px}
.stop .acts{margin:4px 0 8px}
.stop .foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stop .amount{margin-left:auto;font-weight:700}
.alert{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--sun-soft);font-size:14px;margin-bottom:8px}
.alert.bad{background:var(--bad-soft)}
.empty{text-align:center;padding:28px 16px}
.empty svg{width:56px;height:56px;color:var(--muted)}
/* carte */
.map{width:100%;aspect-ratio:1/1;background:var(--card);border:1px solid var(--line);border-radius:16px;display:block}
/* listes */
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--pri-soft);color:var(--pri2);flex:none}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.line:last-child{border-bottom:0}
.line code{font-family:inherit;font-size:12.5px;color:var(--muted);font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:4px;border-top:2px solid var(--ink);font-size:18px;font-weight:700}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-size:14.5px;font-weight:700;text-align:left}
.pick button.on{background:var(--pri);border-color:var(--pri);color:#fff}
a.btn{text-decoration:none;color:inherit}
.line b{white-space:nowrap}
.pick.g2{display:grid;grid-template-columns:1fr 1fr}
.pick.g2 button{padding:9px 10px;font-size:14px;line-height:1.25}
.sel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sel .chip{font-size:14px;padding:6px 10px}
.sel .chip button{margin-left:4px;font-weight:700;color:inherit}
.pick button small{display:block;font-weight:400;font-size:12px;opacity:.8}
.note{font-size:13px;color:var(--muted);padding:8px 4px}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;padding-top:6px}
.bars i{flex:1;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.bars i.we{background:var(--sun)}
.tl{border-left:3px solid var(--pri-soft);padding-left:12px;margin-left:6px}
.tl .t{margin-bottom:12px}
.tl .t b{font-size:13px;color:var(--muted)}
/* feuille (bottom sheet) */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(10,14,30,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .panel{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:6px auto 10px}
#sheet .sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#sheet .sh h2{margin:0;flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14.5px;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
/* onboarding & verrou */
.hero{padding:34px 20px 10px}
.hero h1{font-size:40px;line-height:1.02;margin:0 0 10px;letter-spacing:-.025em}
.hero p{font-size:17px;color:var(--muted);margin:0 0 22px}
.country{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.country button{padding:18px 12px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:16px;text-align:left}
.country button.on{border-color:var(--pri);background:var(--pri-soft)}
.country button span{font-size:28px;display:block;margin-bottom:6px}
.country button small{display:block;font-weight:400;color:var(--muted);font-size:13px}
#lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#lock[hidden]{display:none}
.dots{display:flex;gap:12px;margin:18px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pri)}
.dots i.on{background:var(--pri)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.keypad button{height:64px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:700}
.spark{width:100%;height:60px;display:block}
.brandmark{width:34px;height:34px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}
.brandmark.lg{width:48px;height:48px;border-radius:14px}
.brandrow{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brandrow b{display:block;font-size:22px;letter-spacing:-.01em}.brandrow small{display:block;color:var(--muted);font-size:13px}
.about{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:26px 10px 10px}
.about b{font-size:18px}.about span{color:var(--muted);font-size:14px}.about small{color:var(--muted);font-size:12.5px;max-width:340px;margin-top:6px}
.allergy{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bad);color:#fff;font-weight:700;font-size:15px}
.urgmini{width:44px;height:44px;border-radius:12px;background:var(--bad-soft);border:1px solid var(--bad);font-size:20px;flex:none}
.urg{display:grid;gap:8px}
.urgbtn{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.urgbtn b{font-size:24px;min-width:74px;color:var(--bad)}
.urgbtn span{font-weight:700}.urgbtn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.urgbtn.main{background:var(--bad);border-color:var(--bad);color:#fff}.urgbtn.main b,.urgbtn.main small{color:#fff}
.fiche .big{font-size:20px;font-weight:700}
.btn.start{min-height:56px;font-size:17px;margin-bottom:12px;border-radius:16px}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;min-height:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:32px;background:var(--line);transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+i{background:var(--ok)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:3px solid var(--pri);outline-offset:2px}
#cheer{position:fixed;inset:0;z-index:95;background:rgba(10,14,30,.55);display:flex;align-items:center;justify-content:center;padding:20px}
#cheer[hidden]{display:none}
.cheerbox{position:relative;overflow:hidden;background:var(--card);border-radius:24px;padding:28px 22px 20px;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.cheerbox h2{margin:12px 0 6px;font-size:26px}
.cheerbox p{margin:0 0 16px;font-size:17px;line-height:1.5}
.cheericon{width:92px;height:92px;border-radius:50%;margin:0 auto;display:grid;place-items:center}
.cheerbox.start .cheericon{background:var(--sun-soft);color:var(--sun)}
.cheerbox.end .cheericon{background:var(--bad-soft);color:#e2557a}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;opacity:.9;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.navcard{padding:12px 14px}
.navpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.navapp{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--soft);font-weight:700;text-decoration:none;color:var(--ink)}
.navapp.on{border-color:var(--pri);background:var(--pri-soft)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:48px;border-radius:12px;background:#fff;color:#1f1f1f;border:1px solid #747775;font-family:Roboto,"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:500;font-size:15px}
.gbtn:active{background:#f2f2f2}
.gbadge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);flex:none}
.gavatar{width:40px;height:40px;border-radius:50%;flex:none}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#ask{position:fixed;inset:0;z-index:90;background:rgba(10,14,30,.5);display:flex;align-items:center;justify-content:center;padding:20px}
#ask[hidden]{display:none}
.askbox{background:var(--card);border-radius:20px;padding:20px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.askbox h3{margin:0 0 6px;font-size:19px}.askbox p{margin:0 0 16px;color:var(--muted);font-size:15px}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}
.profile{display:flex;align-items:center;gap:14px}
.avatar.big{width:56px;height:56px;font-size:22px;background:var(--pri);color:#fff}
.seg.big button{min-height:48px;font-size:16px}
.rowitem{display:flex;align-items:center;gap:10px}
.rowitem small,summary small{display:block;font-size:13px;color:var(--muted);font-weight:400}
details{border-top:1px solid var(--line);padding:4px 0}
details:first-child{border-top:0}
summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;cursor:pointer;font-weight:700}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);margin:0 6px 4px 0;transition:transform .15s}
details[open] summary::after{transform:rotate(225deg);margin-bottom:-4px}
.lockicon{width:60px;height:60px;border-radius:18px;background:var(--pri);color:#fff;display:grid;place-items:center}
.keypad button.txt{font-size:15px;background:transparent;border:0;color:var(--muted)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.dots.shake{animation:none}}
@media (prefers-reduced-motion:no-preference){.stop .card{transition:opacity .2s}}
/* ---- ordonnances ---- */
.ordos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ordo{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:0;border-radius:12px;background:var(--soft);border:1px solid var(--line);overflow:hidden;text-align:left}
.ordo .th{height:96px;display:grid;place-items:center;background:var(--line);color:var(--muted);font-weight:700;font-size:13px}
.ordo .th img{width:100%;height:96px;object-fit:cover;display:block}
.ordo span{padding:0 8px 6px;font-size:12px;line-height:1.25;color:var(--muted)}
.ordo span b{display:block;color:var(--ink);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ordoview{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--soft);display:block;margin-bottom:10px}
.upl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.upl label{cursor:pointer}
.ghbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:48px;border-radius:12px;background:#24292f;color:#fff;border:1px solid #24292f;font-weight:700;font-size:15px;margin-top:8px}
.ghbtn svg{fill:currentColor}
.syncdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.syncdot.busy{background:var(--sun);animation:pulse 1s infinite alternate}
.syncdot.err{background:var(--bad)}
@keyframes pulse{to{opacity:.35}}
.install{display:flex;align-items:center;gap:12px}
.choice{display:grid;gap:8px}

<script>
'use strict';
/* ============================================================
   Tournée — référentiels, calculs, stockage (100 % local)
   ============================================================ */
const KEY = 'tournee_idel_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const cent = n => Math.round(n * 100 + 1e-6) / 100;
const eur = n => cent(n).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '\u00a0€';
const eur0 = n => Math.round(n).toLocaleString('fr-FR') + '\u00a0€';

const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };

const JOURS_C = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];

/* ---------- jours fériés ---------- */
function easter(y) { const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1; return new Date(y, mo - 1, da); }
const HOL = {};
function holidays(y, c) {
  const k = y + c; if (HOL[k]) return HOL[k];
  const e = easter(y), plus = n => { const d = new Date(e); d.setDate(d.getDate() + n); return iso(d); };
  const fixed = c === 'FR' ? ['01-01', '05-01', '05-08', '07-14', '08-15', '11-01', '11-11', '12-25'] : ['01-01', '05-01', '07-21', '08-15', '11-01', '11-11', '12-25'];

/* ---------- France : NGAP (valeurs modifiables dans les réglages) ---------- */
const FR_TARIFS = {

  IKp: 0.35, IKm: 0.50, IKs: 3.40, abatP: 4, abatM: 2, MAU: 1.35, MCI: 5.00, MIE: 3.15, N1: 9.15, N2: 18.30, DIM: 8.50,

const FR_ACTS = [
  { id: 'inj', l: 'Injection IM / SC', k: 'AMI', c: 1 },
  { id: 'insu', l: "Injection d'insuline", k: 'AMI', c: 1 },
  { id: 'gly', l: 'Glycémie capillaire', k: 'AMI', c: 1 },
  { id: 'pilu', l: 'Surveillance traitement oral', k: 'AMI', c: 1 },

  { id: 'bsb', l: 'Forfait BSI intermédiaire (BSB)', k: 'BSB', flat: 1, bsi: 1 },

/* ---------- Belgique : INAMI art. 8, tarifs au 1er janvier 2026 (domicile) ---------- */
// wk = semaine, we = week-end / jour férié : [code, honoraire]
const BE_ACTS = [
  { id: 'toil', l: "Soins d'hygiène (toilette)", s: 'B', wk: ['425110', 6.86], we: ['425515', 10.31] },
  { id: 'imsc', l: 'Injection IM / SC', s: 'B', wk: ['423076', 2.85], we: ['423275', 4.29] },
  { id: 'ivd', l: 'Médicament IV directe ou cathéter', s: 'B', wk: ['423054', 3.13], we: ['423253', 4.72] },
  { id: 'multi', l: 'Injections en plusieurs sites', s: 'B', wk: ['423091', 2.99], we: ['423290', 4.50] },

  { id: 'plaiec', l: 'Soins de plaie complexes', s: 'B', wk: ['424351', 12.95], we: ['424513', 15.07] },
  { id: 'bioact', l: 'Surveillance de plaie (pansement bioactif)', s: 'B', wk: ['424255', 4.39], we: ['424410', 5.75] },
  { id: 'pommade', l: 'Pommade ou produit médicamenteux', s: 'B', wk: ['424270', 2.85], we: ['424432', 4.29] },
  { id: 'collyre', l: 'Collyre post-opératoire', s: 'B', wk: ['424292', 2.85], we: ['424454', 4.29] },
  { id: 'bandage', l: 'Bandage de compression', s: 'B', wk: ['424314', 2.85], we: ['424476', 4.29] },
  { id: 'bas', l: 'Bas de compression (pose/retrait)', s: 'B', wk: ['424933', 2.85], we: ['424955', 4.29] },
  { id: 'vessie', l: 'Sondage ou lavage vésical', s: 'B', wk: ['425176', 4.73], we: ['425574', 7.09] },
  { id: 'vulve', l: 'Soins de vulve ou aspiration', s: 'B', wk: ['425191', 4.29], we: ['425596', 6.43] },

  { id: 'psy', l: 'Médicaments (patient psy chronique)', s: 'B', wk: ['425736', 1.06], we: ['425751', 1.58] },
  { id: 'semainier', l: 'Préparation hebdo des médicaments', s: 'B', wk: ['424874', 13.91], we: null },
  { id: 'perf', l: 'Forfait perfusion ou parentérale', s: 'III', wk: ['425375', 52.54], we: ['425773', 78.80] },
  { id: 'kt', l: 'Pose cathéter chambre implantable', s: 'III', wk: ['423113', 52.54], we: ['423312', 52.54] },
  { id: 'ktr', l: 'Retrait cathéter chambre implantable', s: 'III', wk: ['421072', 49.00], we: ['421094', 49.00] },
  { id: 'suspub', l: 'Remplacement sonde sus-pubienne', s: 'III', wk: ['427416', 13.54], we: ['427431', 20.31] },
  { id: 'gastro', l: 'Remplacement sonde de gastrostomie', s: 'III', wk: ['427475', 13.54], we: ['427490', 20.31] },
  { id: 'consult', l: 'Consultation infirmière', s: 'III', wk: ['429015', 32.67], we: null },
  { id: 'depl', l: 'Frais de déplacement supplémentaires', s: 'III', wk: ['418913', 3.21], we: ['418913', 3.21] },
];
const BE_BASE = { wk: [['425014', 5.22], ['425036', 5.22], ['425051', 5.22]], we: [['425412', 7.16], ['425434', 7.16], ['425456', 7.16]] };
const BE_FORF = { A: { wk: ['425272', 22.49], we: ['425670', 33.58] }, B: { wk: ['425294', 43.34], we: ['425692', 64.36] }, C: { wk: ['425316', 59.29], we: ['425714', 88.31] } };
const BE_PALL = { A: { wk: ['427055', 64.02], we: ['427136', 95.57] }, B: { wk: ['427033', 69.09], we: ['427114', 102.87] }, C: { wk: ['427011', 84.81], we: ['427092', 126.50] } };

/* ---------- état ---------- */
let S = null;
function blank(country) {
  return {
    v: 1, country, name: '', cabinet: { adresse: '', lat: null, lng: null }, zone: 'plaine',
    tarifs: Object.assign({}, FR_TARIFS), acteOverrides: {},
    patients: [], visits: [], trans: [], extra: [], order: {}, charges: [], recettes: [], ordos: [], trash: [],
    retro: { taux: 85, nom: '' }, pin: null, theme: 'auto', created: today(),
  };
}
/* Données venant d'un fichier ou du cloud : on neutralise ce qui finira dans un attribut HTML ou une adresse (identifiants, coordonnées) et les clés dangereuses. */
function cleanData(o) {
  if (Array.isArray(o)) { o.forEach(cleanData); return o; }
  if (!o || typeof o !== 'object') return o;
  for (const k of Object.keys(o)) {
    if (k === '__proto__' || k === 'constructor' || k === 'prototype') { delete o[k]; continue; }

    if ((k === 'id' || k === 'pid' || k === 'visit') && v != null) o[k] = String(v).replace(/[^\w.-]/g, '').slice(0, 64);

  }

}
function load() { try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && d.v === 1) { S = cleanData(d); S.ordos = S.ordos || []; S.trash = S.trash || []; return true; } } catch (e) { } return false; }
// meta = true : écriture technique (synchro) qui ne compte pas comme une modification
function save(meta) {
  if (!meta && S) S.updatedAt = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Stockage indisponible : les données ne seront pas conservées.'); }
  if (!meta && typeof syncSoon === 'function') syncSoon();
}
const FR = () => S.country === 'FR';
const patient = id => S.patients.find(p => p.id === id);
const acts = () => FR() ? FR_ACTS.map(a => Object.assign({}, a, S.acteOverrides[a.id] || {})) : BE_ACTS;
const act = id => acts().find(a => a.id === id);
const fullName = p => p ? (p.civ ? p.civ + ' ' : '') + p.prenom + ' ' + p.nom : '—';
const initials = p => ((p.prenom || '?')[0] + (p.nom || '?')[0]).toUpperCase();

/* ---------- moteur de cotation France ---------- */
function coteFR(p, date, heure, actIds, opt = {}) {
  const T = S.tarifs, lines = [], add = (code, label, amount, note) => lines.push({ code, label, amount: cent(amount), note });
  const A = actIds.map(act).filter(Boolean);
  const forfaits = A.filter(a => a.flat), tech = A.filter(a => !a.flat).sort((a, b) => b.c - a.c);
  let bsi = false;
  for (const a of forfaits) {
    if (a.k === 'DI') add('DI ' + String(a.c).replace('.', ','), a.l, a.c * T.DI);
    else if (a.k === 'MCI') add('MCI', a.l, T.MCI);
    else { if (!opt.bsiDone) { add(a.k, a.l, T[a.k]); bsi = true; } else add(a.k, a.l + ' (déjà facturé ce jour)', 0); }
  }
  tech.forEach((a, i) => {
    const key = bsi || p?.bsi ? 'AMX' : 'AMI';
    const coef = String(a.c).replace('.', ',');
    const base = a.c * T[key];
    if (i === 0) add(key + ' ' + coef, a.l, base);
    else if (i === 1) add(key + ' ' + coef + ' ½', a.l, base / 2, 'second acte à 50 %');
    else add(key + ' ' + coef, a.l, 0, 'non cumulable (3ᵉ acte)');
  });
  if (tech.length === 1 && !forfaits.length && tech[0].c <= 1.5) add('MAU', "Majoration d'acte unique", T.MAU);
  if (p?.enfant && tech.length) add('MIE', 'Majoration enfant de moins de 7 ans', T.MIE);
  if (A.length) {
    const h = hm(heure), sun = dow(date) === 6 || isHoliday(date, 'FR');
    let maj = null;
    if (opt.nuit && (h >= 23 || h < 5)) maj = ['NUIT', 'Majoration nuit (23 h – 5 h)', T.N2];
    else if (opt.nuit && (h >= 20 || h < 8)) maj = ['NUIT', 'Majoration nuit (20 h – 23 h, 5 h – 8 h)', T.N1];
    if (sun && (!maj || T.DIM > maj[2])) maj = ['DIM', dow(date) === 6 ? 'Majoration dimanche' : 'Majoration jour férié', T.DIM];
    if (maj && opt.maj !== false) add(maj[0], maj[1], maj[2], maj[0] === 'NUIT' ? 'soins prescrits la nuit' : '');
    add(bsi || p?.bsi ? 'IFI' : 'IFD', 'Indemnité forfaitaire de déplacement', bsi || p?.bsi ? T.IFI : T.IFD);
    const km = Number(p?.km || 0);
    if (km > 0) {
      const zone = p?.zone || S.zone, rate = zone === 'montagne' ? T.IKm : zone === 'pied' ? T.IKs : T.IKp, ab = zone === 'montagne' ? T.abatM : zone === 'pied' ? 0 : T.abatP;
      const d = Math.max(0, km * 2 - ab);
      if (d > 0) add('IK', `Indemnités kilométriques (${String(Math.round(d * 10) / 10).replace('.', ',')} km)`, d * rate, `aller-retour ${km * 2} km − abattement ${ab} km`);
    }
  }

}

/* ---------- moteur de tarification Belgique ---------- */
// nth : rang de la séance du jour pour ce patient (0 = première) ; usedI : honoraires rubrique I déjà attestés ce jour
function coteBE(p, date, heure, actIds, opt = {}) {
  const we = isWeekendOrHoliday(date, 'BE'), K = we ? 'we' : 'wk', lines = [], add = (code, label, amount, note) => lines.push({ code, label, amount: cent(amount), note });
  const A = actIds.map(act).filter(Boolean), nth = opt.nth || 0;
  let usedI = 0;
  const tech = A.filter(a => a.s === 'B'), spec = A.filter(a => a.s === 'III');

    const tbl = p.palliatif ? BE_PALL : BE_FORF, f = tbl[p.katz][K];
    if (nth === 0) add(f[0], `Forfait ${p.palliatif ? 'palliatif P' : ''}${p.katz} (journée de soins)`, f[1]);
    else add('—', 'Séance incluse dans le forfait du jour', 0);
    tech.forEach(a => add(a[K] ? a[K][0] : '—', a.l, 0, 'inclus dans le forfait'));
  } else if (A.length || opt.forceBase) {
    const b = BE_BASE[K][Math.min(nth, 2)];
    let sub = [[b[0], ['Première', 'Deuxième', 'Troisième'][Math.min(nth, 2)] + ' prestation de base de la journée', b[1]]];
    for (const a of tech) { if (!a[K]) { add('—', a.l + ' (non prévu le week-end)', 0); continue; } sub.push([a[K][0], a.l, a[K][1]]); }

    let room = Math.max(0, cap - used), capped = false;
    for (const [code, l, amt] of sub) { const v = Math.min(amt, room); room -= v; usedI += v; if (v < amt) capped = true; add(code, l, v, v < amt ? 'réduit : plafond journalier' : ''); }
    if (capped) lines.push({ code: 'PLAF', label: `Plafond journalier atteint (${eur(cap)})`, amount: 0, note: p?.palliatif ? 'patient palliatif : le forfait PP peut s’appliquer' : 'vérifiez l’éligibilité à un forfait A, B ou C (Katz)' });
  }
  for (const a of spec) { if (!a[K]) { add('—', a.l + ' (non prévu le week-end)', 0); continue; } add(a[K][0], a.l, a[K][1]); }

  return { lines, total: lines.reduce((s, l) => s + l.amount, 0), usedI };
}
function cote(p, date, heure, actIds, opt) { return FR() ? coteFR(p, date, heure, actIds, opt) : coteBE(p, date, heure, actIds, opt); }
// contexte du jour pour un patient : rang de séance, plafond déjà utilisé, BSI déjà facturé
function dayCtx(pid, date, beforeHeure, excludeId) {
  const vs = S.visits.filter(v => v.pid === pid && v.date === date && v.id !== excludeId && (beforeHeure == null || hm(v.heure) <= hm(beforeHeure))).sort((a, b) => hm(a.heure) - hm(b.heure));
  return { nth: vs.length, usedI: vs.reduce((s, v) => s + (v.usedI || 0), 0), bsiDone: vs.some(v => (v.actes || []).some(a => act(a)?.bsi)) };

/* ---------- tournée : arrêts du jour ---------- */
function stopsFor(date) {
  const d = dow(date), list = [];
  for (const p of S.patients) {
    if (p.archive) continue;
    for (const pl of p.plan || []) if (pl.jours.includes(d) && (!pl.du || pl.du <= date) && (!pl.au || pl.au >= date)) list.push({ key: p.id + ':' + pl.id, pid: p.id, heure: pl.heure, actes: pl.actes.slice(), note: pl.note || '' });
  }
  for (const e of S.extra) if (e.date === date) list.push({ key: 'x:' + e.id, pid: e.pid, heure: e.heure, actes: e.actes.slice(), note: e.note || '', extra: e.id });
  const ord = S.order[date];
  list.sort((a, b) => ord ? ((ord.indexOf(a.key) + 1 || 999) - (ord.indexOf(b.key) + 1 || 999)) || hm(a.heure) - hm(b.heure) : hm(a.heure) - hm(b.heure));

  return list;
}
function estimate(stops, date) {
  const seen = {}, used = {};
  return stops.map(s => {
    if (s.visit) return s.visit.total;
    const p = patient(s.pid), ctx = dayCtx(s.pid, date);
    const nth = ctx.nth + (seen[s.pid] || 0);
    const r = cote(p, date, s.heure, s.actes, { nth, usedI: ctx.usedI + (used[s.pid] || 0), bsiDone: ctx.bsiDone || (seen[s.pid] && s.actes.some(a => act(a)?.bsi)) });
    seen[s.pid] = (seen[s.pid] || 0) + 1; used[s.pid] = (used[s.pid] || 0) + (r.usedI || 0);
    return r.total;
  });
}
const haversine = (a, b) => { const R = 6371, t = x => x * Math.PI / 180, dLat = t(b.lat - a.lat), dLng = t(b.lng - a.lng); const h = Math.sin(dLat / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
function routeKm(stops) {
  let pts = []; if (S.cabinet.lat != null) pts.push(S.cabinet);
  for (const s of stops) { const p = patient(s.pid); if (p && p.lat != null) pts.push(p); }
  if (S.cabinet.lat != null && pts.length > 1) pts.push(S.cabinet);
  let d = 0; for (let i = 1; i < pts.length; i++) d += haversine(pts[i - 1], pts[i]) * 1.3; // facteur route
  return d;
}
function optimize(date) {

/* ---------- ORDONNANCES : photos et PDF, rangés dans IndexedDB sur le téléphone ---------- */
const FDB = { db: null, urls: new Map() };
function fdb() {
  if (FDB.db) return Promise.resolve(FDB.db);
  return new Promise((res, rej) => {
    let r; try { r = indexedDB.open('infikit_files', 1); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => { FDB.db = r.result; res(r.result); };
    r.onerror = () => rej(r.error || new Error('Stockage des fichiers indisponible'));
  });
}
async function fop(mode, fn) {
  const db = await fdb();
  return new Promise((res, rej) => { const tx = db.transaction('files', mode), q = fn(tx.objectStore('files')); tx.oncomplete = () => res(q && q.result); tx.onerror = tx.onabort = () => rej(tx.error || new Error('Stockage plein ?')); });
}
// on range un ArrayBuffer + type (plus fiable qu'un Blob sur les anciens Safari)
const fileGet = id => fop('readonly', st => st.get(id));
const filePut = (id, f) => fop('readwrite', st => st.put(f, id));
const fileDel = id => fop('readwrite', st => st.delete(id));
const fileKeys = () => fop('readonly', st => st.getAllKeys());
async function fileGC() { try { const keep = new Set((S?.ordos || []).map(o => o.id)); for (const k of await fileKeys()) if (!keep.has(k)) await fileDel(k); } catch (e) { } }
async function fileWipe() { try { for (const k of await fileKeys()) await fileDel(k); } catch (e) { } FDB.urls.forEach(u => URL.revokeObjectURL(u)); FDB.urls.clear(); }
const ordosOf = pid => (S.ordos || []).map((o, i) => [o, i]).filter(([o]) => o.pid === pid).sort((a, b) => b[0].date.localeCompare(a[0].date) || b[1] - a[1]).map(x => x[0]);
const isPDF = o => /pdf/.test(o.type);
const kb = n => n > 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' Mo' : Math.max(1, Math.round(n / 1024)) + ' ko';

async function ordoURL(o, fetchCloud = true) {
  if (FDB.urls.has(o.id)) return FDB.urls.get(o.id);
  let f = null; try { f = await fileGet(o.id); } catch (e) { }
  if (!f && fetchCloud && typeof cloudFetchFile === 'function') f = await cloudFetchFile(o);
  if (!f) return null;
  const u = URL.createObjectURL(new Blob([f.data], { type: f.type || o.type }));
  FDB.urls.set(o.id, u); return u;
}
async function shrinkImage(file) {
  // photo de téléphone (4000 px, 3-6 Mo) → JPEG 2000 px, lisible et ~10 fois plus léger
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return b && b.size < file.size ? b : file;
  } catch (e) { return file; }
}
function ordoSection(p) {
  const list = ordosOf(p.id);
  let h = `<h2>Ordonnances</h2><div class="card">`;
  if (list.length) {
    h += `<div class="ordos">${list.map(o => `<button class="ordo" onclick="viewOrdo('${o.id}')" aria-label="Voir ${esc(o.name)}"><div class="th" data-ordo="${o.id}">${isPDF(o) ? 'PDF' : '…'}</div><span><b>${esc(o.name)}</b>${esc(o.date.split('-').reverse().join('/'))}${o.fin ? ` · jusqu’au ${esc(o.fin.split('-').reverse().slice(0, 2).join('/'))}` : ''}</span></button>`).join('')}</div>`;
    AFTER.push(() => list.filter(o => !isPDF(o)).forEach(async o => { const u = await ordoURL(o, false); const el = document.querySelector(`[data-ordo="${o.id}"]`); if (el) el.innerHTML = u ? `<img src="${u}" alt="">` : '☁️'; }));
  } else h += `<p class="small muted" style="margin:0">Aucune ordonnance jointe. Photographiez-la ou importez le PDF reçu du médecin : elle vous suit dans la tournée.</p>`;
  h += `<div class="upl"><label class="btn sm pri" tabindex="0">📷 Photographier<input type="file" accept="image/*" capture="environment" hidden onchange="addOrdos('${p.id}',this)"></label><label class="btn sm" tabindex="0">📄 Photo ou PDF<input type="file" accept="image/*,application/pdf,.pdf" multiple hidden onchange="addOrdos('${p.id}',this)"></label></div></div>`;

async function addOrdos(pid, inp) {
  const files = [...(inp.files || [])]; inp.value = '';
  if (!files.length) return;
  const added = [];
  for (const file of files) {
    const pdf = /pdf/i.test(file.type) || /\.pdf$/i.test(file.name);
    if (!pdf && !/^image\//.test(file.type)) { toast(`« ${file.name} » n’est ni une photo ni un PDF.`); continue; }
    if (file.size > 20 * 1048576) { toast(`« ${file.name} » dépasse 20 Mo.`); continue; }
    toast(pdf ? 'Enregistrement du PDF…' : 'Optimisation de la photo…');
    const blob = pdf ? file : await shrinkImage(file), type = pdf ? 'application/pdf' : (blob.type || file.type || 'image/jpeg');
    const o = { id: uid() + uid(), pid, name: pdf ? file.name.replace(/\.pdf$/i, '') || 'Ordonnance' : 'Ordonnance du ' + today().split('-').reverse().join('/'), type, size: blob.size, date: today(), fin: '', refs: {} };
    try { await filePut(o.id, { type, data: await blob.arrayBuffer() }); } catch (e) { toast('Impossible d’enregistrer le fichier : mémoire du téléphone pleine ?'); continue; }
    S.ordos.push(o); added.push(o);
  }
  if (!added.length) return;
  save(); render();

function spark(vals, label, unit) {

  const pts = v.map((x, i) => [i * st, H - 6 - (x - mn) / Math.max(mx - mn, 0.001) * (H - 12)]);
  return `<div style="margin-bottom:10px"><div class="row small"><b class="grow">${label}</b><span class="muted">dernier : ${String(v[v.length - 1]).replace('.', ',')} ${unit}</span></div><svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="M${pts.map(p => p.join(' ')).join('L')}" fill="none" stroke="var(--pri)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--pri)"/>`).join('')}</svg></div>`;

async function offer(filename, data) {

    const u = URL.createObjectURL(new Blob([data], { type: /\.csv$/.test(filename) ? 'text/csv' : 'application/json' })), a = document.createElement('a');
    a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000); toast('Fichier téléchargé.'); return;
  }
  sheet(`<div class="sh"><h2>Copier les données</h2><button class="icon" onclick="closeSheet()">✕</button></div><p class="small muted">Le téléchargement n’est pas disponible ici : copiez le contenu ci-dessous.</p><textarea id="cp" style="min-height:220px;font-size:12px">${esc(data)}</textarea><button class="btn pri block" onclick="navigator.clipboard?.writeText($('#cp').value).then(()=>toast('Copié'),()=>{$('#cp').select();toast('Sélectionné : copiez-le')})">Copier</button>`);

function exportCSV() {
  const D = monthData(ui.month), rows = [['Type', 'Date', 'Heure', 'Patient', 'Détail', 'Montant', 'Remplaçant']];
  D.vis.sort((a, b) => (a.date + a.heure).localeCompare(b.date + b.heure)).forEach(v => rows.push(['Visite', v.date, v.heure, fullName(patient(v.pid)), (v.lines || []).map(l => l.code).filter(Boolean).join(' + '), v.total.toFixed(2).replace('.', ','), v.remplacant ? 'oui' : '']));
  D.rec.forEach(r => rows.push(['Recette', r.date, '', '', r.label, r.montant.toFixed(2).replace('.', ','), '']));
  D.ch.forEach(c => rows.push(['Charge', c.date, '', '', c.cat + ' — ' + c.label, (-c.montant).toFixed(2).replace('.', ','), '']));
  if (D.retro) rows.push(['Rétrocession', ui.month, '', '', S.retro.nom, (-D.retro).toFixed(2).replace('.', ','), '']);
  const cell = x => { x = String(x); return '"' + (/^[=+\-@\t\r]/.test(x) && !/^[+-]?\d+([.,]\d+)?$/.test(x) ? "'" + x : x).replace(/"/g, '""') + '"'; }; // anti-injection de formules (Excel, Sheets)
  const csv = '\ufeff' + rows.map(r => r.map(cell).join(';')).join('\n');
  offer(`infikit-compta-${ui.month}.csv`, csv);
}

/* ---------- boîte de confirmation intégrée (les boîtes natives sont bloquées dans la page publiée) ---------- */
function ask(title, opt = {}) {
  return new Promise(res => {
    const el = $('#ask');
    el.innerHTML = `<div class="askbox" role="alertdialog" aria-modal="true" aria-labelledby="askt"><h3 id="askt">${esc(title)}</h3>${opt.detail ? `<p>${esc(opt.detail)}</p>` : ''}<div class="row"><button class="btn grow" data-a="0">${esc(opt.cancel || 'Annuler')}</button><button class="btn grow ${opt.danger ? 'dangerfill' : 'pri'}" data-a="1">${esc(opt.ok || 'Confirmer')}</button></div></div>`;
    el.hidden = false;
    const done = v => { el.hidden = true; document.removeEventListener('keydown', key); res(v); };
    const key = e => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', key);
    el.onclick = e => { if (e.target === el) done(false); };
    el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => done(b.dataset.a === '1'));
    el.querySelector('[data-a="1"]').focus();
  });
}

/* ---------- code d'accès ---------- */
async function hash(s) { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('tournee:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { let h = 0; for (const ch of 'tournee:' + s) h = (h * 31 + ch.charCodeAt(0)) | 0; return String(h); } }
function keypad(title, sub, onDone, onCancel) {
  let code = '';
  const lock = $('#lock');
  const draw = (err) => {
    lock.innerHTML = `<div class="lockicon">${LOGO(32)}</div><h2 style="margin:10px 0 2px">${esc(title)}</h2><p class="small muted" style="margin:0">${esc(err || sub || '')}</p>
      <div class="dots ${err ? 'shake' : ''}">${[0, 1, 2, 3].map(i => `<i class="${i < code.length ? 'on' : ''}"></i>`).join('')}</div>
      <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 'x', 0, '⌫'].map(k => k === 'x' ? (onCancel ? `<button class="txt" data-cancel>Annuler</button>` : '<span></span>') : `<button data-k="${k}" aria-label="${k === '⌫' ? 'Effacer' : k}">${k}</button>`).join('')}</div>`;
    lock.querySelectorAll('[data-k]').forEach(b => b.onclick = () => press(b.dataset.k));
    const c = lock.querySelector('[data-cancel]'); if (c) c.onclick = () => { document.removeEventListener('keydown', kb); lock.hidden = true; onCancel(); };
  };
  const press = k => { if (k === '⌫') code = code.slice(0, -1); else if (code.length < 4) code += k; draw(); if (code.length === 4) { const c = code; setTimeout(() => { document.removeEventListener('keydown', kb); onDone(c, msg => { code = ''; draw(msg); document.addEventListener('keydown', kb); }); }, 120); } };
  const kb = e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫'); else if (e.key === 'Escape' && onCancel) lock.querySelector('[data-cancel]')?.click(); };
  document.addEventListener('keydown', kb);
  lock.hidden = false; draw();
}
function setPin() {
  keypad('Choisissez un code', '4 chiffres, demandés à chaque ouverture', c1 => {

      if (c1 !== c2) { $('#lock').hidden = true; toast('Les deux codes ne correspondent pas. Recommencez.'); return; }

  }, () => toast('Code non modifié'));
}

  if (!isNaN(g)) { const mg = g < 20 ? g * 100 : g; if (mg < 70) push('gly', `Glycémie basse (${v.gly}) : risque d’hypoglycémie`); else if (mg > 250) push('gly', `Glycémie élevée (${v.gly})`); }

/* ---------- chiffrement (AES-GCM 256, clé dérivée PBKDF2 de la phrase secrète) ---------- */
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEYS = new Map();
function deriveKey(pass, salt) {
  const k = pass + '\u0000' + b64(salt);
  if (!KEYS.has(k)) KEYS.set(k, (async () => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  })());
  return KEYS.get(k);
}
async function seal(bytes, pass, extra) {
  G.salt = G.salt || crypto.getRandomValues(new Uint8Array(16)); // un sel par session : une seule dérivation de clé
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await deriveKey(pass, G.salt), bytes);
  return JSON.stringify(Object.assign({ app: 'infikit', v: 1, at: new Date().toISOString(), salt: b64(G.salt), iv: b64(iv) }, extra || {}, { ct: b64(new Uint8Array(ct)) }));
}
async function unseal(txt, pass) {
  const o = typeof txt === 'string' ? JSON.parse(txt) : txt;
  if (o.app !== 'infikit') throw new Error('format');
  return { env: o, bytes: new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(o.iv) }, await deriveKey(pass, unb64(o.salt)), unb64(o.ct))) };
}
const encryptState = (obj, pass) => seal(new TextEncoder().encode(JSON.stringify(obj)), pass);
async function decryptState(txt, pass) { return JSON.parse(new TextDecoder().decode((await unseal(txt, pass)).bytes)); }

/* ---------- Google : connexion (Firebase Auth, même compte que les autres apps QuenTools) + Firestore ---------- */
const FBV = '10.14.1', APP_ID = 'infikit', FB_CHUNK = 900000; // un document Firestore ≈ 1 Mo : les gros fichiers sont découpés
let FBP = null;
function fb() {
  if (!(CFG.firebase && CFG.firebase.apiKey)) return Promise.reject(new Error('Connexion Google non configurée (config.js).'));
  if (!FBP) FBP = (async () => {
    const B = `https://www.gstatic.com/firebasejs/${FBV}/`, [A, Au, Fs] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
    const app = A.initializeApp(CFG.firebase); return { A, Au, Fs, auth: Au.getAuth(app), db: Fs.getFirestore(app) };
  })().catch(() => { FBP = null; throw new Error('Impossible de joindre Google (connexion internet ?)'); });
  return FBP;
}
async function fbUser() { // -> { F, u } ou erreur needLogin
  const F = await fb(); await F.auth.authStateReady();
  if (!F.auth.currentUser) throw Object.assign(new Error('Reconnectez-vous à Google'), { needLogin: true });
  return { F, u: F.auth.currentUser };
}
function fbErr(e) {
  const c = e && e.code || '';
  if (c === 'permission-denied') return new Error('Accès refusé par Firestore : publiez les règles de sécurité (voir README).');
  if (c === 'unavailable' || c === 'deadline-exceeded') return new Error('Google injoignable (connexion internet ?)');
  if (c === 'resource-exhausted') return new Error('Quota Firestore gratuit atteint, réessayez plus tard.');
  if (c === 'failed-precondition' || c === 'not-found') return new Error('Base Firestore introuvable : créez-la dans la console Firebase (voir README).');
  return e;
}
const fref = (F, u, ...p) => F.Fs.doc(F.db, 'users', u.uid, 'apps', APP_ID, ...p);
async function fbGet(...p) { const { F, u } = await fbUser(); try { const s = await F.Fs.getDoc(fref(F, u, ...p)); return s.exists() ? s.data() : null; } catch (e) { throw fbErr(e); } }
async function fbFileGet(id) { // recolle les morceaux d'un fichier chiffré
  const { F, u } = await fbUser();
  try {
    const h = await F.Fs.getDoc(fref(F, u, 'files', id + '.0')); if (!h.exists()) return null;
    const n = h.data().n || 1, parts = [h.data().t];
    for (let i = 1; i < n; i++) { const s = await F.Fs.getDoc(fref(F, u, 'files', id + '.' + i)); if (!s.exists()) return null; parts.push(s.data().t); }
    return parts.join('');
  } catch (e) { throw fbErr(e); }
}
async function fbFilePut(id, text) {
  const { F, u } = await fbUser(), n = Math.max(1, Math.ceil(text.length / FB_CHUNK));
  try {
    for (let i = 0; i < n; i += 8) { // lots de 8 morceaux max (limite de taille d'une requête)
      const b = F.Fs.writeBatch(F.db);
      for (let k = i; k < Math.min(n, i + 8); k++) b.set(fref(F, u, 'files', id + '.' + k), { t: text.slice(k * FB_CHUNK, (k + 1) * FB_CHUNK), n, i: k });
      await b.commit();
    }
  } catch (e) { throw fbErr(e); }
  return id;
}
async function fbFileDel(id) {
  const { F, u } = await fbUser();
  try {
    const h = await F.Fs.getDoc(fref(F, u, 'files', id + '.0')), n = h.exists() ? h.data().n || 1 : 0;
    for (let i = 0; i < n; i++) await F.Fs.deleteDoc(fref(F, u, 'files', id + '.' + i));
  } catch (e) { throw fbErr(e); }
}

/* ---------- GitHub : jeton OAuth (ou jeton « gist » collé) + gists secrets ---------- */
const GH = { token: null };
function ghToken() { if (!GH.token) try { GH.token = localStorage.getItem(GH_KEY); } catch (e) { } return GH.token; }
function ghSetToken(t) { GH.token = t || null; try { t ? localStorage.setItem(GH_KEY, t) : localStorage.removeItem(GH_KEY); } catch (e) { } }
async function ghfetch(path, opt = {}) {
  const t = ghToken(); if (!t) throw Object.assign(new Error('Connectez-vous à GitHub'), { needLogin: true });
  let r; try { r = await fetch('https://api.github.com' + path, Object.assign({ cache: 'no-store' }, opt, { headers: Object.assign({ Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json' }, opt.body ? { 'Content-Type': 'application/json' } : {}, opt.headers || {}) })); }
  catch (e) { throw new Error('GitHub injoignable (connexion internet ?)'); }
  if (r.status === 401) { ghSetToken(null); throw Object.assign(new Error('Session GitHub expirée, reconnectez-vous'), { needLogin: true }); }
  if (r.status === 404) return null;
  if (r.status === 403) throw new Error('GitHub refuse l’accès : le jeton doit avoir le droit « gist »');
  if (!r.ok) throw new Error('GitHub a répondu ' + r.status);
  return r;
}
async function gistText(id, name) {
  const r = await ghfetch('/gists/' + id); if (!r) return null;
  const g = await r.json(), f = name ? g.files[name] : Object.values(g.files)[0];
  if (!f) return null;
  return f.truncated ? (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content;
}
async function mainGist(create) {
  const a = acct('github'); if (a.gist) return a.gist;
  for (let page = 1; page <= 20; page++) {
    const l = await (await ghfetch(`/gists?per_page=100&page=${page}`)).json();
    const g = l.find(x => x.description === GIST_DESC && x.files[MAIN_FILE]); if (g) return (a.gist = g.id);
    if (l.length < 100) break;
  }
  if (!create) return null;
  const g = await (await ghfetch('/gists', { method: 'POST', body: JSON.stringify({ description: GIST_DESC, public: false, files: { [MAIN_FILE]: { content: '{}' } } }) })).json();
  return (a.gist = g.id);
}

/* ---------- fournisseurs : même interface pour Google et GitHub ---------- */
const CP = {
  google: {
    async loadMain() { const d = await fbGet('main', 'current'); return d && d.text && d.text !== '{}' ? d.text : null; },
    async saveMain(text) {
      const { F, u } = await fbUser();
      if (text.length > FB_CHUNK) throw new Error('Données trop volumineuses pour la sauvegarde Google.');
      try { await F.Fs.setDoc(fref(F, u, 'main', 'current'), { text, at: Date.now() }); } catch (e) { throw fbErr(e); }
    },
    putFile: (o, text) => fbFilePut(o.id, text),
    getFile: o => fbFileGet(o.refs?.google || o.id),
    delFile: ref => fbFileDel(ref),
  },
  github: {
    async loadMain() { const id = await mainGist(false); if (!id) return null; const t = await gistText(id, MAIN_FILE); return t && t !== '{}' ? t : null; },
    async saveMain(text) {
      const body = JSON.stringify({ files: { [MAIN_FILE]: { content: text } } });
      if (await ghfetch('/gists/' + await mainGist(true), { method: 'PATCH', body })) return;
      acct('github').gist = null; // gist supprimé entre-temps : on en recrée un
      if (!await ghfetch('/gists/' + await mainGist(true), { method: 'PATCH', body })) throw new Error('Sauvegarde GitHub introuvable');
    },
    // une pièce jointe = un gist secret (pas de limite de nombre de fichiers, lecture ciblée)
    putFile: async (o, text) => (await (await ghfetch('/gists', { method: 'POST', body: JSON.stringify({ description: GIST_FILE_DESC, public: false, files: { [`ordo-${o.id}.enc.json`]: { content: text } } }) })).json()).id,
    getFile: o => o.refs.github ? gistText(o.refs.github) : null,
    delFile: ref => ghfetch('/gists/' + ref, { method: 'DELETE' }),
  },
};

/* ---------- connexion / déconnexion ---------- */
async function cloudSignIn(prov) {
  if (prov === 'google') {
    PENDING.google = PENDING.google || {};
    const F = await fb(); await F.auth.authStateReady();
    let u = F.auth.currentUser; // déjà connecté dans une autre app QuenTools : on réutilise la session
    if (!u) {
      try { u = (await F.Au.signInWithPopup(F.auth, new F.Au.GoogleAuthProvider())).user; }
      catch (e) {
        const c = e && e.code || '';
        throw new Error(c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request' ? 'Connexion annulée' : c === 'auth/popup-blocked' ? 'Autorisez les fenêtres pop-up pour ce site puis réessayez' : c === 'auth/unauthorized-domain' ? 'Domaine non autorisé dans Firebase (voir README)' : c === 'auth/operation-not-allowed' ? 'Connexion Google non activée dans Firebase (voir README)' : 'Connexion Google impossible');
      }
    }
    return { email: u.email || '', name: u.displayName || '', picture: u.photoURL || '', auto: true };
  }
  if (!ghToken()) return null; // GitHub : la connexion passe par une redirection ou un jeton collé (githubLogin)
  const u = await (await ghfetch('/user')).json();
  return { login: u.login, name: u.name || u.login, picture: u.avatar_url || '', auto: true };
}
function githubLogin(intent) {

    const st = uid() + uid();
    try { sessionStorage.setItem('infikit_gh_state', st); sessionStorage.setItem('infikit_gh_intent', intent); } catch (e) { }
    location.href = `https://github.com/login/oauth/authorize?client_id=${encodeURIComponent(GITHUB_CLIENT_ID)}&scope=gist&state=${st}&redirect_uri=${encodeURIComponent(location.origin + location.pathname)}`;
    return;
  }

  sheet(`<div class="sh"><h2>Connexion GitHub</h2><button class="icon" onclick="closeSheet()">✕</button></div>
    <ol class="small" style="padding-left:20px;margin-top:0;line-height:1.6"><li>Créez un compte gratuit sur <a href="https://github.com/signup" target="_blank" rel="noopener">github.com</a> si besoin.</li>
    <li><a href="${url}" target="_blank" rel="noopener"><b>Ouvrez cette page</b></a>, choisissez une durée limitée (« 90 days ») puis « Generate token » (seule la case <b>gist</b> est cochée).</li>
    <li>Copiez le code qui commence par <code>ghp_</code> et collez-le ici.</li></ol>
    <label class="f"><span>Jeton GitHub</span><input id="ghtok" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ghp_…"></label>
    <button class="btn pri block" onclick="githubTokenDone('${intent}')">Se connecter</button>
    <p class="note">Le jeton reste sur ce téléphone. Il ne donne accès qu’à vos « gists », où Infikit range sa sauvegarde chiffrée.</p>`);

async function githubTokenDone(intent) {
  const t = ($('#ghtok').value || '').trim(); if (!t) { toast('Collez le jeton'); return; }
  ghSetToken(t);
  try { const u = await cloudSignIn('github'); closeSheet(); await afterSignIn('github', u, intent); } catch (e) { ghSetToken(null); toast(e.message); }
}
function githubCallback() {
  const q = new URLSearchParams(location.search), code = q.get('code'), st = q.get('state');
  if (!code) return false;
  history.replaceState(null, '', location.pathname);
  let ok = false, intent = 'connect'; try { ok = st && st === sessionStorage.getItem('infikit_gh_state'); intent = sessionStorage.getItem('infikit_gh_intent') || 'connect'; sessionStorage.removeItem('infikit_gh_state'); } catch (e) { }
  if (!ok) { toast('Connexion GitHub refusée (lien expiré), réessayez.'); return false; }
  (async () => {
    try {
      while (!$('#lock').hidden) await new Promise(r => setTimeout(r, 300)); // attendre le code d'accès
      toast('Connexion à GitHub…');
      const r = await fetch(GITHUB_OAUTH_PROXY + '/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
      const j = await r.json().catch(() => ({}));
      if (!j.access_token) throw new Error('Connexion GitHub impossible' + (j.error ? ' (' + j.error + ')' : ''));
      ghSetToken(j.access_token);
      await afterSignIn('github', await cloudSignIn('github'), intent);
    } catch (e) { toast(e.message); }

}
async function afterSignIn(prov, u, intent) {
  if (!u) return;

  const other = prov === 'google' ? 'github' : 'google';
  if (S[other]) cloudSignOut(other, true);
  S[prov] = u; save(true); render(); toast('Connecté : ' + (u.email || u.login));
  await syncNow({ first: true });
}
async function connectCloud(prov) {
  if (!isPro()) { paywall('La sauvegarde chiffrée en ligne fait partie d’Infikit Pro. Vous pouvez toujours exporter un fichier de sauvegarde.'); return; }
  if (prov === 'github') return githubLogin('connect');
  try { await afterSignIn('google', await cloudSignIn('google'), 'connect'); } catch (e) { toast(e.message); }
}
function cloudSignOut(prov, quiet) {
  if (prov === 'google') { fb().then(F => F.Au.signOut(F.auth)).catch(() => { }); }
  else ghSetToken(null);
  if (S) { delete S[prov]; for (const o of S.ordos || []) if (o.refs) delete o.refs[prov]; S.trash = []; save(true); }
  if (!quiet) { render(); toast('Déconnecté de ' + PNAME[prov]); }
}

  return new Promise(res => {
    const el = $('#ask');
    el.innerHTML = `<div class="askbox" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(detail)}</p>
      <label class="f"><span>Phrase secrète</span><input id="gp1" type="password" autocomplete="${confirmTwice ? 'new-password' : 'current-password'}" minlength="8"></label>
      ${confirmTwice ? '<label class="f"><span>Confirmez</span><input id="gp2" type="password" autocomplete="new-password"></label>' : ''}
      <label class="rowitem" style="cursor:pointer;margin-bottom:6px"><span class="grow small">Mémoriser sur ce téléphone<small>Pour synchroniser automatiquement</small></span><span class="switch"><input id="gpr" type="checkbox" role="switch" checked><i></i></span></label>
      <p class="tiny muted" id="gperr" style="min-height:18px;color:var(--bad)"></p>
      <div class="row"><button class="btn grow" data-a="0">Annuler</button><button class="btn grow pri" data-a="1">Valider</button></div></div>`;
    el.hidden = false; setTimeout(() => $('#gp1').focus(), 50);
    const done = v => { el.hidden = true; res(v); };
    el.querySelector('[data-a="0"]').onclick = () => done(null);
    el.querySelector('[data-a="1"]').onclick = () => {
      const a = $('#gp1').value, b = confirmTwice ? $('#gp2').value : a;
      if (a.length < 8) { $('#gperr').textContent = '8 caractères minimum.'; return; }
      if (a !== b) { $('#gperr').textContent = 'Les deux phrases ne correspondent pas.'; return; }
      done({ pass: a, remember: $('#gpr').checked });
    };
  });
}
function setPass(r) { G.pass = r.pass; G.verified = false; try { r.remember ? localStorage.setItem(PASS_KEY, r.pass) : localStorage.removeItem(PASS_KEY); } catch (e) { } }

// silent : sans fenêtre de connexion ; bg : l'app passe en arrière-plan, aucune question possible
async function syncNow(opt = {}) {
  const prov = cloudProv(); if (!prov || SYNC.busy) return;
  if (opt.silent && S[prov].auto === false) return;
  if (opt.throttle && Date.now() - SYNC.last < 60000) return;
  if (opt.silent && (!G.pass)) { syncStatus('err', !G.pass ? 'Phrase secrète à saisir : touchez « Synchroniser »' : 'Touchez « Synchroniser » pour vous reconnecter'); return; }
  SYNC.busy = true; SYNC.last = Date.now(); syncStatus('busy');
  const a = S[prov];
  try {
    const remote = await CP[prov].loadMain(!opt.silent);
    const remoteAt = remote ? JSON.parse(remote).at : null;
    if (!G.pass) {
      const r = await askPass(remote ? 'Phrase secrète' : 'Créez votre phrase secrète', remote ? `Saisissez la phrase secrète de votre sauvegarde Infikit (${PNAME[prov]}).` : `Elle chiffre vos données et ordonnances sur ce téléphone avant l’envoi : ${PNAME[prov]} ne peut pas les lire. Notez-la bien : sans elle, la sauvegarde est irrécupérable.`, !remote);
      if (!r) { syncStatus('err', 'Synchronisation en attente de la phrase secrète'); return; }
      setPass(r);
    }
    let remoteState = null;
    if (remote && (!G.verified || (remoteAt !== a.lastCloud))) {
      try { remoteState = await decryptState(remote, G.pass); G.verified = true; }
      catch (e) { forgetPass(); throw new Error('Phrase secrète incorrecte'); }
    }
    const localDirty = !a.lastCloud || (S.updatedAt || '') > a.lastCloud;
    const remoteNew = !!remote && remoteAt !== a.lastCloud;
    let take = false;
    if (remoteNew && localDirty) {
      if (opt.bg) return;
      const k = await choose('Deux versions différentes', `${PNAME[prov]} contient une version du ${new Date(remoteAt).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}${remoteState ? ` (${remoteState.patients.length} patients)` : ''}, et ce téléphone a des modifications non envoyées (${S.patients.length} patients). Laquelle garder ?`,
        [['cloud', 'Garder celle de ' + PNAME[prov], 'pri'], ['local', 'Garder celle de ce téléphone'], ['', 'Plus tard', 'ghost']]);
      if (!k) { syncStatus('err', 'Synchronisation en attente de votre choix'); return; }
      take = k === 'cloud';
    } else take = remoteNew;
    if (take) {
      applyRemote(remoteState, prov, remoteAt); render();
      await pullFiles(prov);
      if (!opt.silent) toast('☁️ Données mises à jour depuis ' + PNAME[prov]);
    } else if (localDirty || !remote || S.ordos.some(o => !(o.refs || {})[prov]) || S.trash.length) {
      await pushFiles(prov);
      const text = await encryptState(stateForCloud(), G.pass);
      await CP[prov].saveMain(text);
      S[prov].lastCloud = JSON.parse(text).at; save(true);
      if (!opt.silent) toast('☁️ Données chiffrées envoyées sur ' + PNAME[prov]);
    } else if (!opt.silent) toast('Déjà à jour ✔︎');
    syncStatus('ok');
  } catch (e) {
    syncStatus('err', e.message || 'Synchronisation impossible');
    if (!opt.silent) toast(e.message || 'Synchronisation impossible');
  } finally { SYNC.busy = false; if (!opt.silent && ui.tab === 'reglages' && $('#sheet').hidden && $('#ask').hidden) render(); }
}
async function cloudRestore(prov, signedIn) {
  try {
    if (!signedIn) {
      if (prov === 'github') return githubLogin('restore');
      PENDING.google = await cloudSignIn('google');
    }
    toast('Recherche de la sauvegarde…');
    const remote = await CP[prov].loadMain(true);
    if (!remote) {
      if (!S) { toast(`Aucune sauvegarde Infikit sur ce compte ${PNAME[prov]} : commencez une tournée, elle sera synchronisée.`); return; }
      return syncNow({ first: true });
    }
    const at = JSON.parse(remote).at;
    let d;
    for (;;) {
      const r = await askPass('Phrase secrète', `Sauvegarde du ${new Date(at).toLocaleString('fr-FR')}. Saisissez la phrase secrète utilisée sur votre autre appareil.`);
      if (!r) return;
      try { d = await decryptState(remote, r.pass); setPass(r); G.verified = true; break; } catch (e) { toast('Phrase secrète incorrecte, réessayez.'); }
    }
    if (S && !await ask('Remplacer les données de ce téléphone ?', { detail: `La sauvegarde contient ${d.patients.length} patients et ${(d.visits || []).length} visites.`, ok: 'Restaurer', danger: true })) return;
    if (S && !S[prov]) { const other = prov === 'google' ? 'github' : 'google'; if (S[other]) cloudSignOut(other, true); S[prov] = PENDING[prov]; delete PENDING[prov]; }
    applyRemote(d, prov, at);
    ui.date = today(); go('tournee'); toast('Données retrouvées ✔︎ Téléchargement des ordonnances…');
    SYNC.busy = true;
    try { await pullFiles(prov); syncStatus('ok'); toast('Tout est à jour sur ce téléphone ✔︎'); } finally { SYNC.busy = false; render(); }
  } catch (e) { toast(e.message || 'Restauration impossible'); }
}

/* ---------- Abonnement Infikit Pro ----------
   Le mode payant s'active depuis l'administration QuenTools (onglet Infikit) : tant qu'il est coupé, tout est gratuit.
   Réglages publics : qt_admin/infikit (paid, freeLimit, payUrl). Abonnés : qt_infikit_pro/{adresse Google en minuscules}.
   Hors connexion, le dernier état connu est gardé ; un abonné vérifié reste Pro 30 jours sans réseau. Aucune donnée de patient n'est envoyée. */
const BKEY = 'infikit_billing', BILL = { paid: false, freeLimit: 10, payUrl: '', pro: false, proFor: '', proAt: 0 };
function billLoad() { try { const d = JSON.parse(localStorage.getItem(BKEY) || 'null'); if (d && typeof d === 'object') Object.assign(BILL, { paid: d.paid === true, freeLimit: Math.max(1, +d.freeLimit || 10), payUrl: /^https:\/\//.test(d.payUrl || '') ? d.payUrl : '', pro: d.pro === true, proFor: String(d.proFor || ''), proAt: +d.proAt || 0 }); } catch (e) { } }
function billSave() { try { localStorage.setItem(BKEY, JSON.stringify(BILL)); } catch (e) { } }
const isPro = () => !BILL.paid || (BILL.pro && Date.now() - BILL.proAt < 30 * 864e5);
const activePatients = () => S.patients.filter(p => !p.archive).length;
const canAddPatient = () => isPro() || activePatients() < BILL.freeLimit;
async function billRefresh() {
  const f = CFG.firebase; if (!(f && f.projectId && f.apiKey)) return;
  try {
    const r = await fetch(`https://firestore.googleapis.com/v1/projects/${f.projectId}/databases/(default)/documents/qt_admin/infikit?key=${f.apiKey}`, { cache: 'no-store' });
    if (r.status === 404) { BILL.paid = false; BILL.payUrl = ''; }
    else if (r.ok) {
      const d = (await r.json()).fields || {}, u = (d.payUrl || {}).stringValue || '';
      BILL.paid = (d.paid || {}).booleanValue === true; BILL.freeLimit = Math.max(1, parseInt((d.freeLimit || {}).integerValue) || 10); BILL.payUrl = /^https:\/\//.test(u) ? u : '';
    } else return;
  } catch (e) { return; }
  billSave();
  if (BILL.paid && BILL.proFor) await proRefresh();
}
async function proRefresh(ask) { // vérifie dans Firestore si l'adresse Google connectée est abonnée
  try {
    const F = await fb(); await F.auth.authStateReady();

    if (!u && ask) u = (await F.Au.signInWithPopup(F.auth, new F.Au.GoogleAuthProvider())).user;
    if (!u || !u.email) return null;
    const mail = u.email.toLowerCase(), d = await F.Fs.getDoc(F.Fs.doc(F.db, 'qt_infikit_pro', mail)), v = d.exists() ? d.data() : null;
    BILL.pro = !!v && !(v.until && Date.parse(v.until) < Date.now()); BILL.proFor = mail; BILL.proAt = Date.now(); billSave();

  } catch (e) { if (ask) throw e; return null; }
}

}
