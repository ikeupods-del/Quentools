<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Studio Posts</title>
<!-- Studio Posts : création de publications Instagram et TikTok (images) aux couleurs du Parvis et de QuenTools.
     Outil privé, ouvert directement depuis le disque (aucun serveur, aucune ressource externe).
     Un seul moteur de rendu (canvas) sert à l'aperçu et à l'export : ce qu'on voit est exactement ce qu'on exporte.
     Données (polices, bibliothèque) : donnees.js, généré par tools/generateur-posts.js. -->
<style>
:root{
  --bg:#0f0f13;--panneau:#17171d;--panneau-2:#1e1e26;--ligne:#2a2a34;--ligne-2:#363642;--texte:#ececf1;--doux:#a3a3b2;--pale:#6f6f7e;
  --accent:#7b66ff;--accent-2:#5b3df5;--ok:#3ecf8e;--alerte:#ffb547;--erreur:#ff6b6b;--r:10px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--texte);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ligne-2);background:var(--panneau-2);border-radius:8px;padding:7px 12px;white-space:nowrap}
button:hover{border-color:#4a4a58;background:#24242e}
button.primaire{background:var(--accent-2);border-color:var(--accent-2);color:#fff;font-weight:600}
button.primaire:hover{background:#6a4ff7}
button.mini{padding:4px 8px;font-size:12px}
button:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],select,textarea{width:100%;background:#101015;border:1px solid var(--ligne-2);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px;line-height:1.45}
label.champ{display:block;margin:0 0 14px}
label.champ>span{display:block;font-size:12px;color:var(--doux);margin-bottom:6px}
label.champ small{display:block;color:var(--pale);font-size:11px;margin-top:5px;line-height:1.4}

.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--ligne);background:var(--panneau);min-width:0}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;margin-right:6px;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#5b3df5,#c9a45c);display:block}
#nomProjet{flex:0 1 220px;min-width:110px;background:transparent;border-color:transparent;font-weight:600}
#nomProjet:hover{border-color:var(--ligne-2)}
.segment{display:flex;background:#101015;border:1px solid var(--ligne-2);border-radius:9px;padding:3px;gap:2px}
.segment button{border:0;background:transparent;padding:5px 12px;border-radius:6px;color:var(--doux)}
.segment button.on{background:var(--panneau-2);color:var(--texte);box-shadow:0 0 0 1px var(--ligne-2)}
.segment button[data-marque=parvis].on{color:#e3c785}
.segment button[data-marque=quentools].on{color:#d7f24a}
header select{width:auto;max-width:190px}
header button{flex:none}
.espace{flex:1}
header{overflow-x:auto;scrollbar-width:thin}
#bChat{background:#2a2250;border-color:#5b3df5}
#chat{position:fixed;top:56px;right:0;bottom:0;width:min(410px,100vw);z-index:40;background:var(--panneau);border-left:1px solid var(--ligne-2);display:none;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.45)}
#chat.ouvert{display:flex}
#chat header{height:auto;padding:12px 14px;overflow:visible}#chat header h2{margin:0;font-size:15px}
#chatIA{padding:8px 14px 0;font-size:12px;color:var(--doux)}
#chatFil{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0}
.mc{max-width:92%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.mc.moi{align-self:flex-end;background:var(--accent-2);color:#fff}.mc.assistant{align-self:flex-start;background:var(--panneau-2);border:1px solid var(--ligne-2)}
.mc small{display:block;margin-top:5px;color:var(--doux);font-size:11.5px}.mc .warn{color:var(--alerte)}
#chatSugg[hidden]{display:none}#chatSugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}#chatSugg button{font-size:12px;white-space:normal;text-align:left;border-radius:12px;color:var(--doux);background:transparent;padding:5px 9px}
#chatForm{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--ligne);align-items:end}
#chatSaisie{min-height:56px;max-height:130px;resize:vertical;background:var(--panneau-2);border:1px solid var(--ligne-2);border-radius:8px;padding:8px 10px}
#bMaj{display:none;align-items:center;gap:10px;padding:7px 14px;background:#33290f;color:#ffd98a;font-size:13px}#bMaj.vu{display:flex}


.corps{display:grid;grid-template-columns:200px 1fr 330px;min-height:0}
aside{background:var(--panneau);min-height:0;overflow:auto}
#liste{border-right:1px solid var(--ligne);padding:12px;display:flex;flex-direction:column;gap:10px}
.vignette{position:relative;border-radius:8px;border:2px solid transparent;cursor:pointer;background:#000;line-height:0}
.vignette canvas{width:100%;border-radius:6px;display:block}
.vignette.on{border-color:var(--accent)}
.vignette b{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;line-height:1;padding:4px 6px;border-radius:5px}
.vignette.trop::after{content:"!";position:absolute;right:6px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--alerte);color:#000;font:700 12px/18px sans-serif;text-align:center}
.vignette.glisse{opacity:.4}
.vignette.cible{border-color:var(--ok)}
#ajout{margin-top:4px}

.scene{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.barre{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--ligne);color:var(--doux);flex-wrap:wrap}
.barre .pos{min-width:58px;text-align:center;color:var(--texte)}
.barre label{display:flex;align-items:center;gap:6px;cursor:pointer}
.toile{flex:1 1 0;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0}
#apercu{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:6px;box-shadow:0 20px 60px -20px #000,0 0 0 1px var(--ligne)}
#alertes{margin:0 16px;display:flex;flex-direction:column;gap:6px}
#alertes div{background:rgba(255,181,71,.1);border:1px solid rgba(255,181,71,.35);color:#ffd28a;border-radius:8px;padding:8px 12px;font-size:13px}
#alertes div.ok{background:rgba(62,207,142,.08);border-color:rgba(62,207,142,.3);color:#8fe8be}
.legende{margin:10px 16px 14px;flex:none;background:var(--panneau);border:1px solid var(--ligne);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:1fr;gap:10px}
.legende h3{margin:0;font-size:13px;color:var(--doux);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.legende .boutons{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.legende .compte{color:var(--pale);font-size:12px;margin-left:auto}

#inspecteur{border-left:1px solid var(--ligne);padding:16px}
#inspecteur h2{font-size:15px;margin:0 0 4px}
#inspecteur .sous-titre{color:var(--pale);font-size:12px;margin:0 0 16px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;padding-bottom:16px;border-bottom:1px solid var(--ligne)}
.themes{display:flex;gap:8px}
.themes button{width:38px;height:38px;border-radius:9px;padding:0;border:2px solid transparent;position:relative}
.themes button.on{border-color:#fff}
.themes button i{position:absolute;right:5px;bottom:5px;width:10px;height:10px;border-radius:50%}
.image-zone{display:flex;gap:8px;align-items:center}
.image-zone img{width:52px;height:80px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--ligne-2)}
.aide{color:var(--pale);font-size:12px;line-height:1.5;margin-top:22px;padding-top:14px;border-top:1px solid var(--ligne)}
.aide b{color:var(--doux)}

.modal{position:fixed;inset:0;background:rgba(5,5,8,.72);display:none;align-items:center;justify-content:center;z-index:10;padding:24px}
.modal.ouvert{display:flex}
.boite{background:var(--panneau);border:1px solid var(--ligne-2);border-radius:14px;width:min(1080px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.boite header{height:auto;padding:14px 18px;gap:12px}
.boite header h2{margin:0;font-size:16px}
.onglets{display:flex;gap:4px;flex-wrap:wrap}
.onglets button{border:0;background:transparent;color:var(--doux)}
.onglets button.on{background:var(--panneau-2);color:var(--texte)}
.grille{padding:18px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.carte{background:#101015;border:1px solid var(--ligne);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative}
.carte:hover{border-color:var(--accent)}
.carte canvas{width:100%;display:block;background:#000}
.carte div{padding:9px 10px;font-size:12.5px;line-height:1.35}
.carte small{display:block;color:var(--pale);margin-top:3px}
.carte .suppr{position:absolute;top:6px;right:6px;padding:2px 7px;background:rgba(0,0,0,.7);border-color:transparent}
.vide{color:var(--pale);padding:30px;grid-column:1/-1;text-align:center}
.gen{padding:16px 18px 20px;display:grid;gap:12px;overflow:auto}.gen label{display:grid;gap:5px;font-size:12px;color:var(--doux)}.gen select,.gen input[type=text]{background:var(--panneau-2);border:1px solid var(--ligne-2);border-radius:8px;padding:9px 10px;color:var(--texte);font-size:14px}
.gligne{display:flex;gap:12px;align-items:end}.gligne>label{flex:1}.gen .gcase{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:13px;flex:1;padding-bottom:9px}.gdoux{color:var(--doux);font-size:13px;margin:0}
#gRes{display:grid;gap:8px}#gRes .ok{border:1px solid var(--ligne-2);background:var(--panneau-2);border-radius:10px;padding:12px;font-size:13px}#gRes .note{color:#e8c27a;font-size:12.5px;margin:4px 0 0}#gRes progress{width:100%}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#26262f;border:1px solid var(--ligne-2);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.vu{opacity:1;transform:translateX(-50%)}
#chargement{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--doux);z-index:30}
@media (max-width:1380px){.logo span{display:none}}
@media (max-width:1100px){.corps{grid-template-columns:150px 1fr 290px}}
@media (max-height:760px){.legende textarea{min-height:48px}.legende{gap:6px;padding:10px}}
</style>
</head>
<body>
<div id="chargement">Chargement des polices…</div>
<div id="bMaj" role="status"><span id="bMajTexte"></span><button id="bMajGo" class="mini">Télécharger</button></div>
<div class="app">
  <header>
    <div class="logo"><i></i><span>Studio Posts</span></div>
    <input type="text" id="nomProjet" aria-label="Nom de la publication">
    <div class="segment" id="marques" role="group" aria-label="Marque">
      <button data-marque="parvis">Le Parvis</button>
      <button data-marque="quentools">QuenTools</button>
    </div>
    <select id="format" aria-label="Format">
      <option value="45">4:5 · Instagram</option>
      <option value="11">1:1 · Carré</option>
      <option value="916">9:16 · Story, Reels, TikTok</option>
    </select>
    <button id="bGenerer" class="primaire" title="Choisir un thème : la publication est écrite et mise en page pour toi (G)">✨ Générer</button>
    <button id="bChat" title="Explique en français ce que tu veux : l’assistant crée ou retouche la publication (C)">💬 Assistant</button>
    <div class="espace"></div>
    <button id="bNouveau" title="Partir d'un modèle (N)">Nouveau</button>
    <button id="bBiblio" title="Mes publications et publications prêtes (B)">Bibliothèque</button>
    <button id="bJson" title="Enregistrer le projet dans un fichier">Enregistrer</button>
    <button id="bOuvrir" title="Ouvrir un projet enregistré">Ouvrir</button>
    <button id="bJpg" title="Exporter l'image affichée en JPG (⌘E)">Image JPG</button>
    <button id="bAirdrop" title="Envoyer toutes les images et la légende par AirDrop (⇧⌘A)" hidden>AirDrop</button>
    <button id="bZip" class="primaire" title="Exporter toutes les images et la légende en .zip (⇧⌘E)">Tout exporter</button>
    <input type="file" id="fJson" accept=".json,application/json" hidden>
  </header>
  <div class="corps">
    <aside id="liste" aria-label="Diapositives"></aside>
    <section class="scene">
      <div class="barre">
        <button class="mini" id="bPrec" title="Image précédente (←)">◀</button>
        <span class="pos" id="pos">1 / 1</span>
        <button class="mini" id="bSuiv" title="Image suivante (→)">▶</button>
        <label id="lZones"><input type="checkbox" id="zones"> Zones masquées par TikTok</label>
        <label><input type="checkbox" id="points"> Points de progression</label>
        <span class="espace"></span>
        <span id="taille"></span>
      </div>
      <div class="toile"><canvas id="apercu" width="1080" height="1350" aria-label="Aperçu de l'image"></canvas></div>
      <div id="alertes" aria-live="polite"></div>
      <div class="legende">
        <h3>Texte de la publication <span class="compte" id="compte"></span></h3>
        <input type="text" id="lgTitre" placeholder="Titre (TikTok) ou première ligne">
        <textarea id="lgTexte" rows="3" placeholder="Légende, appel à commenter, hashtags…"></textarea>
        <div class="boutons">
          <button class="mini" id="cpTitre">Copier le titre</button>
          <button class="mini" id="cpTexte">Copier la légende</button>
          <button class="mini" id="cpHash">Ajouter les hashtags de la marque</button>
        </div>
      </div>
    </section>
    <aside id="inspecteur" aria-label="Réglages de l'image"></aside>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitre">
  <div class="boite">
    <header><h2 id="mTitre">Nouveau</h2><div class="onglets" id="mOnglets"></div><div class="espace"></div><button id="mFermer">Fermer</button></header>
    <div class="grille" id="mGrille"></div>
  </div>
</div>
<div class="modal" id="modalGen" role="dialog" aria-modal="true" aria-labelledby="gTitre">
  <div class="boite" style="width:min(680px,100%)">
    <header><h2 id="gTitre">✨ Générer une publication</h2><div class="espace"></div><button id="gFermer">Fermer</button></header>
    <div class="gen">
      <p class="gdoux">Choisis la marque et le thème : la publication est écrite, mise en page et prête à exporter. Tu relis, puis tu publies.</p>
      <div class="gligne"><label>Marque<select id="gMarque"><option value="parvis">Le Parvis</option><option value="quentools">QuenTools</option></select></label>
        <label>Thème<select id="gTheme"></select></label></div>
      <label id="gLSujet"><span id="gAide">Sujet</span><input type="text" id="gSujet" list="gSuggestions" autocomplete="off" placeholder="facultatif"><datalist id="gSuggestions"></datalist></label>
      <div class="gligne"><label>Format<select id="gFormat"><option value="45">4:5 · Instagram</option><option value="11">1:1 · Carré</option><option value="916">9:16 · Story, Reels, TikTok</option></select></label>
        <label class="gcase"><input type="checkbox" id="gExport"> Exporter tout de suite (.zip)</label></div>
      <div id="gIA" class="gdoux"></div>
      <div class="gligne"><button class="primaire" id="gGo" style="flex:1;padding:12px;font-size:15px">✨ Générer la publication</button></div>
      <div id="gRes"></div>
    </div>
  </div>
</div>
<aside id="chat" aria-label="Assistant" role="complementary">
  <header><h2>💬 Assistant</h2><div class="espace"></div><button id="chatFermer">Fermer</button></header>
  <div id="chatIA"></div>
  <div id="chatFil" aria-live="polite"></div>
  <div id="chatSugg"></div>
  <form id="chatForm"><textarea id="chatSaisie" maxlength="1200" placeholder="Ex. : « Une story pour un plombier à Nantes, ton rassurant » ou « raccourcis le titre de l’image 2 »"></textarea><button class="primaire" id="chatEnvoi" type="submit">Envoyer</button></form>
</aside>
<div class="toast" id="toast"></div>

<script src="donnees.js"></script>
<script src="generation.js"></script>
<script>
'use strict';
/* ═══════════════════ 1. Outils ═══════════════════ */
const $ = s => document.querySelector(s);
const W = 1080, FORMATS = { 45: 1350, 11: 1080, 916: 1920 };
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const echap = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// typographie française : apostrophe courbe, espace insécable avant : ; ? ! » et après «
const fr = s => String(s ?? '').replace(/'/g, '’').replace(/ ([:;?!»])/g, ' $1').replace(/« /g, '« ');
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"';
const police = (fam, poids, taille, italique) => `${italique ? 'italic ' : ''}${poids} ${taille}px ${fam}, ${EMOJI}, sans-serif`;
const LS_OK = 'letterSpacing' in CanvasRenderingContext2D.prototype;
const espacement = (ctx, px) => { if (LS_OK) ctx.letterSpacing = (px || 0) + 'px'; };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('vu'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('vu'), 2200); }
function telecharger(blob, nom) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nom; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
const slug = s => (String(s || 'publication').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50)) || 'publication';

async function chargerPolices() {
  for (const p of window.POLICES || []) {
    const f = new FontFace(p.famille, `url(data:font/woff2;base64,${p.data})`, { style: p.style, weight: p.poids });
    await f.load(); document.fonts.add(f);
  }
}

/* ═══════════════════ 2. Texte : mots, retour à la ligne, ajustement ═══════════════════ */
// « *mot* » = mot en couleur d'accent ; retours à la ligne conservés
function mots(texte) {
  const out = []; let cur = null, acc = false; const s = fr(texte);
  for (const ch of s) {
    if (ch === '*') { acc = !acc; continue; }
    if (ch === '\n') { if (cur) out.push(cur); cur = null; out.push({ br: true }); continue; }
    if (ch === ' ') { if (cur) out.push(cur); cur = null; continue; }
    if (!cur) cur = { pieces: [] };
    const der = cur.pieces[cur.pieces.length - 1];
    if (der && der.acc === acc) der.t += ch; else cur.pieces.push({ t: ch, acc });
  }
  if (cur) out.push(cur);
  return out;
}
function couper(ctx, liste, maxW) {
  const sp = ctx.measureText(' ').width, lignes = []; let l = { mots: [], w: 0 };
  for (const m of liste) {
    if (m.br) { lignes.push(l); l = { mots: [], w: 0 }; continue; }
    m.w = m.pieces.reduce((a, p) => a + ctx.measureText(p.t).width, 0);
    if (l.mots.length && l.w + sp + m.w > maxW) { lignes.push(l); l = { mots: [m], w: m.w }; }
    else { l.w += (l.mots.length ? sp : 0) + m.w; l.mots.push(m); }
  }
  if (l.mots.length || !lignes.length) lignes.push(l);
  return lignes;
}
// largeur la plus étroite qui garde le même nombre de lignes (titres équilibrés)
function equilibrer(ctx, liste, maxW) {
  let lignes = couper(ctx, liste, maxW); const n = lignes.length;
  if (n < 2 || liste.some(m => m.br)) return lignes;
  let bas = maxW * 0.45, haut = maxW;
  for (let i = 0; i < 12; i++) { const mid = (bas + haut) / 2; if (couper(ctx, liste, mid).length > n) bas = mid; else haut = mid; }
  return couper(ctx, liste, haut);
}
const fontBloc = (b, taille) => police(b.fam, b.poids, taille, b.italique);

/* Blocs : { texte, fam, poids, taille, interligne, couleur, accent, align, avant, apres, ls (em), equilibre, largeur, puce, retrait }
   ou { regle: true, w, h, couleur, avant, apres } ou { dessin: (ctx, x, y, k, w) => …, h, avant, apres }.
   La taille diminue (jusqu'à 45 %) tant que l'ensemble dépasse son cadre. */
function mesurer(ctx, blocs, boite, k) {
  const items = []; let h = 0, large = false;
  for (const b of blocs) {
    if (b == null) continue;
    const avant = (b.avant || 0) * k, apres = (b.apres || 0) * k;
    if (b.regle) { items.push({ b, h: b.h, avant, apres }); h += avant + b.h + apres; continue; }

    if ($('#gExport') && $('#gExport').checked && !options.sansExport && !options.silencieux) await exporterCarrousel();

  } catch (e) { if (res) res.innerHTML = `<div class="ok" style="color:#ff9b9b">${echap(e.message)}</div>`; return { erreur: e.message }; }
  finally { genEnCours = false; if (go) go.disabled = false; }
}
function brancherGenerer() {
  $('#bGenerer').onclick = ouvrirGenerer; $('#gFermer').onclick = fermerGenerer; $('#modalGen').onclick = e => { if (e.target.id === 'modalGen') fermerGenerer(); };
  $('#gMarque').onchange = majGenTheme; $('#gTheme').onchange = majGenSujet; $('#gGo').onclick = () => genererPublication();
  $('#gSujet').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); genererPublication(); } };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') fermerGenerer(); else if (e.key.toLowerCase() === 'g' && !e.metaKey && !e.ctrlKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) ouvrirGenerer(); });
}

/* ═══════════════════ 13. Assistant : on explique en français, l'IA crée ou retouche la publication ═══════════════════ */
const CLE_CHAT = 'studioPosts:chat:v1';
let histoChat = [], chatEnCours = false;
function msgChat(role, texte, extra = {}) {
  const f = $('#chatFil'), d = document.createElement('div'); d.className = 'mc ' + role; d.textContent = texte;
  for (const n of extra.alertes || []) { const w = document.createElement('small'); w.className = 'warn'; w.textContent = '⚠ ' + n; d.appendChild(w); }
  if (extra.note) { const n = document.createElement('small'); n.textContent = extra.note; d.appendChild(n); }
  f.appendChild(d); f.scrollTop = f.scrollHeight; return d;
}
const sauverChat = () => { try { localStorage.setItem(CLE_CHAT, JSON.stringify(histoChat.slice(-30))); } catch (e) { /* stockage indisponible */ } };
async function majChatIA() {
  const z = $('#chatIA');
  if (!window.studioIA) { z.textContent = 'Dans l’application Mac, l’assistant comprend toutes tes demandes grâce à l’IA locale. Ici, il comprend les demandes simples.'; return { installee: false }; }
  const e = await window.studioIA.etat();
  if (e.installee) z.textContent = '🧠 IA locale prête : tout se passe sur ton Mac, sans internet.';
  else {
    z.innerHTML = `IA locale non installée (téléchargement unique d’environ ${(e.mo / 1000).toFixed(1)} Go, partagé avec QuentMovie) : sans elle, l’assistant ne comprend que les demandes simples. <button class="mini" id="chatInstaller">Installer l’IA</button>`;
    $('#chatInstaller').onclick = async () => {
      z.innerHTML = '<progress max="100" value="0" style="width:100%"></progress> Téléchargement de l’IA locale…';
      try { await window.studioIA.installer(p => { const b = z.querySelector('progress'); if (b) b.value = Math.round(p * 100); }); toast('IA locale installée'); } catch (er) { z.textContent = 'Installation impossible : ' + er.message; return; }
      majChatIA();
    };
  }
  return e;
}
function ouvrirChat(o = true) { $('#chat').classList.toggle('ouvert', o); if (o) { majChatIA(); $('#chatSaisie').focus(); } }
// dépendances de génération partagées (IA locale si elle est installée)
async function depsGeneration(options = {}) {
  const e = window.studioIA ? await window.studioIA.etat() : { installee: false };
  return { ecrire: options.ecrire || (window.studioIA ? m => window.studioIA.ecrire(m) : null), ia: !options.sansIA && !!(options.ecrire || e.installee), installee: e.installee };
}
async function envoyerChat(texte, options = {}) {
  texte = String(texte || '').trim(); if (!texte || chatEnCours) return null;
  chatEnCours = true; $('#chatEnvoi').disabled = true; $('#chatSugg').hidden = true;
  msgChat('moi', texte); histoChat.push({ role: 'moi', texte });
  const attente = msgChat('assistant', 'Je réfléchis…');
  try {
    const dg = await depsGeneration(options);
    const plan = await Generation.comprendre({ message: texte, historique: histoChat.slice(0, -1), projet, marque: projet.marque, format: projet.format }, { ecrire: dg.ecrire, ia: dg.ia });
    let reponse = plan.reponse || '', extra = { note: plan.source === 'ia' ? '' : (window.studioIA && !dg.installee ? 'IA locale non installée : demande comprise par mots-clés.' : '') }, resultat = null;
    if (plan.action === 'generer') {
      attente.textContent = 'J’écris la publication…';
      const r = await genererPublication({ marque: plan.marque, themeId: plan.theme, sujet: plan.sujet, secteur: plan.secteur, format: plan.format || projet.format, consignes: plan.consignes, ecrire: options.ecrire, sansIA: options.sansIA, silencieux: true });
      if (r.erreur) reponse = 'Je n’ai pas pu créer la publication : ' + r.erreur;
      else {
        resultat = r;
        reponse = (reponse ? reponse + '\n\n' : '') + `✅ « ${r.projet.nom} » est prête : ${r.projet.slides.length} image${r.projet.slides.length > 1 ? 's' : ''} (${r.source === 'ia' ? 'écrite par l’IA locale' : 'publication déjà écrite'}). Demande-moi de la retoucher (« raccourcis le titre de l’image 2 », « rends la légende plus chaleureuse »…) ou exporte-la.`;
        extra.alertes = [...(r.notes || []), ...(r.alertes || []), ...(r.trop ? [`${r.trop} image(s) avec un texte trop long`] : [])];
      }
    } else if (plan.action === 'modifier') {
      const v = Generation.verifierModifs(projet, plan.modifications, texte);
      if (v.ok.length) {
        modifier(() => { for (const m of v.ok) { if (m.legende) projet.legende[m.legende] = m.valeur; else projet.slides[m.index][m.champ] = m.valeur; } });
        if (v.ok.some(m => m.index !== undefined)) { sel = Math.min(projet.slides.length - 1, Math.max(0, v.ok.find(m => m.index !== undefined).index)); afficherListe(); afficherInspecteur(); rendreTout(); }
        reponse = (reponse ? reponse + '\n\n' : '') + `✅ ${v.ok.length} modification${v.ok.length > 1 ? 's' : ''} faite${v.ok.length > 1 ? 's' : ''}. ⌘Z pour annuler.`;
      } else reponse = (reponse ? reponse + '\n\n' : '') + 'Je n’ai rien modifié.';
      extra.alertes = v.refus;
      resultat = { modifs: v.ok.length, refus: v.refus };
    } else if (!reponse) reponse = 'Dis-moi quelle publication créer (marque, thème, sujet, format) ou ce que je dois retoucher dans celle qui est affichée.';
    attente.remove(); msgChat('assistant', reponse, extra); histoChat.push({ role: 'assistant', texte: reponse }); sauverChat();
    return { plan, reponse, resultat };
  } catch (e) { attente.remove(); msgChat('assistant', 'Je n’ai pas pu traiter ce message : ' + e.message); return { erreur: e.message }; }
  finally { chatEnCours = false; $('#chatEnvoi').disabled = false; $('#chatSaisie').focus(); }
}
function brancherChat() {
  try { histoChat = JSON.parse(localStorage.getItem(CLE_CHAT) || '[]'); } catch (e) { histoChat = []; }
  if (histoChat.length) histoChat.forEach(h => msgChat(h.role, h.texte));
  else msgChat('assistant', 'Bonjour ! Dis-moi en français la publication que tu veux : la marque (Le Parvis ou QuenTools), le sujet, le format (Instagram, carré, story/TikTok) et l’ambiance. Je l’écris, je la mets en page, et je la retouche si tu me le demandes.');
  const idees = ['Une story pour un plombier à Nantes, ton rassurant', 'Un verset sur le courage pour Instagram', 'Un carrousel pour une coiffeuse : réservation en deux minutes', 'Raccourcis le titre de l’image 1'];
  $('#chatSugg').innerHTML = idees.map(t => `<button type="button">${echap(t)}</button>`).join(''); $('#chatSugg').hidden = histoChat.length > 0;
  $('#bChat').onclick = () => ouvrirChat(!$('#chat').classList.contains('ouvert')); $('#chatFermer').onclick = () => ouvrirChat(false);
  $('#chatSugg').onclick = e => { const b = e.target.closest('button'); if (b) { $('#chatSaisie').value = b.textContent; $('#chatSaisie').focus(); } };
  $('#chatForm').onsubmit = e => { e.preventDefault(); const t = $('#chatSaisie').value; $('#chatSaisie').value = ''; envoyerChat(t); };
  $('#chatSaisie').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#chatForm').requestSubmit(); } };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') ouvrirChat(false); else if (e.key.toLowerCase() === 'c' && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) { e.preventDefault(); ouvrirChat(true); } });
  try { if (!localStorage.getItem('studioPosts:chat:vu')) { localStorage.setItem('studioPosts:chat:vu', '1'); ouvrirChat(true); } } catch (e) { /* stockage indisponible */ }
}
// nouvelle version publiée : bandeau avec un bouton vers la page de téléchargement
async function verifierMaj() {
  if (!window.studioMaj) return;
  try { const v = await window.studioMaj.verifier(); if (!v) return; $('#bMajTexte').textContent = `Une nouvelle version de Studio Posts est disponible (${v.version}).`; $('#bMajGo').onclick = () => window.studioMaj.ouvrir(v.url); $('#bMaj').classList.add('vu'); } catch (e) { /* hors ligne */ }
}

(async () => {
  try { await chargerPolices(); }
  catch (e) { $('#chargement').textContent = 'Polices introuvables : relancer « node tools/generateur-posts.js ».'; return; }
  charger(); brancher(); brancherGenerer(); brancherChat(); toutAfficher(); verifierMaj();
  $('#chargement').remove();
  // accès pour les contrôles automatiques (tools/verifier-generateur-posts.js)
  window.studio = { MODELES, FORMATS, get projet() { return projet; }, ouvrir: p => { const n = nouveauProjet(p, p.marque); etat.projets.unshift(n); ouvrirProjet(n); return n; }, rendre: (p, i) => { const c = document.createElement('canvas'); c.width = W; c.height = FORMATS[p.format]; return rendre(c.getContext('2d'), p, i); },
    planche: (p, e = 0.25) => { const H = FORMATS[p.format], n = p.slides.length, c = document.createElement('canvas'), x = c.getContext('2d'); c.width = Math.round(n * W * e + (n - 1) * 12); c.height = Math.round(H * e); x.fillStyle = '#888'; x.fillRect(0, 0, c.width, c.height); hors.width = W; hors.height = H; p.slides.forEach((s, i) => { rendre(ctxH, p, i); x.drawImage(hors, 0, 0, W, H, Math.round(i * (W * e + 12)), 0, Math.round(W * e), Math.round(H * e)); }); hors.height = FORMATS[projet.format]; return c.toDataURL('image/png'); },
    alertes: alertesContenu, generer: genererPublication, chat: envoyerChat, get histoChat() { return histoChat; } };
})();
</script>
