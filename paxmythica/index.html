<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; object-src 'none'">
<title>Pax Mythica</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- accueil -->
<section id="accueil" class="ecran actif">
  <canvas id="fondAccueil"></canvas>
  <div class="voile"></div>
  <div class="accueil-centre">
    <div class="sceau">⚡</div>
    <h1>Pax Mythica</h1>
    <p class="devise">Bâtis un empire sous le regard des dieux</p>
    <nav class="menu-principal" id="menuAccueil"></nav>
    <p class="version" id="versionApp"></p>
  </div>
</section>

<!-- création d'une partie (rapide ou personnalisée) -->
<section id="creation" class="ecran"><div class="creation-fond"><div id="creationContenu" class="creation"></div></div></section>

<!-- jeu (et éditeur de carte) -->
<section id="jeu" class="ecran">
  <canvas id="carte"></canvas>
  <canvas id="carte3d" class="cache"></canvas>
  <canvas id="etiquettes3d" class="cache"></canvas>
  <header id="barre"></header>
  <aside id="gauche" class="panneau cache"></aside>
  <aside id="droite" class="panneau">
    <nav class="onglets" id="onglets"></nav>
    <div id="ongletContenu" class="defile"></div>
  </aside>
  <div id="bandeauCible" class="bandeau cache"></div>
  <form id="decret" class="decret" autocomplete="off">
    <span class="decret-sceau">📜</span>
    <textarea id="decretTexte" rows="1" maxlength="600" placeholder="Écris un décret : « lever 10 archers », « construire un temple », « guerre à … »"></textarea>
    <button type="submit" class="btn or" id="decretBouton">Proclamer</button>
  </form>
  <div id="toasts"></div>
</section>

<!-- bataille en temps réel (façon Age of Mythology) -->
<section id="bataille" class="ecran">
  <canvas id="bat3d"></canvas>
  <canvas id="batEt"></canvas>
  <div id="batCadre" class="rts-cadre cache"></div>
  <div id="batHud" class="rts-hud"></div>
  <div id="batToasts" class="rts-toasts"></div>
</section>

<div id="bandeauMaj" class="bandeau-maj cache"></div>
<div id="modal" class="modal cache"><div class="modal-boite" id="modalBoite"></div></div>
<input type="file" id="fichierImport" accept=".json,application/json" hidden>

<script src="donnees.js"></script>
<script src="epoques.js"></script>
<script src="carte.js"></script>
<script src="moteur.js"></script>
<script src="rts-donnees.js"></script>
<script src="rts-moteur.js"></script>
<script src="alliances.js"></script>
<script src="ia-nations.js"></script>
<script src="oracle.js"></script>
<script src="vendor/three-pax.min.js"></script>
<script src="ressources3d.js"></script>
<script src="packs-graphiques.js"></script>
<script src="rendu.js"></script>
<script src="vue3d.js"></script>
<script src="rts-vue.js"></script>
<script src="son.js"></script>
<script src="interface.js"></script>
<script src="rts-interface.js"></script>
</body>
</html>
