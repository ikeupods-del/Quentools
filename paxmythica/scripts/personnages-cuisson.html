async function cuire(nom) {
  const T = TYPES[nom], scenes = [], mixers = [];

  const atlas = document.getElementById('atlas'), ctx = atlas.getContext('2d'); ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, 2048, 2048);

  let monture = null;

    const g = await charger(p.fichier);
    if (p.monture) { const b0 = new THREE.Box3().setFromObject(g.scene); g.scene.scale.setScalar(p.hauteur / (b0.max.y - b0.min.y)); g.scene.userData.monture = true; monture = { scene: g.scene, anims: g.animations }; }

      const reposP = os[nomMx('Hips')].getWorldPosition(new THREE.Vector3());
      g.scene.userData.mixamo = { os, repos, ordre, reposP, ratio: reposP.y / SRC.reposP.y };
    }
    // masque de la couleur du joueur (blanc = à teinter), lu à la coordonnée de texture de chaque sommet
    let masque = null;
    if (p.masque) { const img = await createImageBitmap(await (await fetch(SRC_DIR + p.masque)).blob()), c = new OffscreenCanvas(256, 256), x = c.getContext('2d'); x.drawImage(img, 0, 0, 256, 256); masque = x.getImageData(0, 0, 256, 256).data; }
    g.scene.traverse(o => {
      if (!o.isSkinnedMesh) return;
      if (p.garder && !p.garder.test(o.name)) return;
      const G = o.geometry, P = G.attributes.position, N = G.attributes.normal, UV = G.attributes.uv, SI = G.attributes.skinIndex, SW = G.attributes.skinWeight;
      const os = o.skeleton.bones, map = o.material.map;
      // triangles retenus : tête seule du corps de base (ou tête et jambes nues), le reste vient de la tenue
      const dominant = i => { let b = 0, w = -1; for (let k = 0; k < 4; k++) if (SW.getComponent(i, k) > w) { w = SW.getComponent(i, k); b = SI.getComponent(i, k); } return os[b].name; };
      const TETE_OS = /^(Head|neck_01)$/, JAMBES = /^(thigh|calf|foot|ball)/;
      let tri = G.index ? Array.from(G.index.array) : [...Array(P.count).keys()];
      if (p.tete || p.jambesNues) { const garde = p.tete ? TETE_OS : JAMBES, t2 = []; for (let i = 0; i < tri.length; i += 3) if ([0, 1, 2].every(k => garde.test(dominant(tri[i + k])))) t2.push(tri[i], tri[i + 1], tri[i + 2]); tri = t2; }
      if (!tri.length) return;

      const cle = map ? (map.name || map.uuid) : '', uni = !map || /Eye/i.test(cle) ? palette(/Eye/i.test(cle) ? 0x1e1a16 : o.material.color.getHex()) : null, coin = uni ? null : caseDe(cle, map.image);
      const base = vu.pos.length / 3, teinte = p.teinte && p.teinte.test(o.name) ? 1 : 0;

        const n = N ? new THREE.Vector3().fromBufferAttribute(N, i).transformDirection(o.matrixWorld) : new THREE.Vector3(0, 1, 0); vu.nor.push(n.x, n.y, n.z);

        let t = teinte; if (masque && UV) { const mx = Math.min(255, Math.max(0, Math.floor(fr(u) * 256))), my = Math.min(255, Math.max(0, Math.floor(fr(w) * 256))); t = masque[(my * 256 + mx) * 4] > 127 ? 1 : 0; }
        vu.teinte.push(t); vu.lum.push(0); vu.ref.push([o, i]);

  const os0 = {}; for (const sc of scenes) sc.traverse(o => { if (o.isBone && (!os0[o.name] || !sc.userData.monture)) os0[o.name] = o; });
  const osMonture = {}; if (monture) monture.scene.traverse(o => { if (o.isBone) osMonture[o.name] = o; });
