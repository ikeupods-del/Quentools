<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuentMovie</title>
<style>
:root{--bg:#141518;--pan:#1c1e23;--pan2:#262930;--pan3:#30343d;--ligne:#363a44;--txt:#eceef2;--mut:#98a1b0;--ac:#4f8cff;--ok:#35c27a;--ko:#ef5b5b;--clip:#3a5f9e;--audio:#2f7d5b;--podcast:#7a4fb0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;display:grid;grid-template-rows:46px minmax(0,1fr) 280px 24px;grid-template-columns:320px minmax(0,1fr) 330px;grid-template-areas:"top top top" "nav view insp" "tl tl tl" "bar bar bar";overflow:hidden;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--pan2);border:1px solid var(--ligne);border-radius:7px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.mini{padding:1px 7px;font-size:12px}
button:disabled{opacity:.35;cursor:default;border-color:var(--ligne)}
select,input[type=text],input[type=number],textarea{background:var(--bg);border:1px solid var(--ligne);border-radius:6px;padding:4px 7px;width:100%}
header{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--pan);border-bottom:1px solid var(--ligne)}
header h1{font-size:14px;margin:0 8px 0 0}
header .sp{flex:1}
header select{width:auto}
.mut{color:var(--mut);font-size:12px}
.err{color:var(--ko)}
#bar{grid-area:bar;background:var(--pan);border-top:1px solid var(--ligne);padding:3px 12px;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{background:var(--pan3);border:1px solid var(--ligne);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:11px ui-monospace,Menlo,monospace;color:var(--txt)}
/* navigateur */
#nav{grid-area:nav;background:var(--pan);border-right:1px solid var(--ligne);display:flex;flex-direction:column;min-height:0}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--ligne)}
#tabs button{border:0;border-radius:0;background:none;padding:7px 2px;font-size:11.5px;color:var(--mut);border-bottom:2px solid transparent}
#tabs button.on{color:var(--txt);border-bottom-color:var(--ac);background:#ffffff08}
#navbody{flex:1;overflow:auto;padding:10px;min-height:0}
.media{display:flex;gap:8px;align-items:center;background:var(--pan2);border-radius:8px;padding:5px;margin-bottom:6px;cursor:grab}
.media img,.media .ico{width:46px;height:46px;object-fit:cover;border-radius:5px;background:#000;flex:none;display:grid;place-items:center;font-size:20px}
.media .nom{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media .nom small{display:block;color:var(--mut)}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grille.g3{grid-template-columns:repeat(3,1fr)}
.carte{background:var(--pan2);border:1px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;text-align:center;font-size:11.5px;position:relative}
.carte:hover{border-color:var(--ac)}
.carte img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#000}
.carte img.st{object-fit:contain;padding:6px;background:repeating-conic-gradient(#2a2d35 0 25%,#22252c 0 50%) 0 0/16px 16px}
.carte span{display:block;padding:5px 4px;line-height:1.2}
.carte.off{opacity:.3;pointer-events:none}
.carte.txt{padding:10px 6px}
.carte .sw{display:block;height:44px}
.son{display:flex;align-items:center;gap:6px;background:var(--pan2);border-radius:7px;padding:4px 6px;margin-bottom:4px}
.son .nom{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:14px 0 6px}
h3:first-child{margin-top:0}
.encart{background:var(--pan2);border-radius:8px;padding:10px;margin-bottom:10px}
.encart h4{margin:0 0 6px;font-size:13px}
/* visionneuse */
#view{grid-area:view;display:flex;flex-direction:column;align-items:center;padding:8px 10px;gap:6px;min-width:0;min-height:0;overflow:hidden}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#stage img,#stage video{max-width:100%;max-height:100%;border-radius:6px;background:#000;box-shadow:0 4px 28px #000a}
#stage .vide{color:var(--mut);text-align:center;max-width:420px}
#stage .vide .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
#stage .vide button{padding:8px 14px}
.transport{display:flex;gap:6px;align-items:center;width:100%;max-width:760px}
.transport input[type=range]{flex:1}
#tc{font:600 15px ui-monospace,Menlo,monospace;min-width:104px;text-align:center;background:var(--bg);border:1px solid var(--ligne);border-radius:6px;padding:2px 6px}
/* inspecteur */
#insp{grid-area:insp;background:var(--pan);border-left:1px solid var(--ligne);overflow:auto;padding:8px 10px}
details{border-bottom:1px solid var(--ligne);padding:6px 0}
summary{cursor:pointer;font-weight:600;padding:3px 0;list-style:none}
summary::before{content:"▸ ";color:var(--mut)}
details[open]>summary::before{content:"▾ "}
label.l{display:block;font-size:12px;color:var(--mut);margin:7px 0 2px}
label.l span{float:right;color:var(--txt)}
input[type=range]{width:100%;accent-color:var(--ac);margin:0}
.sw2{display:flex;align-items:center;gap:8px;margin:6px 0}
.sw2 input{width:auto}
.ligne{display:flex;gap:6px;align-items:center}
.ligne>*{flex:1}
.fxrow{background:var(--pan2);border-radius:8px;padding:6px 8px;margin:6px 0}
.fxrow .tete{display:flex;align-items:center;gap:4px;font-weight:600;font-size:12px}
.fxrow .tete b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=color]{height:30px;padding:1px;border:1px solid var(--ligne);border-radius:6px;background:none;width:100%}
.bloc{border:1px solid var(--ligne);border-radius:8px;padding:8px;margin-top:6px;background:#0002}
.subrow{display:grid;grid-template-columns:52px 52px 1fr 24px;gap:4px;margin:3px 0}
.subrow input{padding:2px 4px;font-size:12px}
/* timeline */
#tl{grid-area:tl;background:var(--pan);border-top:1px solid var(--ligne);display:flex;flex-direction:column;min-height:0}
#tlbar{display:flex;gap:5px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--ligne);flex-wrap:wrap}
#tlbar .sp{flex:1}
#scroll{flex:1;overflow:auto;position:relative;min-height:0}
#lane{position:relative;min-height:100%}
#regle{height:22px;position:sticky;top:0;background:var(--pan2);border-bottom:1px solid var(--ligne);cursor:pointer;z-index:6}
#regle i{position:absolute;top:0;bottom:0;border-left:1px solid var(--ligne);padding-left:3px;font-size:10px;color:var(--mut);font-style:normal;pointer-events:none}
#regle b{position:absolute;top:10px;width:0;height:0;border:5px solid transparent;border-top-color:#ffb400;transform:translateX(-5px);cursor:pointer}
.piste{position:relative;height:80px;margin:6px 0;border-radius:6px;background:#0003}
.piste.a{height:60px;min-height:60px}
.etiq{position:absolute;left:4px;top:-1px;font-size:10px;color:var(--mut);z-index:2;pointer-events:none}
.clip{position:absolute;top:0;bottom:0;border-radius:6px;border:2px solid #0006;background:var(--clip) left/auto 100% repeat-x;overflow:hidden;cursor:grab;box-shadow:inset 0 0 0 100px #0a122355;touch-action:none}
.clip.k-audio{background:var(--podcast) center/100% 100% no-repeat}
.clip.k-solid{background-color:#444}
.clip.sel{border-color:#fff;box-shadow:inset 0 0 0 100px #0a122322}
.clip.drag{opacity:.75;z-index:8}
.clip b{position:absolute;left:8px;top:3px;right:8px;font-size:11px;text-shadow:0 1px 3px #000;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none}
.clip small{position:absolute;left:8px;bottom:3px;font-size:10px;text-shadow:0 1px 3px #000;pointer-events:none}
.clip .tags{position:absolute;right:8px;bottom:2px;font-size:11px;text-shadow:0 1px 3px #000;pointer-events:none}
.clip .hl,.clip .hr{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;background:#ffffff22;z-index:3}
.clip .hl{left:0}.clip .hr{right:0}
.clip .hl:hover,.clip .hr:hover{background:#ffffff66}
.clip.drop{outline:2px dashed var(--ac)}
.cut{position:absolute;top:50%;transform:translate(-50%,-50%);z-index:4;width:20px;height:20px;border-radius:50%;background:var(--pan3);border:1px solid var(--mut);font-size:11px;display:grid;place-items:center;cursor:pointer;padding:0}
.cut.on{background:var(--ac);border-color:#fff}
.cut.sel{box-shadow:0 0 0 2px #fff}
.aud{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--audio) center/100% 100% no-repeat;border:2px solid #0006;cursor:grab;overflow:hidden;font-size:11px;padding:3px 6px;white-space:nowrap;box-shadow:inset 0 0 0 100px #0a122340;touch-action:none}
.aud.sel{border-color:#fff}
#tete{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #ff4d4d;z-index:7;pointer-events:none}
#tete::before{content:"";position:absolute;top:0;left:-7px;border:6px solid transparent;border-top:9px solid #ff4d4d}
/* fenêtres */
#modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20}
#majBox{position:fixed;right:16px;bottom:16px;z-index:25;width:340px;max-width:calc(100vw - 32px);background:var(--pan);border:1px solid var(--ac);border-radius:12px;padding:12px 14px;box-shadow:0 12px 40px #000a;display:none}
#majBox.on{display:block}#majBox h4{margin:0 0 6px;font-size:14px}#majBox .notes{max-height:120px;overflow:auto;font-size:12px;white-space:pre-wrap;margin:6px 0}
#majBox progress{width:100%}
/* Studio : caméra, micro et prompteur */
#studio{position:fixed;inset:0;background:#050506;z-index:30;display:none;color:#fff}
#studio.on{display:grid;grid-template-columns:1fr 320px}
#stScene{position:relative;overflow:hidden;display:grid;place-items:center}
#stScene>video,#stCanvas{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;background:#000}
#stScene .miroir{transform:scaleX(-1)}
#stCanvas{position:absolute;inset:0;display:none}#stScene.fond #stCanvas{display:block}#stScene.fond video{visibility:hidden}
#stPrompt{position:absolute;left:50%;top:0;transform:translateX(-50%);width:var(--pw,70%);height:42%;overflow:hidden;background:rgba(0,0,0,var(--po,.55));border-radius:0 0 14px 14px;cursor:pointer;
  -webkit-mask-image:linear-gradient(#0000,#000 14%,#000 80%,#0000)}
#stPrompt.miroirtxt #stTexte{transform-origin:center;scale:-1 1}
#stTexte{padding:40% 6% 120%;font:700 var(--ps,44px)/1.35 -apple-system,system-ui,sans-serif;text-align:center;white-space:pre-wrap;will-change:transform}
#stLigne{position:absolute;left:0;right:0;top:34%;border-top:2px solid #ffd40088;pointer-events:none}
#stCompte{position:absolute;inset:0;display:none;place-items:center;font:800 180px/1 system-ui;text-shadow:0 4px 30px #000}
#stCompte.on{display:grid}
#stBarre{z-index:3;position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;justify-content:center;padding:12px;background:linear-gradient(#0000,#000c)}
#stBarre button{min-width:44px}
#stRec{background:#e0102a!important;color:#fff!important;font-weight:700}
#stRec.enreg{animation:clign 1s infinite}
@keyframes clign{50%{opacity:.6}}
#stTemps{font:600 15px ui-monospace,Menlo,monospace;min-width:70px;text-align:center}
#stVu{width:90px;height:8px;background:#222;border-radius:4px;overflow:hidden}#stVu i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3c3,#fd0 70%,#f33)}
#stPanneau{background:var(--pan);padding:14px;overflow:auto;border-left:1px solid #0006}
#stPanneau textarea{width:100%;min-height:160px;font-size:13px}
#stPanneau details{border-top:1px solid #ffffff14;padding:6px 0}#stPanneau summary{cursor:pointer;font-weight:600;padding:4px 0}
#stAnims{grid-template-columns:1fr 1fr;gap:6px}#stAnims .carte{padding:7px 6px;font-size:12px;text-align:left}#stAnims kbd{margin-right:4px}
#stAnim{position:absolute;pointer-events:none;overflow:hidden;z-index:1}#stAnim canvas{max-width:none;max-height:none}
.stBandeau{position:absolute;left:5%;bottom:12%;background:#5b3df5;color:#fff;padding:10px 18px;border-left:6px solid #d7f24a;animation:bandeau .5s ease-out both;font:600 2.2vw/1.25 system-ui}
.stBandeau b{display:block;font-size:1.15em}.stBandeau span{display:block;font-weight:400;font-size:.8em;opacity:.9}
@keyframes bandeau{from{transform:translateX(-120%)}to{transform:none}}
/* Lumière LED : bandeau lumineux autour de l'écran pour éclairer le visage */
#stLumiere{position:absolute;inset:0;pointer-events:none;display:none;z-index:2;border:var(--lw,70px) solid var(--lc,#fff);box-shadow:inset 0 0 calc(var(--lw,70px) * 1.2) var(--lc,#fff);border-radius:6px}
#stLumiere.on{display:block}
#modal.on{display:grid}
#boite{background:var(--pan);border:1px solid var(--ligne);border-radius:12px;padding:16px;width:min(94vw,560px);max-height:92vh;overflow:auto;-webkit-user-select:text;user-select:text}
#boite.large{width:min(94vw,760px)}
#boite h2{margin:0 0 10px;font-size:16px}
#barreExp{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:12px 0}
#barreExp i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
canvas{max-width:100%;max-height:60vh;cursor:crosshair;border-radius:8px;display:block}
.liste button{display:block;width:100%;text-align:left;margin:4px 0}
.raccourcis{display:grid;grid-template-columns:1fr 1fr;gap:2px 22px}
.raccourcis div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid #ffffff10}
.raccourcis h3{grid-column:1/-1}
.rec{color:#ff4d4d;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>🎬 QuentMovie</h1>
  <button id="bNouveau" title="Nouveau projet (⌘N)">Nouveau</button><button id="bOuvrir" title="Ouvrir un projet (⌘O)">Ouvrir…</button><button id="bSauver" title="Enregistrer le projet (⌘S)">Enregistrer…</button>
  <button id="bUndo" title="Annuler (⌘Z)">↶</button><button id="bRedo" title="Rétablir (⇧⌘Z)">↷</button>
  <button id="bImporter" title="Importer des médias (⌘I)">＋ Importer</button>
  <span class="sp"></span>
  <span class="mut" id="etat"></span>
  <select id="format" title="Format de l’image"><option value="vertical">Vertical 9:16</option><option value="horizontal">Horizontal 16:9</option><option value="carre">Carré 1:1</option></select>
  <button id="bAide" title="Raccourcis clavier (?)">⌨ Raccourcis</button>
  <button id="bStudio" title="Me filmer avec la caméra, le micro et le prompteur (⇧⌘R)">🎥 Me filmer</button>
  <button id="bApercu" title="Aperçu avec effets (⌘R)">🎞 Aperçu avec effets</button>
  <button class="pri" id="bExport" title="Exporter (⌘E)">Exporter…</button>
</header>

<aside id="nav">
  <div id="tabs">
    <button data-tab="medias" title="1">Médias</button><button data-tab="effets" title="2">Effets</button><button data-tab="transitions" title="3">Transitions</button>
    <button data-tab="titres" title="4">Titres</button><button data-tab="voix" title="5">Voix</button><button data-tab="sons" title="6">Sons</button>
    <button data-tab="musiques" title="7">Musique</button><button data-tab="stickers" title="8">Calques</button><button data-tab="outils" title="9">Outils</button>
  </div>
  <div id="navbody"></div>
  <input type="file" id="fichiers" multiple hidden>
</aside>

<main id="view">
  <div id="stage"></div>
  <div class="transport">
    <button id="bDebut" title="Début (Début)">⏮</button><button id="bRecul" title="Reculer d’1 s (J)">⏪</button>
    <button id="bPlay" class="pri" title="Lire / pause (Espace)" style="min-width:74px">▶ Lire</button>
    <button id="bAvance" title="Avancer d’1 s (L)">⏩</button><button id="bFin" title="Fin (Fin)">⏭</button>
    <input type="range" id="scrub" min="0" max="1" step="0.01" value="0">
    <span id="tc">00:00:00:00</span>
  </div>
</main>

<aside id="insp"></aside>

<section id="tl">
  <div id="tlbar">
    <button id="bCouper" title="Couper à la tête de lecture (S ou ⌘B)">✂ Couper</button>
    <button id="bGauche" title="Déplacer à gauche (⌘[)">◀</button><button id="bDroite" title="Déplacer à droite (⌘])">▶</button>
    <button id="bDup" title="Dupliquer (⌘D)">⧉ Dupliquer</button>
    <button id="bSuppr" title="Supprimer (Suppr)">🗑 Supprimer</button>
    <button id="bMarq" title="Ajouter un repère (M)">⚑ Repère</button>
    <span class="sp"></span>
    <span class="mut" id="duree"></span>
    <button class="mini" id="zMoins" title="Zoom arrière (-)">−</button><input type="range" id="zoom" min="6" max="200" value="40" style="width:110px"><button class="mini" id="zPlus" title="Zoom avant (+)">＋</button><button class="mini" id="zFit" title="Tout afficher (⇧Z)">Ajuster</button>
  </div>
  <div id="scroll"><div id="lane">
    <div id="regle"></div>
    <div class="piste" id="pV"><span class="etiq">VIDÉO</span></div>
    <div class="piste a" id="pA"><span class="etiq">AUDIO (musique, voix, bruitages)</span></div>
    <div id="tete"></div>
  </div></div>
</section>
<div id="bar"></div>
<div id="modal"><div id="boite"></div></div>
<div id="majBox" role="status" aria-live="polite"></div>
<div id="studio" aria-label="Studio : caméra et prompteur">
  <div id="stScene"><video id="stVideo" autoplay muted playsinline class="miroir"></video><canvas id="stCanvas"></canvas>
    <div id="stPrompt" title="Clic : lancer / arrêter le défilement · molette : avancer ou reculer"><div id="stTexte"></div><div id="stLigne"></div></div>
    <div id="stAnim"></div>
    <div id="stLumiere" aria-hidden="true"></div>
    <div id="stCompte"></div>
    <div id="stBarre"><button id="stDebut" title="Revenir au début du texte (Début)">⏮</button><button id="stDefil" title="Lancer / arrêter le défilement (Espace)">▶ Défiler</button>
      <button id="stRec" title="Enregistrer / arrêter (R)">● Enregistrer</button><span id="stTemps">00:00</span><span id="stVu" title="Niveau du micro"><i></i></span>
      <button id="stFermer" title="Fermer le studio (Échap)">✕ Fermer</button></div></div>
  <div id="stPanneau"></div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enc = encodeURIComponent;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = s => (Math.round(s * 10) / 10).toString().replace('.', ',') + ' s';
const MAC = /Mac/.test(navigator.platform);
const api = async (url, opt) => {
  const r = await fetch(url, opt);
  if (!r.ok) { let m = 'Erreur'; try { m = (await r.json()).error; } catch (e) {} throw new Error(m); }
  return r;
};
function tc(t, fps) { t = Math.max(0, t); const f = Math.floor((t % 1) * fps), s = Math.floor(t) % 60, m = Math.floor(t / 60) % 60, h = Math.floor(t / 3600); return [h, m, s, f].map(x => String(x).padStart(2, '0')).join(':'); }

let CAT = { video: [], audio: [], transitions: [], titres: [], reportage: [], generateurs: [], polices: [], sorties: ['mp4'], bibliotheque: { sons: [], musiques: [], stickers: [], marque: [], luts: [], calques: [], cadres: [], fonds: [], fondvert: [] } };
let PACKS = { luts: [], sons: [], images: [], videos: [], dossier: '' };
let medias = [];
let proj = { format: 'vertical', fps: 30, res: 1080, quality: 'haute', sortie: 'mp4', normaliser: false, clips: [], audio: [], markers: [] };
let sel = -1, selA = -1, selCut = -1, gt = 0, zoom = 40, tab = 'medias', rendu = null, presse = null;
const LIB = () => CAT.bibliotheque;
// Bibliothèque intégrée (« lib:… ») et packs de l'utilisateur (« pack:… »)
const LIB_KIND = { sons: 'audio', musiques: 'audio', stickers: 'image', luts: 'lut', calques: 'video', cadres: 'image', fonds: 'image', fondvert: 'video' };
const libItem = f => {
  if (!/^lib:/.test(f || '')) return null;
  for (const l of Object.values(LIB())) { const x = (l || []).find(y => 'lib:' + y.file === f || 'lib:' + y.file.replace(/-h\.(png|jpg)$/, '-v.$1') === f); if (x) return x; }
  return null;
};

// Couleur du fond vert devinée dans les coins de l'image (le mur derrière la personne)
function couleurDuFond(c) {
  return new Promise(ok => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height; const g = cv.getContext('2d'); g.drawImage(img, 0, 0);
      const w = Math.max(4, Math.round(img.width * 0.08)), h = Math.max(4, Math.round(img.height * 0.08)); let R = 0, G = 0, B = 0, n = 0;
      for (const [x, y] of [[0, 0], [img.width - w, 0], [0, img.height - h], [img.width - w, img.height - h]]) {
        const d = g.getImageData(x, y, w, h).data; for (let i = 0; i < d.length; i += 4) { R += d[i]; G += d[i + 1]; B += d[i + 2]; n++; }
      }
      R /= n; G /= n; B /= n; const hx = v => Math.round(v).toString(16).padStart(2, '0');
      ok((G > R * 1.25 && G > B * 1.25) || (B > R * 1.25 && B > G * 1.1) ? '#' + hx(R) + hx(G) + hx(B) : null); // seulement un fond vert ou bleu
    };
    img.onerror = () => ok(null);
    img.src = c.kind === 'image' ? '/media/' + enc(c.file) : '/api/frame?file=' + enc(c.file) + '&t=' + (c.in + 0.5).toFixed(1);
  });
}

$('#insp').addEventListener('change', e => { if (e.target.id === 'fSrt') importerSrt(e.target.files[0]); });
async function importerSrt(f) {
  const c = curClip(); if (!f || !c) return;
  const txt = await f.text(), sec = h => { const m = /(\d+):(\d+):(\d+)[,.](\d+)/.exec(h); return +m[1] * 3600 + +m[2] * 60 + +m[3] + +m[4] / 1000; };
  const subs = []; for (const bloc of txt.replace(/\r/g, '').split(/\n\n+/)) {
    const l = bloc.split('\n').filter(Boolean), i = l.findIndex(x => x.includes('-->')); if (i < 0) continue;
    const [a, b] = l[i].split('-->'); subs.push({ s: +sec(a).toFixed(2), e: +sec(b).toFixed(2), t: l.slice(i + 1).join(' ').replace(/<[^>]+>/g, '') });
  }
  c.subs = subs.slice(0, 300); commit(); inspecteur(); apercu(); aide(`${subs.length} sous-titres importés.`);
}

// ---------- Pipette (fond vert) ----------
function pipette() {
  const c = curClip(); if (!c) return; const t = c.kind === 'image' ? 0 : c.in + pos * c.speed;
  ouvrir(`<h2>Clique sur la couleur à enlever</h2><canvas id="cv"></canvas><div class="ligne" style="margin-top:8px"><span class="mut" id="pip">Clique sur le fond (par exemple le mur vert).</span><button class="pri" id="pipOk" style="flex:none">Fermer</button></div>`);
  const img = new Image(); img.onload = () => { const cv = $('#cv'); cv.width = img.width; cv.height = img.height; cv.getContext('2d').drawImage(img, 0, 0); };
  img.src = c.kind === 'image' ? '/media/' + enc(c.file) : '/api/frame?file=' + enc(c.file) + '&t=' + t;
  $('#cv').onclick = e => {
    const cv = $('#cv'), r = cv.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) * cv.width / r.width), y = Math.floor((e.clientY - r.top) * cv.height / r.height);
    const dd = cv.getContext('2d').getImageData(Math.max(0, x - 2), Math.max(0, y - 2), 5, 5).data; let R = 0, G = 0, B = 0; for (let i = 0; i < dd.length; i += 4) { R += dd[i]; G += dd[i + 1]; B += dd[i + 2]; }
    const n = dd.length / 4, h = v => Math.round(v / n).toString(16).padStart(2, '0'); c.key.color = '#' + h(R) + h(G) + h(B); commit();
    $('#pip').innerHTML = `Couleur choisie : <b style="color:${c.key.color}">${c.key.color}</b>`; inspecteur(); apercuRetarde();
  };
  $('#pipOk').onclick = fermer;
}

async function outil(nom) {
  if (nom === 'aide') return afficherAide();

      const marge = +$('#oMar').value; let start = c.in; const segs = [];
      for (const s of silences) { const end = Math.min(c.out, s.s + marge); if (end - start >= 0.2) segs.push([start, end]); start = Math.max(start, s.e - marge); }
      if (c.out - start >= 0.2) segs.push([start, c.out]);
      if (!silences.length || !segs.length) { $('#oSilRes').textContent = 'Aucun silence trouvé avec ces réglages.'; return; }
      const gagne = (c.out - c.in) - segs.reduce((a, [x, y]) => a + (y - x), 0);
      const nouveaux = segs.map(([x, y]) => { const n = clone(c); n.in = +x.toFixed(2); n.out = +y.toFixed(2); n.transition = null; n.titre = null; return n; });
      if (c.titre) nouveaux[0].titre = c.titre;
      proj.clips.splice(sel, 1, ...nouveaux); commit(); tout(); apercu();

      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } }); const rec = new MediaRecorder(stream), morceaux = [], t0 = Date.now();
      micro = { rec, timer: setInterval(() => { r.innerHTML = `<span class="rec">● Enregistrement ${Math.round((Date.now() - t0) / 1000)} s</span>`; }, 500) };
      rec.ondataavailable = ev => morceaux.push(ev.data);
      rec.onstop = async () => {
        clearInterval(micro.timer); stream.getTracks().forEach(x => x.stop()); micro = null; b.textContent = '● Démarrer l’enregistrement'; r.textContent = 'Envoi de l’enregistrement…';
        const nom = 'voix-off-' + new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14) + '.webm';

          const m = medias.find(x => x.file.startsWith(nom.replace('.webm', ''))); if (m) ajouterSon(m.file, { vol: 100 }); r.textContent = '✅ Voix off ajoutée à la piste audio.'; navigateur(); }

  } else if (nom === 'podcast') {

async function stEnregistrer() {
  if (!studio) return;
  if (studio.rec) { studio.rec.stop(); return; }
  if (studio.envoi) return;
  if (studio.o.compte && !(await stCompte())) return;
  const fond = !!studio.o.fond && !!studio.comp;
  const mp4 = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a', 'video/mp4'], webm = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  // image composée (fond virtuel) : WebM VP8, le format le plus éprouvé pour une image dessinée ; caméra seule : MP4 H.264 (puce du Mac)
  const types = fond ? ['video/webm;codecs=vp8,opus', 'video/webm;codecs=h264,opus', ...webm, ...mp4] : [...mp4, ...webm];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  if (fond) { stImage(performance.now()); studio.piste = $('#stCanvas').captureStream(30).getVideoTracks()[0]; } // l'image a déjà sa taille définitive
  const source = fond ? new MediaStream([studio.piste, ...studio.flux.getAudioTracks()]) : studio.flux;
  const rec = new MediaRecorder(source, { mimeType: mime, videoBitsPerSecond: studio.o.qualite === '1080' ? 10e6 : 5e6, audioBitsPerSecond: 192000 });
  const morceaux = []; rec.ondataavailable = e => { if (e.data.size) morceaux.push(e.data); };
  rec.onerror = e => stMsg(`<span class="err">Erreur d’enregistrement : ${esc((e.error && e.error.message) || 'inconnue')}</span>`);
  rec.onstop = () => stEnvoyer(morceaux, mime);
  studio.rec = rec; studio.evts = []; studio.t0 = Date.now(); rec.start(1000);
  $('#stRec').textContent = '■ Arrêter'; $('#stRec').classList.add('enreg');
  if (studio.o.defilAuto && (proj.prompteur || '').trim()) { studio.pos = 0; stPlacer(); stDefiler(true); }
}
async function stEnvoyer(morceaux, mime) {
  const st = studio; st.rec = null; if (st.piste) { st.piste.stop(); st.piste = null; } st.envoi = true; stDefiler(false);
  const evts = st.evts.slice(); st.evts = [];
  $('#stRec').textContent = '● Enregistrer'; $('#stRec').classList.remove('enreg');
  const blob = new Blob(morceaux, { type: mime || 'video/webm' });
  stMsg('Préparation de la prise…');
  const ext = /mp4/.test(mime) ? 'mp4' : 'webm', nom = 'camera-' + new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14) + '.' + ext;
  try {
    if (blob.size < 2000) throw new Error('rien n’a été enregistré par la caméra. Ferme le studio, rouvre-le et réessaie.');
    const j = await (await api('/api/import?name=' + enc(nom), { method: 'POST', body: blob })).json();
    await chargerMedias();
    const m = medias.find(x => x.file === j.file);
    if (m) { const c = newClip(m); stAppliquerAnimations(c, evts); proj.clips.push(c); sel = proj.clips.length - 1; selA = -1; commit(); tout(); placerTete(starts()[sel]); }
    stMsg(`✅ Prise ajoutée à la fin de la timeline (${fmt(m ? m.duration : 0)})${evts.length ? `, avec ${evts.length} animation${evts.length > 1 ? 's' : ''}` : ''}.`);
  } catch (e) { stMsg(`<span class="err">La prise n’a pas pu être enregistrée : ${esc(e.message)}</span>`); }
  st.envoi = false;
  if (st.fermerApres) { studio = st; studio.rec = null; fermerStudio(); }
}
$('#bStudio').onclick = ouvrirStudio;
$('#stFermer').onclick = fermerStudio; $('#stRec').onclick = stEnregistrer; $('#stDefil').onclick = () => stDefiler();
$('#stDebut').onclick = () => { studio.pos = 0; stPlacer(); };
$('#stPrompt').onclick = () => stDefiler();
$('#stPrompt').addEventListener('wheel', e => { e.preventDefault(); studio.pos += e.deltaY; stPlacer(); }, { passive: false });
$('#stPanneau').addEventListener('click', e => {
  const b = e.target.closest('[data-anim]'); if (b) return stAnimer(b.dataset.anim);
  if (e.target.id === 'stCle') stCleAuto();
});
$('#stPanneau').addEventListener('input', e => {
  const o = studio.o, t = e.target, v = t.type === 'checkbox' ? t.checked : t.type === 'range' ? +t.value : t.value;
  if (t.id === 'stFond') { if (studio.rec) { t.value = o.fond; return alert('Arrête d’abord l’enregistrement pour changer de fond.'); } o.fond = v; stGarder(o); stPanneau(); stFond(); return; }
  if (t.id === 'stScript') { proj.prompteur = t.value; commit(true); stStyle(); return; }
  const champ = { stVert: 'vertMode', stDet: 'detourage', stSeul: 'seul', stSeuil: 'seuil', stContour: 'contour', stHalo: 'halo', stLum: 'lumiere', stChaleur: 'chaleur',
    stLed: 'led', stLedForce: 'ledForce', stLedLarg: 'ledLargeur', stLedTeinte: 'ledTeinte', stNom: 'nom', stRole: 'role',
    stVit: 'vitesse', stTaille: 'taille', stLarg: 'largeur', stOpa: 'opacite', stMirTxt: 'miroirTxt', stMirImg: 'miroirImg', stCpt: 'compte', stAuto: 'defilAuto', stQual: 'qualite', stBruit: 'bruit', stCam: 'camera', stMic: 'micro' }[t.id];
  if (!champ) return; o[champ] = v; stGarder(o);
  const lab = $('#' + t.id + 'V'); if (lab) lab.textContent = v + ({ stTaille: ' px', stLedLarg: ' px', stLarg: ' %', stOpa: ' %', stHalo: ' %', stLum: ' %', stLedForce: ' %' }[t.id] || '');
  if (['stCam', 'stMic', 'stQual', 'stBruit'].includes(t.id)) { if (studio.rec) return alert('Arrête d’abord l’enregistrement.'); stFlux().catch(er => alert('Appareil indisponible : ' + er.message)); }
  if (t.id === 'stVert') { stPanneau(); if (v) stCleAuto(); else stDetoureur().catch(er => stMsg(esc(er.message))); return; }
  if (t.id === 'stDet') { stDetoureur().catch(er => stMsg(esc(er.message))); }
  stStyle();
});
function toucheStudio(e) {
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'textarea' || (tag === 'input' && e.target.type === 'text') || tag === 'select') { if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key, kl = k.length === 1 ? k.toLowerCase() : k, f = fn => { e.preventDefault(); fn(); };
  if (k === 'Escape') return f(fermerStudio);
  if (kl === 'r') return f(stEnregistrer);
  if (kl === 'l') return f(() => { studio.o.led = !studio.o.led; stGarder(studio.o); const b = $('#stLed'); if (b) b.checked = studio.o.led; stStyle(); });
  if (kl === 'n') return f(() => stAnimer('nom'));
  const a = ANIM_DIRECT.find(x => x.t === k); if (a) return f(() => stAnimer(a.id));
  if (k === ' ') return f(() => stDefiler());
  if (k === 'Home') return f(() => { studio.pos = 0; stPlacer(); });
  if (k === 'ArrowUp' || k === 'ArrowDown') return f(() => { studio.o.vitesse = clamp(studio.o.vitesse + (k === 'ArrowUp' ? 5 : -5), 10, 150); stGarder(studio.o); const r = $('#stVit'); if (r) { r.value = studio.o.vitesse; $('#stVitV').textContent = studio.o.vitesse; } });
}

const RACCOURCIS = [
  ['Lecture', [['Espace', 'Lire / pause (avec les effets)'], ['⌥ Espace', 'Lire le clip sans effets'], ['J / L', 'Reculer / avancer d’1 seconde'], ['K', 'Pause'], ['← / →', 'Image précédente / suivante'], ['⇧ ← / →', '1 seconde'], ['↑ / ↓', 'Clip précédent / suivant'], ['Début / Fin', 'Début / fin de la timeline'], ['F', 'Plein écran de la visionneuse'], [M + ' R', 'Aperçu avec effets'], ['⇧' + M + ' R', 'Me filmer (caméra, micro, prompteur)']]],
  ['Montage', [['S ou ' + M + ' B', 'Couper à la tête de lecture'], ['I / O', 'Début / fin du clip à la tête de lecture'], ['Suppr', 'Supprimer le clip ou la piste'], [M + ' D', 'Dupliquer'], [M + ' [ / ]', 'Déplacer à gauche / droite'], [M + ' C / V', 'Copier / coller un clip'], ['⌥' + M + ' V', 'Coller seulement les effets'], ['M', 'Ajouter un repère'], ['[ / ]', 'Repère précédent / suivant']]],
  ['Fichier et affichage', [[M + ' N / O / S', 'Nouveau / ouvrir / enregistrer'], [M + ' I', 'Importer des médias'], [M + ' E', 'Exporter'], [M + ' Z / ⇧' + M + ' Z', 'Annuler / rétablir'], ['+ / −', 'Zoom de la timeline'], ['⇧ Z', 'Tout afficher'], [M + ' + molette', 'Zoom à la souris'], ['1 … 9', 'Onglets Médias, Effets, Transitions, Titres, Voix, Sons, Musique, Calques, Outils'], ['T', 'Titres'], ['?', 'Cette aide']]],
  ['À la souris', [['Glisser un clip', 'Changer son ordre'], ['Bords d’un clip', 'Raccourcir ou rallonger'], ['Clic sur la règle', 'Placer la tête de lecture'], ['Glisser un effet', 'Le poser sur un clip'], ['⇧ clic sur un repère', 'Le supprimer']]]
];
function afficherAide() {
  ouvrir(`<h2>⌨ Raccourcis clavier</h2><div class="raccourcis">${RACCOURCIS.map(([t, l]) => `<h3>${t}</h3>${l.map(([k, d]) => `<div><span>${esc(d)}</span><span><kbd>${esc(k)}</kbd></span></div>`).join('')}`).join('')}</div><button id="aOk" class="pri" style="margin-top:12px;width:100%">Fermer</button>`, true);
  $('#aOk').onclick = fermer;
}
document.addEventListener('keydown', e => {
  if (studio) return toucheStudio(e);
  const tag = (e.target.tagName || '').toLowerCase(), saisie = tag === 'input' && !['range', 'checkbox', 'color'].includes(e.target.type) || tag === 'textarea' || tag === 'select';
  const cmd = e.metaKey || e.ctrlKey, k = e.key, kl = k.length === 1 ? k.toLowerCase() : k;
  if (k === 'Escape') { if ($('#modal').classList.contains('on') && !$('#barreExp')) fermer(); return; }
  if (cmd && !saisie) {
    const faire = f => { e.preventDefault(); f(); };
    if (kl === 'z') return faire(() => undo(e.shiftKey ? 1 : -1));
    if (kl === 'b') return faire(couper); if (kl === 'd') return faire(dupliquer); if (kl === 'n') return faire(nouveau); if (kl === 'o') return faire(ouvrirProjet);
    if (kl === 's') return faire(sauver); if (kl === 'i') return faire(() => $('#fichiers').click()); if (kl === 'e') return faire(exporter);
    if (kl === 'r' && e.shiftKey) return faire(ouvrirStudio);
    if (kl === 'r') return faire(() => $('#bApercu').click()); if (kl === 'c') return faire(copier); if (kl === 'v') return faire(() => coller(e.altKey));
    if (k === '[') return faire(() => deplacer(-1)); if (k === ']') return faire(() => deplacer(1));
    return;
  }
  if (cmd && saisie && kl === 'z') return; // annulation du champ de texte
  if (saisie) return;
  const f = fn => { e.preventDefault(); fn(); };
  if (k === ' ') return f(() => (e.altKey ? lireOriginal() : lire()));
  if (kl === 's') return f(couper); if (kl === 'm') return f(marqueur); if (kl === 'i') return f(() => rogner(true)); if (kl === 'o') return f(() => rogner(false));
  if (kl === 'k') return f(stopLecture); if (kl === 'j') return f(() => saut(-1)); if (kl === 'l') return f(() => saut(1));
  if (kl === 'f') return f(() => { const s = $('#stage'); if (document.fullscreenElement) document.exitFullscreen(); else s.requestFullscreen && s.requestFullscreen(); });
  if (kl === 't') return f(() => allerOnglet('titres'));
  if (kl === 'z' && e.shiftKey) return f(fitZoom);
  if (k === 'Delete' || k === 'Backspace') { if (sel >= 0 || selA >= 0) f(supprimer); return; }
  if (k === 'ArrowLeft' || k === 'ArrowRight') return f(() => { stopLecture(); placerTete(gt + (k === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 1 : 1 / proj.fps)); });
  if (k === 'ArrowUp' || k === 'ArrowDown') return f(() => { const n = clamp((sel < 0 ? 0 : sel) + (k === 'ArrowUp' ? -1 : 1), 0, proj.clips.length - 1); if (proj.clips.length) { stopLecture(); choisir(n); } });
  if (k === 'Home') return f(() => placerTete(0)); if (k === 'End') return f(() => placerTete(total() - 0.05));
  if (k === '[') return f(() => repere(-1)); if (k === ']') return f(() => repere(1));
  if (k === '+' || k === '=') return f(() => setZoom(zoom * 1.3)); if (k === '-') return f(() => setZoom(zoom / 1.3));
  if (k === '?') return f(afficherAide);
  if (/^[1-9]$/.test(k)) return f(() => allerOnglet(TABS[+k - 1]));
});

function tout() { tlDessin(); inspecteur(); navigateur(); reglerScrub(); majBoutons(); }

(async function () {
  CAT = await (await api('/api/catalogue')).json();

  aide(`Astuce : appuie sur <kbd>?</kbd> pour voir tous les raccourcis clavier · <kbd>Espace</kbd> lit le montage avec ses effets · <kbd>S</kbd> coupe à la tête de lecture`);
})();
