<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuentMovie</title>
<style>
:root{--bg:#141518;--pan:#1c1e23;--pan2:#262930;--pan3:#30343d;--ligne:#363a44;--txt:#eceef2;--mut:#98a1b0;--ac:#4f8cff;--ok:#35c27a;--ko:#ef5b5b;--clip:#3a5f9e;--audio:#2f7d5b;--podcast:#7a4fb0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;display:grid;grid-template-rows:46px minmax(0,1fr) var(--hTl,280px) 24px;grid-template-columns:320px minmax(0,1fr) 330px;grid-template-areas:"top top top" "nav view insp" "tl tl tl" "bar bar bar";overflow:hidden;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--pan2);border:1px solid var(--ligne);border-radius:7px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.mini{padding:1px 7px;font-size:12px}
button:disabled{opacity:.35;cursor:default;border-color:var(--ligne)}
select,input[type=text],input[type=number],textarea{background:var(--bg);border:1px solid var(--ligne);border-radius:6px;padding:4px 7px;width:100%}
header{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--pan);border-bottom:1px solid var(--ligne)}
header h1{font-size:14px;margin:0 8px 0 0}
header .sp{flex:1}
header select{width:auto}
.mut{color:var(--mut);font-size:12px}
.err{color:var(--ko)}
#bar{grid-area:bar;background:var(--pan);border-top:1px solid var(--ligne);padding:3px 12px;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{background:var(--pan3);border:1px solid var(--ligne);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:11px ui-monospace,Menlo,monospace;color:var(--txt)}
/* navigateur */
#nav{grid-area:nav;background:var(--pan);border-right:1px solid var(--ligne);display:flex;flex-direction:column;min-height:0}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--ligne)}
#tabs button{border:0;border-radius:0;background:none;padding:7px 2px;font-size:11.5px;color:var(--mut);border-bottom:2px solid transparent}
#tabs button.on{color:var(--txt);border-bottom-color:var(--ac);background:#ffffff08}
#navbody{flex:1;overflow:auto;padding:10px;min-height:0}
.media{display:flex;gap:8px;align-items:center;background:var(--pan2);border-radius:8px;padding:5px;margin-bottom:6px;cursor:grab}
.media img,.media .ico{width:46px;height:46px;object-fit:cover;border-radius:5px;background:#000;flex:none;display:grid;place-items:center;font-size:20px}
.media .nom{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media .nom small{display:block;color:var(--mut)}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grille.g3{grid-template-columns:repeat(3,1fr)}
#signal{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(10px);background:#2a2a30;color:#fff;border:1px solid #ffffff22;border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:0 10px 30px #0008;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:70vw;text-align:center}#signal.vu{opacity:1;transform:translateX(-50%)}
[draggable=true]{cursor:grab}.son[draggable=true] .nom{cursor:grab}
.carte{background:var(--pan2);border:1px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;text-align:center;font-size:11.5px;position:relative}
.carte:hover{border-color:var(--ac)}
.carte img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#000}
.carte img.st{object-fit:contain;padding:6px;background:repeating-conic-gradient(#2a2d35 0 25%,#22252c 0 50%) 0 0/16px 16px}
.carte span{display:block;padding:5px 4px;line-height:1.2}
.carte.off{opacity:.3;pointer-events:none}
.carte.txt{padding:10px 6px}
.carte .sw{display:block;height:44px}
.son{display:flex;align-items:center;gap:6px;background:var(--pan2);border-radius:7px;padding:4px 6px;margin-bottom:4px}
.son .nom{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:14px 0 6px}
h3:first-child{margin-top:0}
.encart{background:var(--pan2);border-radius:8px;padding:10px;margin-bottom:10px}
.encart h4{margin:0 0 6px;font-size:13px}
.fiModes{gap:6px;flex-wrap:wrap}.fiEtape{display:flex;align-items:center;gap:8px;margin:12px 0 6px}.fiEtape span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;font-size:12px}.phGrille{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:6px}.phChoix{position:relative;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;background:#0003;aspect-ratio:16/9;display:grid;place-items:center;font-size:12px;color:var(--mut,#aaa)}.phChoix img{width:100%;height:100%;object-fit:cover;display:block}.phChoix.on{border-color:var(--ac)}.phChoix.on::after{content:'✓';position:absolute;top:4px;right:6px;background:var(--ac);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:12px}.phEcran{border-top:1px solid var(--ligne);padding:8px 0}.fiMode{border:1px solid var(--ligne);border-radius:8px;padding:6px 10px;cursor:pointer}.fiMode:has(input:checked){border-color:var(--ac);background:#3f5ef01f}
/* visionneuse */
#view{grid-area:view;display:flex;flex-direction:column;align-items:center;padding:8px 10px;gap:6px;min-width:0;min-height:0;overflow:hidden}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.ldCalques{position:absolute;pointer-events:none;overflow:hidden}#stage .ldCalques img,#stage .ldCalques video,#stage .ldCalques canvas{position:absolute;max-width:none;max-height:none;border-radius:0;background:none;box-shadow:none}
.ldTitre{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 9%;pointer-events:none;font-family:Arial,Helvetica,sans-serif;color:#fff;text-shadow:0 2px 6px #0008}
.ldTitre:empty{display:none}.ldBloc{margin:.5em 0}.ldNum{font-weight:700;font-size:clamp(10px,1.6vw,18px);letter-spacing:.08em;margin-bottom:.6em}
.ldGros{font-weight:800;font-size:clamp(16px,3.6vw,44px);line-height:1.15}.ldPetit{font-size:clamp(11px,1.8vw,20px);margin-top:.4em;opacity:.85}
.ldTrait{height:4px;border-radius:2px;margin-top:.7em;transition:width .1s}.ldCurseur{opacity:.8}
#stage img,#stage video{max-width:100%;max-height:100%;border-radius:6px;background:#000;box-shadow:0 4px 28px #000a}
#stage .vide{color:var(--mut);text-align:center;max-width:420px}
#stage .vide .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
#stage .vide button{padding:8px 14px}
.transport{display:flex;gap:6px;align-items:center;width:100%;max-width:760px}
.transport input[type=range]{flex:1}
#tc{font:600 15px ui-monospace,Menlo,monospace;min-width:104px;text-align:center;background:var(--bg);border:1px solid var(--ligne);border-radius:6px;padding:2px 6px}
/* inspecteur */
#insp{grid-area:insp;background:var(--pan);border-left:1px solid var(--ligne);overflow:auto;padding:8px 10px}
details{border-bottom:1px solid var(--ligne);padding:6px 0}
summary{cursor:pointer;font-weight:600;padding:3px 0;list-style:none}
summary::before{content:"▸ ";color:var(--mut)}
details[open]>summary::before{content:"▾ "}
label.l{display:block;font-size:12px;color:var(--mut);margin:7px 0 2px}
label.l span{float:right;color:var(--txt)}
input[type=range]{width:100%;accent-color:var(--ac);margin:0}
.sw2{display:flex;align-items:center;gap:8px;margin:6px 0}
.sw2 input{width:auto}
.ligne{display:flex;gap:6px;align-items:center}.ligne[hidden]{display:none}
.ligne>*{flex:1}
.fxrow{background:var(--pan2);border-radius:8px;padding:6px 8px;margin:6px 0}
.fxrow .tete{display:flex;align-items:center;gap:4px;font-weight:600;font-size:12px}
.fxrow .tete b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=color]{height:30px;padding:1px;border:1px solid var(--ligne);border-radius:6px;background:none;width:100%}
.bloc{border:1px solid var(--ligne);border-radius:8px;padding:8px;margin-top:6px;background:#0002}
.subrow{display:grid;grid-template-columns:52px 52px 1fr 24px;gap:4px;margin:3px 0}
.subrow input{padding:2px 4px;font-size:12px}
/* timeline */
#tl{grid-area:tl;background:var(--pan);border-top:1px solid var(--ligne);display:flex;flex-direction:column;min-height:0;position:relative}
#poignee{position:absolute;left:0;right:0;top:-4px;height:8px;cursor:ns-resize;z-index:9}#poignee:hover{background:#7c5cff55}
#tlbar{display:flex;gap:5px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--ligne);flex-wrap:wrap}
#tlbar .sp{flex:1}
#tlcorps{flex:1;display:flex;min-height:0}
#entetes{width:54px;flex:none;overflow:hidden;background:var(--pan2);border-right:1px solid var(--ligne)}
#entetes .ent{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;color:var(--mut);font-size:10px;line-height:1.2}
#entetes .ent b{font-size:12px;color:var(--txt,#e8e9ed);letter-spacing:.04em}
#entetes #eR{border-radius:0;border-bottom:1px solid var(--ligne)}
#entetes #eV2 b{color:#b9a6ff}#entetes #eA b{color:#7fd4a6}
.piste .vide2{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--mut);opacity:.7;pointer-events:none;white-space:nowrap}
#scroll{flex:1;overflow:auto;position:relative;min-height:0}
#lane{position:relative;min-height:100%;min-width:100%}
#regle{height:22px;position:sticky;top:0;background:var(--pan2);border-bottom:1px solid var(--ligne);cursor:pointer;z-index:6}
#regle i{position:absolute;top:0;bottom:0;border-left:1px solid var(--ligne);padding-left:3px;font-size:10px;color:var(--mut);font-style:normal;pointer-events:none}
#regle em{position:absolute;top:9px;width:9px;height:9px;border-radius:50%;background:#ff5fa2;transform:translateX(-4px);cursor:pointer;box-shadow:0 0 0 2px #0d0e11}#regle em.fait{background:#5b6170}
#regle b{position:absolute;top:10px;width:0;height:0;border:5px solid transparent;border-top-color:#ffb400;transform:translateX(-5px);cursor:pointer}
.piste{position:relative;height:80px;margin:6px 0;border-radius:6px;background:#0003}
.piste.a{height:60px;min-height:60px}
.etiq{position:absolute;left:4px;top:-1px;font-size:10px;color:var(--mut);z-index:2;pointer-events:none}
.clip{position:absolute;top:0;bottom:0;border-radius:6px;border:2px solid #0006;background:var(--clip) left/auto 100% repeat-x;overflow:hidden;cursor:grab;box-shadow:inset 0 0 0 100px #0a122355;touch-action:none}
.clip.k-audio{background:var(--podcast) center/100% 100% no-repeat}
.clip.k-solid{background-color:#444}
.clip.sel{border-color:#fff;box-shadow:inset 0 0 0 100px #0a122322}
.clip .wv{position:absolute;left:0;right:0;bottom:0;height:34%;background:#2f7d5bd9 center/100% 100% no-repeat;border-top:1px solid #0007;pointer-events:none}
#menuCtx{position:fixed;z-index:40;min-width:230px;background:var(--pan);border:1px solid var(--ligne);border-radius:10px;padding:5px;box-shadow:0 10px 30px #000a}
#menuCtx button{display:flex;justify-content:space-between;gap:18px;width:100%;border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:6px}
#menuCtx button:hover:not(:disabled){background:var(--ac);color:#fff}#menuCtx button:disabled{opacity:.4;cursor:default}
#menuCtx hr{border:0;border-top:1px solid var(--ligne);margin:4px 2px}#menuCtx kbd{opacity:.7}
.clip.drag{opacity:.75;z-index:8}
.clip b{position:absolute;left:8px;top:3px;right:8px;font-size:11px;text-shadow:0 1px 3px #000;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none}
.clip small{position:absolute;left:8px;bottom:3px;font-size:10px;text-shadow:0 1px 3px #000;pointer-events:none}
.clip .tags{position:absolute;right:8px;bottom:2px;font-size:11px;text-shadow:0 1px 3px #000;pointer-events:none}
.zc{position:absolute;top:0;bottom:0;z-index:4;cursor:pointer;border-radius:3px;border:1px solid #ff5a6a;background:repeating-linear-gradient(45deg,#e0102acc 0 6px,#e0102a55 6px 12px)}
.zc.garde{background:#19d38a33;border-color:#19d38a}
#barreCoupe{position:fixed;left:50%;transform:translateX(-50%);top:62px;z-index:60;background:var(--panel,#1c1d22);border:1px solid #e0102a;border-radius:10px;padding:8px 12px;box-shadow:0 6px 24px #0008;font-size:13px;max-width:780px}
#barreCoupe button{margin-left:6px}
.clip .ovm{position:absolute;top:17px;height:4px;border-radius:2px;background:#ffcc00;box-shadow:0 0 0 1px #0008;pointer-events:none;z-index:2}
.clip .hl,.clip .hr{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;background:#ffffff22;z-index:3}
.clip .hl{left:0}.clip .hr{right:0}
.clip .hl:hover,.clip .hr:hover{background:#ffffff66}
.clip.drop{outline:2px dashed var(--ac)}
.cut{position:absolute;top:50%;transform:translate(-50%,-50%);z-index:4;width:20px;height:20px;border-radius:50%;background:var(--pan3);border:1px solid var(--mut);font-size:11px;display:grid;place-items:center;cursor:pointer;padding:0}
.cut.on{background:var(--ac);border-color:#fff}
.cut.sel{box-shadow:0 0 0 2px #fff}
.aud{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--audio) center/100% 100% no-repeat;border:2px solid #0006;cursor:grab;overflow:hidden;font-size:11px;padding:3px 6px;white-space:nowrap;box-shadow:inset 0 0 0 100px #0a122340;touch-action:none}
.aud.sel{border-color:#fff}
.aud .hl,.aud .hr{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;background:#fff3}.aud .hl{left:0}.aud .hr{right:0}.aud:hover .hl,.aud:hover .hr{background:#fff7}
#guide{position:absolute;top:0;bottom:0;width:1px;background:#ffd24a;pointer-events:none;z-index:9}
.piste.v2{height:52px;min-height:52px}
.piste.t{height:40px;min-height:40px}
.pt{position:absolute;top:3px;height:30px;border-radius:6px;background:linear-gradient(90deg,#7a2c4c,#4b2a6b);border:2px solid #0006;cursor:grab;overflow:hidden;font-size:11px;padding:6px 8px;white-space:nowrap;touch-action:none;color:#fff}
.pt.sel{border-color:var(--sel)}.pt i.hl,.pt i.hr{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;background:#fff3}.pt i.hl{left:0}.pt i.hr{right:0}.piste.cachee .pt{opacity:.3}.piste.verrou .pt{cursor:not-allowed}
.pv{position:absolute;top:3px;height:40px;border-radius:6px;background:#3b2f6b center/cover no-repeat;border:2px solid #0006;cursor:grab;overflow:hidden;font-size:11px;padding:3px 6px;white-space:nowrap;box-shadow:inset 0 0 0 100px #1a103c66;touch-action:none;color:#fff}
.pv.sel{border-color:#fff}.pv i.hl,.pv i.hr{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;background:#fff3}.pv i.hl{left:0}.pv i.hr{right:0}
#stage .pv2{position:absolute;pointer-events:none;overflow:hidden;border-radius:6px}
#stage .pv2 img{position:absolute;box-shadow:none;background:none;max-width:none;max-height:none}
#tete{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #ff4d4d;z-index:7;pointer-events:none}
#tete::before{content:"";position:absolute;top:0;left:-7px;border:6px solid transparent;border-top:9px solid #ff4d4d}
/* fenêtres */
#modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20}
#majBox{position:fixed;right:16px;bottom:16px;z-index:25;width:340px;max-width:calc(100vw - 32px);background:var(--pan);border:1px solid var(--ac);border-radius:12px;padding:12px 14px;box-shadow:0 12px 40px #000a;display:none}
#majBox.on{display:block}#majBox h4{margin:0 0 6px;font-size:14px}#majBox .notes{max-height:120px;overflow:auto;font-size:12px;white-space:pre-wrap;margin:6px 0}
#majBox progress{width:100%}
/* Studio : caméra, micro et prompteur */
#studio{position:fixed;inset:0;background:#050506;z-index:30;display:none;color:#fff}
#studio.on{display:grid;grid-template-columns:1fr 320px}
#stScene{position:relative;overflow:hidden;display:grid;place-items:center}
#stScene>video,#stCanvas{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;background:#000}
#stScene .miroir{transform:scaleX(-1)}
#stCanvas{position:absolute;inset:0;display:none}#stScene.fond #stCanvas{display:block}#stScene.fond video{visibility:hidden}
#stPrompt{position:absolute;left:50%;top:0;transform:translateX(-50%);width:var(--pw,70%);height:42%;overflow:hidden;background:rgba(0,0,0,var(--po,.55));border-radius:0 0 14px 14px;cursor:pointer;
  -webkit-mask-image:linear-gradient(#0000,#000 14%,#000 80%,#0000)}
#stPrompt.miroirtxt #stTexte{transform-origin:center;scale:-1 1}
#stTexte{padding:40% 6% 120%;font:700 var(--ps,44px)/1.35 -apple-system,system-ui,sans-serif;text-align:center;white-space:pre-wrap;will-change:transform}
#stLigne{position:absolute;left:0;right:0;top:34%;border-top:2px solid #ffd40088;pointer-events:none}
#stCompte{position:absolute;inset:0;display:none;place-items:center;font:800 180px/1 system-ui;text-shadow:0 4px 30px #000}
#stCompte.on{display:grid}
#stBarre{z-index:3;position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;justify-content:center;padding:12px;background:linear-gradient(#0000,#000c)}
#stBarre button{min-width:44px}
#stRec{background:#e0102a!important;color:#fff!important;font-weight:700}
#stRec.enreg{animation:clign 1s infinite}
#stRec.enreg.pause{animation:none;opacity:.75}
#stPause{font-weight:700}#stPause.on{background:#f5b800!important;color:#111!important}
#stTemps.pause{color:#f5b800}
@keyframes clign{50%{opacity:.6}}
#stTemps{font:600 15px ui-monospace,Menlo,monospace;min-width:70px;text-align:center}
#stVu{width:90px;height:8px;background:#222;border-radius:4px;overflow:hidden}#stVu i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3c3,#fd0 70%,#f33)}
/* Doublage : ta voix, réplique par réplique */
.dblTexte{font-size:26px;line-height:1.35;font-weight:600;margin:6px 0 12px;min-height:3.4em}
#dbVu{width:110px;height:8px;background:#222;border-radius:4px;overflow:hidden;flex:none}#dbVu i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3c3,#fd0 70%,#f33)}
#dbTemps{font:600 14px ui-monospace,Menlo,monospace;min-width:56px}
.prSus{display:inline-block;margin:2px 8px 2px 0}.prLig{display:flex;gap:8px;align-items:center;padding:3px 0}.prLig input{flex:1;min-width:0}.vcSon{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--bord,#2a2a2e)}.vcSon audio{flex:none;height:34px}
.dblListe{max-height:32vh;overflow:auto;border:1px solid #ffffff1c;border-radius:8px;margin:10px 0}
.dblL{display:flex;gap:8px;padding:6px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #ffffff10;align-items:baseline}.dblL:hover{background:#ffffff0c}.dblL.cur{background:#ffffff1c}
.dblL .n{width:30px;opacity:.6;flex:none}.dblL .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dblL .d{flex:none;opacity:.75}
.enreg{background:#d4001a !important;color:#fff !important}
#stPanneau{background:var(--pan);padding:14px;overflow:auto;border-left:1px solid #0006}
#stPanneau textarea{width:100%;min-height:160px;font-size:13px}
#stPanneau details{border-top:1px solid #ffffff14;padding:6px 0}#stPanneau summary{cursor:pointer;font-weight:600;padding:4px 0}
#stAnims{grid-template-columns:1fr 1fr;gap:6px}#stAnims .carte{padding:7px 6px;font-size:12px;text-align:left}#stAnims kbd{margin-right:4px}

.pv2-qualites button.on,.pv2-vis button.on{border-color:#5b78ff;background:#1d2647}
.pv2-dests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pv2-dest{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1px solid #22252d;background:var(--pan);text-align:left;height:auto}
.pv2-dest:hover{border-color:#3a4050}.pv2-dest.on{border-color:#5b78ff;background:#171c2e}.pv2-dest:disabled{opacity:.4;cursor:not-allowed}
.pv2-ic{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center}.pv2-ic svg{width:20px;height:20px}
.pv2-t{flex:1;display:flex;flex-direction:column;gap:3px}.pv2-t b{font-size:14px}.pv2-t small{font-size:12px;color:var(--mut)}
.pv2-case{width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid #3a4050;display:grid;place-items:center}.pv2-case svg{width:13px;height:13px}
.pv2-dest.on .pv2-case{border-color:#5b78ff;background:#3f5ef0}
#pvComptes{margin-top:8px;font-size:12.5px}
.pv2-textes:not(:empty){padding:18px;border-radius:14px;background:var(--pan);border:1px solid #22252d}
.pv2-tete{display:flex;align-items:center;justify-content:space-between}.pv2-tete h2{margin:0;font-size:14px;color:var(--txt);text-transform:none;letter-spacing:0}
.pv2-textes input[type=text],.pv2-textes textarea{width:100%;box-sizing:border-box}
.pv2-vis{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.pv2-vis button{border-radius:999px;padding:5px 12px;height:auto}.pv2-synth{margin-left:auto;font-size:12px;color:var(--mut)}
.pv2-avance summary{cursor:pointer;color:var(--mut);font-size:12.5px}
.pv2-action{display:flex;align-items:center;gap:14px;margin-top:auto}.pv2-action .sp{flex:1}
.pv2-action #xGo{height:48px;padding:0 26px;border-radius:12px;font-size:15px;font-weight:600}
.pv2-prog,.pv2-fin{flex:1}.pv2-fin p{margin:0 0 8px}
@media (max-width:1000px){.pv2-int{flex-direction:column;padding:24px}.pv2-apercu{width:100%;max-width:340px}}
.conseilI{display:flex;gap:10px;align-items:center;padding:9px 11px;margin-bottom:10px;border-radius:10px;background:#1a2340;border:1px solid #2a3866;color:#c9d2ff;font-size:12px;line-height:1.4}
.conseilI svg{width:16px;height:16px;flex:none;color:#8fa3ff}.conseilI span{flex:1}.conseilI button{flex:none;white-space:nowrap}
/* sons colorés selon leur rôle : voix en vert, musique et bruitages en orange ; titres ambre, incrustations violet */
.pt{background:#3a2e10;border:1px solid #6b5317;color:#f6d27a}
.pv{border:1px solid #4c3d86;box-shadow:inset 0 0 0 100px #2a214799;color:#d3c4ff}
.aud.r-voix{border:1px solid #1f5a4c;box-shadow:inset 0 0 0 100px #11302acc;color:#a8f0d6}
.aud.r-musique{border:1px solid #5e4219;box-shadow:inset 0 0 0 100px #33220fcc;color:#f3c27a}
.aud.r-son{border:1px solid #6b4a1c;box-shadow:inset 0 0 0 100px #3a2a14b0;color:#fbd29a}
.clip.sel,.aud.sel,.pv.sel,.pt.sel{border:2px solid var(--sel)}
#entetes #eA{box-shadow:inset 3px 0 0 #4fd1a5,inset 6px 0 0 #f3a64a}
/* Relecture d'un épisode Pico */
.rlListe{display:flex;flex-direction:column;gap:6px;max-height:58vh;overflow:auto;padding-right:4px}
.rlLigne{padding:8px 10px;border-radius:10px;background:#1a1d23;border:1px solid #262a33}.rlLigne.change{border-color:#5b78ff;background:#171c2e}
.rlSection{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.rlCorps{display:flex;gap:10px;align-items:flex-start}.rlNum{width:22px;flex:none;color:var(--mut);font:12px ui-monospace,Menlo,monospace;padding-top:5px}
.rlCorps select{width:110px;flex:none}.rlTexte{flex:1;line-height:1.6;padding-top:3px}
.rlMot{cursor:pointer;border-radius:4px}.rlMot:hover{background:#2a2e38}.rlMot.dur{text-decoration:underline wavy #f2b92b;text-underline-offset:4px}
.rlPron{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 0 32px;padding:8px;border-radius:8px;background:#0f1115}.rlPron input{flex:1;min-width:180px}
.rlEcran{margin:6px 0 0 32px;font-size:12px}.rlEcranEdit{display:grid;gap:6px;padding:8px;border-radius:8px;background:#0f1115}.rlEcranEdit label{display:grid;gap:2px}
/* Panneau de droite 2.1 : réglages du clip ou discussion avec l'assistant */
#droite{grid-area:insp;display:flex;flex-direction:column;min-height:0;background:var(--pan);border-left:1px solid #22252d}
#droite #insp{grid-area:auto;flex:1;min-height:0;border-left:0}#droite #insp[hidden],#chat[hidden]{display:none}
.dr-onglets{display:flex;gap:18px;padding:0 14px;height:40px;flex:none;border-bottom:1px solid #22252d}
.dr-onglets button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--mut);font-weight:600;padding:0;height:40px}
.dr-onglets button.on{color:var(--txt);border-bottom-color:#5b78ff}
#chat{flex:1;min-height:0;display:flex;flex-direction:column}
#retours{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 12px;overflow:auto}
.rt-tc{display:flex;justify-content:space-between;align-items:baseline}.rt-tc b{font:600 15px ui-monospace,Menlo,monospace;color:#ffcf40}
.rt-nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.rt-nav button{min-width:54px}.rt-aide{margin:0;font-size:12px}
.rt-saisie{display:flex;gap:6px;align-items:stretch}.rt-saisie textarea{flex:1;resize:vertical;min-height:44px}
.rt-liste{display:flex;flex-direction:column;gap:6px}.rt-r{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;background:var(--pan2);border-radius:8px;padding:8px}
.rt-r.fait{opacity:.55}.rt-r.fait .rt-txt{text-decoration:line-through}.rt-t{font:600 12px ui-monospace,Menlo,monospace;color:#ffcf40;background:transparent;border:0;padding:0;cursor:pointer;white-space:nowrap}
.rt-txt{font-size:13px;line-height:1.4;white-space:pre-wrap;word-break:break-word}.rt-b{display:flex;gap:4px}.rt-actions{display:flex;gap:6px;flex-wrap:wrap}.rt-revue{align-self:flex-start}
.rv{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:16px}.rv-g video{width:100%;max-height:60vh;background:#000;border-radius:8px}
.rv-barre{position:relative;margin:8px 0}.rv-barre input{width:100%}.rv-mk{position:absolute;left:0;right:0;top:-8px;height:8px;pointer-events:none}.rv-mk i{position:absolute;width:6px;height:6px;border-radius:50%;background:#ff5fa2;transform:translateX(-3px)}
.rv-tc{font:600 15px ui-monospace,Menlo,monospace;color:#ffcf40;margin-left:auto}.rv-d{display:flex;flex-direction:column;gap:8px;min-width:0;max-height:75vh;overflow:auto}
@media (max-width:900px){.rv{grid-template-columns:1fr}}
#chMsgs{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px 12px 6px}
.ch-m{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.ch-m.moi{align-items:flex-end}
.ch-bulle{max-width:92%;padding:8px 11px;border-radius:14px 14px 14px 4px;background:#1f232b;font-size:12.5px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.ch-m.moi .ch-bulle{background:#2c3a7a;border-radius:14px 14px 4px 14px}
.ch-b{display:flex;gap:6px;flex-wrap:wrap}.ch-b button{height:auto;min-height:26px;padding:3px 9px;border-radius:7px;text-align:left}.ch-b button:not(.pri){background:#1c1f26;border-color:#2e3340;color:#c9d2ff}
.ch-instant{padding:0 10px}.ch-instant[hidden]{display:none}
.ch-instant button{height:auto;padding:3px 9px;border-radius:999px;font-size:11.5px;background:transparent;border:1px dashed #3a4050;color:var(--mut)}
.ch-instant button.on{background:#1d2647;border:1px solid #5b78ff;color:#c9d2ff}.ch-instant button:disabled{opacity:.7}
.ch-t{height:auto;padding:1px 7px;border-radius:999px;font-size:11px;background:#1d2647;border:1px solid #2a3866;color:#c9d2ff}
.ch-saisie{display:flex;gap:6px;align-items:center;padding:8px 10px 10px;flex:none}
.ch-saisie input{flex:1;min-width:0;height:36px;border-radius:10px;padding:0 12px;background:#0f1115;border:1px solid #2e3340}
.ch-saisie .ib{width:36px;height:36px;flex:none;border-radius:10px}
/* Animations (Texte → Animations) */
.anim-carte{padding:10px;border-radius:12px;background:#1a1d23;border:1px solid #262a33;margin-bottom:10px}
.anim-tete{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.anim-carte p{margin:4px 0 6px;font-size:12px}
.anim-apercu{margin:6px 0;border-radius:8px;overflow:hidden;background:#0d0e11;display:grid;place-items:center}.anim-apercu img{max-width:100%;display:block}
.anim-apercu.damier{background:repeating-conic-gradient(#2a2e38 0 25%,#1a1d23 0 50%) 0 0/16px 16px}
.anim-etat{margin-top:4px;font-size:12px}
.puces-v2{display:flex;gap:6px;margin:0 0 10px}
.puces-v2 button{padding:4px 11px;border-radius:999px;background:transparent;border-color:#2a2e38;color:var(--mut);font-size:12px}
.puces-v2 button.on{background:#1d2647;border-color:#5b78ff;color:var(--txt)}
.media,.carte,.encart{background:#1a1d23;border-color:#262a33}
#view,#stage{background:var(--bg)}
#vbar,.transport{background:#111317;border-color:#22252d}
#accueil{position:fixed;left:0;right:0;top:52px;bottom:0;z-index:12;background:var(--bg);overflow:auto;-webkit-user-select:none;user-select:none}
.acc-int{max-width:1080px;margin:0 auto;padding:48px 40px 60px;display:flex;flex-direction:column;gap:14px}
.acc-int h2{margin:0 0 6px;text-align:center;font-size:30px;font-weight:600;letter-spacing:-.02em}
.acc-int h3{margin:22px 0 0;font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.acc-demande{align-self:center;width:min(720px,100%);height:52px;display:flex;align-items:center;gap:12px;padding:0 14px 0 18px;border-radius:16px;background:var(--pan);border:1px solid #2e3340;color:var(--mut);font-size:14px;text-align:left}
.acc-demande span{flex:1}.acc-demande .ic{color:#8fa3ff}
.acc-cartes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.acc-carte{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:16px;background:var(--pan);border:1px solid #22252d;text-align:left;color:var(--txt)}
.acc-carte:hover{border-color:#3a4050;background:#1c1f26}
.acc-ic{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center}.acc-ic svg{width:22px;height:22px}
.acc-t{display:flex;flex-direction:column;gap:4px;flex:1}.acc-t b{font-size:14.5px}.acc-t small{color:var(--mut);font-size:12.5px;line-height:1.45}
.acc-recents{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.acc-projet{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--pan);border:1px solid #22252d;color:var(--txt);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.acc-projet:hover{border-color:#3a4050}
.asListe{display:flex;flex-direction:column;gap:4px}.asEtape,.asSug{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;background:#1b1b1e;border:1px solid #303036}.asEtape span,.asSug span{flex:1}.asEtape em{font-style:normal;font-size:11.5px;max-width:45%}
</style>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enc = encodeURIComponent;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
// durée lisible : « 4,2 s », « 2 min 05 s », « 1 h 02 min »

const api = async (url, opt) => {

  return r;
};
function tc(t, fps) { t = Math.max(0, t); const f = Math.floor((t % 1) * fps), s = Math.floor(t) % 60, m = Math.floor(t / 60) % 60, h = Math.floor(t / 3600); return [h, m, s, f].map(x => String(x).padStart(2, '0')).join(':'); }

let CAT = { video: [], audio: [], transitions: [], titres: [], reportage: [], generateurs: [], polices: [], sorties: ['mp4'], bibliotheque: { sons: [], musiques: [], stickers: [], marque: [], luts: [], calques: [], cadres: [], fonds: [], fondvert: [] } };
let PACKS = { luts: [], sons: [], images: [], videos: [], dossier: '' };
let medias = [];
let proj = { format: 'vertical', fps: 30, res: 1080, apercuRes: 720, quality: 'rapide', sortie: 'mp4', normaliser: false, clips: [], audio: [], pistes: [], markers: [] };
let selT = -1, sel = -1, selA = -1, selP = -1, selCut = -1, gt = 0, zoom = 40, tab = 'medias', rendu = null, presse = null;
const LIB = () => CAT.bibliotheque;
// Bibliothèque intégrée (« lib:… ») et packs de l'utilisateur (« pack:… »)
const LIB_KIND = { sons: 'audio', musiques: 'audio', stickers: 'image', luts: 'lut', calques: 'video', cadres: 'image', fonds: 'image', fondvert: 'video' };
const libItem = f => {
  if (!/^lib:/.test(f || '')) return null;
  for (const l of Object.values(LIB())) { const x = (l || []).find(y => 'lib:' + y.file === f || 'lib:' + y.file.replace(/-h\.(png|jpg)$/, '-v.$1') === f); if (x) return x; }
  return null;
};
const kindLib = f => { const it = libItem(f); return (it && it.kind) || LIB_KIND[/^lib:(\w+)/.exec(f)[1]] || 'image'; };
const PACK_KIND = { sons: 'audio', images: 'image', videos: 'video', luts: 'lut' };
const packItem = f => { for (const k of Object.keys(PACK_KIND)) { const x = (PACKS[k] || []).find(y => y.file === f); if (x) return { ...x, kind: PACK_KIND[k] }; } return null; };
const mediaOf = f => {
  const m = medias.find(x => x.file === f); if (m) return m;
  const l = libItem(f); if (l) { const k = kindLib(f); return { file: f, kind: k, duration: l.duree || 3, hasAudio: k === 'audio' }; }
  const p = packItem(f); if (p) return { file: f, kind: p.kind, duration: p.duree || 3, hasAudio: p.kind === 'audio' || !!p.son };
  return null;
};
const durOf = f => (mediaOf(f) || {}).duration || 5;
const dureeAudio = a => (a.dur || durOf(a.file)) / (a.vit || 1);
const nomOf = f => (libItem(f) || packItem(f) || {}).nom || f;
async function chargerPacks() { try { PACKS = await (await api('/api/packs')).json(); } catch (e) { /* dossier illisible */ } }

// ---------- Clips ----------
const effDur = c => (c.kind === 'image' || c.kind === 'solid') ? (c.dur || 3) : (c.out - c.in) / (c.speed || 1);
const starts = () => { let s = 0; return proj.clips.map(c => { const o = s; s += effDur(c); return o; }); };
const total = () => proj.clips.reduce((a, c) => a + effDur(c), 0);
const defKey = () => ({ on: false, color: '#00ff00', sim: 0.15, blend: 0.08, despill: false, bgType: 'color', bgColor: '#101820', bgFile: '', bgKind: 'image' });
function base(extra) {
  return { file: '', kind: 'video', in: 0, out: 3, dur: 3, speed: 1, vol: 100, fade: false, fit: 'fill', hasAudio: true, bw: false, bright: 0, contrast: 100, sat: 100,
    zoom: 100, zx: 0, zy: 0, fadeIn: 0, fadeOut: 0, fx: [], afx: [], text: '', textPos: 'bas', textSize: 6, textColor: '#ffffff', textStyle: 'bandeau', textAnim: 'aucune', textStart: 0, textDur: 0, textFont: 'arial',
    titre: null, overlays: [], subs: [], subStyle: 'contour', subSize: 4.4, key: defKey(), transition: null, lut: null, ...extra };
}
function newClip(m) {
  if (m.kind === 'audio') return base({ file: m.file, kind: 'audio', out: m.duration, hasAudio: true, bgColor: '#102040', bgFile: '', viz: { type: 'ligne', color: '#ffffff', pos: 'centre', h: 30 } });
  return base({ file: m.file, kind: m.kind, out: m.duration, hasAudio: m.hasAudio });
}
const newSolid = (color, dur = 3) => base({ kind: 'solid', color, dur, hasAudio: false });
const curClip = () => proj.clips[sel];
// Clip visé par une action de la bibliothèque : le clip sélectionné, sinon celui sous la tête de lecture (sélectionné au passage)
function clipCible() {
  if (proj.clips[sel]) return proj.clips[sel];
  if (!proj.clips.length) return null;
  const st = starts(); let i = st.findIndex((d, k) => gt >= d && gt < d + effDur(proj.clips[k]));
  if (i < 0) i = gt >= total() ? proj.clips.length - 1 : 0;
  sel = i; selA = -1; selP = -1; selCut = -1; selT = -1; return proj.clips[i];
}
// Message bref au-dessus de la timeline (remplace les fenêtres d'alerte bloquantes)
function signal(t) { let el = $('#signal'); if (!el) { el = document.createElement('div'); el.id = 'signal'; document.body.appendChild(el); } el.textContent = t; el.classList.add('vu'); clearTimeout(signal.t); signal.t = setTimeout(() => el.classList.remove('vu'), 3200); aide(esc(t)); }
const sansClipMsg = 'Ajoute d’abord une vidéo ou une photo dans la timeline (glisse-la depuis Médias ou clique sur ＋).';
const fxDef = (list, id) => list.find(d => d.id === id);
const clone = o => JSON.parse(JSON.stringify(o));
function normaliser(c) { // anciens projets : ajoute les champs manquants
  const b = base({}); for (const k of Object.keys(b)) if (c[k] === undefined) c[k] = clone(b[k]);
  c.key = { ...defKey(), ...(c.key || {}) };
  if (c.pip && c.pip.on && c.pip.file) { // ancienne incrustation → calque
    const px = { l: 18, c: 50, r: 82 }[c.pip.pos[1]], py = { t: 14, m: 50, b: 86 }[c.pip.pos[0]];
    c.overlays.push({ file: c.pip.file, kind: c.pip.kind, x: px, y: py, scale: c.pip.scale, rot: 0, opacity: c.pip.opacity, start: 0, dur: 0, anim: 'none' }); c.pip = null;
  }
  return c;
}

// ---------- Historique, sauvegarde automatique ----------
let hist = [], hi = -1, saveTimer = null, dernierGlisse = 0;
// rangées de la piste vidéo 2 (la plus haute passe devant) : calculées ici pour que l'historique et l'enregistrement les contiennent
function lignesPistes() {
  const fv = [], lv = [], ps = proj.pistes || [];
  ps.map((p, i) => i).sort((x, y) => ps[x].start - ps[y].start).forEach(i => { const p = ps[i]; let r = fv.findIndex(e => e <= p.start + 0.01); if (r < 0) { r = fv.length; fv.push(0); } fv[r] = p.start + dureePiste(p); lv[i] = r; });
  return { n: fv.length, lv };
}
const snap = () => { const { lv } = lignesPistes(); (proj.pistes || []).forEach((p, i) => { p.ligne = lv[i]; }); return JSON.stringify(proj); };
// Chaque action crée une étape d'annulation ; les mouvements d'un même curseur sont regroupés en une seule étape.
function commit(glisse) {
  const s = snap(), now = Date.now();
  if (hist[hi] !== s) {
    if (glisse && now - dernierGlisse < 900 && hi > 0) hist[hi] = s;
    else { hist = hist.slice(0, hi + 1); hist.push(s); if (hist.length > 150) hist.shift(); hi = hist.length - 1; }
    // long montage sous-titré : l'historique garde au plus ~80 Mo (sinon des centaines de Mo de mémoire sur un MacBook Air)
    let poids = hist.reduce((a, x) => a + x.length, 0);
    while (poids > 8e7 && hist.length > 10) { poids -= hist.shift().length; hi--; }
  }
  dernierGlisse = glisse ? now : 0;
  majBoutons();
  sauverPlusTard();
  majApercuEtat();
}
// enregistrement automatique 0,9 s après la dernière action ; envoyé tout de suite à la fermeture de la fenêtre
let saveAttente = false;
function sauverPlusTard() { clearTimeout(saveTimer); saveAttente = true; saveTimer = setTimeout(sauverMaintenant, 900); }
function sauverMaintenant(fin) {
  clearTimeout(saveTimer); if (!saveAttente) return; saveAttente = false;
  const corps = snap(); // keepalive limité à 64 Ko par le navigateur : au-delà, envoi ordinaire
  fetch('/api/projet', { method: 'PUT', body: corps, keepalive: !!fin && corps.length < 6e4 }).catch(() => {});
}
window.addEventListener('pagehide', () => sauverMaintenant(true));
window.addEventListener('beforeunload', () => sauverMaintenant(true));
function undo(d) {
  const s = snap(); if (hist[hi] !== s) { hist = hist.slice(0, hi + 1); hist.push(s); hi = hist.length - 1; }
  dernierGlisse = 0; const n = hi + d; if (n < 0 || n >= hist.length) return;
  hi = n; selObjs.clear(); proj = JSON.parse(hist[hi]); sel = Math.min(sel, proj.clips.length - 1); selA = -1; selP = -1; selCut = -1; selT = -1;
  $('#format').value = proj.format; tout(); apercu(); majBoutons();
  sauverPlusTard();
  majApercuEtat();
}
// projets enregistrés par la 1.29 à 1.34 : des réglages pouvaient être gardés en texte (« 1.7 ») au lieu de nombres
const CHAMPS_TEXTE = new Set(['text', 'l1', 'l2', 't', 'file', 'color', 'bgColor', 'nom', 'titre', 'id', 'font', 'police', 'format', 'type', 'mode', 'kind', 'preset']);
function reparerNombres(o) {
  if (o && typeof o === 'object') for (const k of Object.keys(o)) {
    const v = o[k];
    if (typeof v === 'string' && !CHAMPS_TEXTE.has(k) && /^-?\d+(\.\d+)?$/.test(v)) o[k] = +v; else reparerNombres(v);
  }
  return o;
}
const reparerProjet = p => { ['clips', 'audio', 'pistes', 'textes'].forEach(k => reparerNombres(p[k] || [])); return p; };
function majBoutons() { $('#bUndo').disabled = hi <= 0; $('#bRedo').disabled = hi >= hist.length - 1; }
function aide(t) { $('#bar').innerHTML = t; }

// ---------- Médiathèque ----------
async function chargerMedias() { medias = (await (await api('/api/medias')).json()).items; }
const vignette = m => m.kind === 'audio' ? '<div class="ico">🎵</div>'
  : `<img loading="lazy" draggable="false" src="${m.kind === 'image' ? '/media/' + enc(m.file) : '/api/frame?file=' + enc(m.file) + '&t=0.5'}" alt="">`;
async function importer(files) {
  const manques = [];
  for (const f of files) {
    $('#etat').textContent = 'Import de ' + f.name + '…';
    try { await api('/api/import?name=' + enc(f.name), { method: 'POST', body: f }); } catch (e) { manques.push(`${f.name} : ${e.message}`); }
  }
  $('#etat').textContent = ''; await chargerMedias(); await chargerPacks(); if (['medias', 'outils', 'effets'].includes(tab)) navigateur();
  if (manques.length) alert('Certains fichiers n’ont pas pu être importés :\n\n' + manques.join('\n'));
}
function ajouterClip(m, index) {
  if (!proj.clips.length && m.kind === 'video' && m.w && m.h) { // premier clip : le projet prend la forme de la vidéo (pas de recadrage surprise)
    const r = m.w / m.h, f = r > 1.2 ? 'horizontal' : r < 0.83 ? 'vertical' : 'carre';
    if (f !== proj.format) { proj.format = f; $('#format').value = f; aide(`Format du projet réglé sur la vidéo : ${f === 'horizontal' ? 'horizontal 16:9' : f === 'vertical' ? 'vertical 9:16' : 'carré'} (modifiable en haut).`); }
  }
  const c = newClip(m); if (index === undefined || index > proj.clips.length) index = proj.clips.length;
  suivreV1(() => proj.clips.splice(index, 0, c)); commit(); sel = index; selA = -1; selP = -1; selCut = -1; selT = -1; tout(); placerTete(starts()[index] || 0);
}
function ajouterSon(file, opts = {}) { // bruitage, musique ou fichier audio dans la piste audio, à la tête de lecture
  proj.audio.push({ file, vol: opts.vol || 100, start: opts.start === undefined ? +gt.toFixed(1) : opts.start, fade: !!opts.fade, loop: !!opts.loop, duck: !!opts.duck });
  selA = proj.audio.length - 1; selP = -1; sel = -1; selT = -1; selCut = -1; commit(); tout();
}

async function chargerApercusTitres() {
  const imgs = [...document.querySelectorAll('#navbody img[data-apt]')]; if (!imgs.length) return;
  const file = []; let actif = false;
  const suivant = async () => {
    if (actif) return; actif = true;
    while (file.length) { const im = file.shift(); if (tab !== 'packs' || !im.isConnected || im.src) continue; const u = await apercuTitre(im.dataset.apt, im.dataset.fond); if (u && im.isConnected) im.src = u; }
    actif = false;
  };
  if (!('IntersectionObserver' in window)) { file.push(...imgs); return suivant(); }

  imgs.forEach(im => obs.observe(im));
}

function afficherAide() {
  ouvrir(`<h2>⌨ Raccourcis clavier</h2><div class="raccourcis">${RACCOURCIS.map(([t, l]) => `<h3>${t}</h3>${l.map(([k, d]) => `<div><span>${esc(d)}</span><span><kbd>${esc(k)}</kbd></span></div>`).join('')}`).join('')}</div><button id="aOk" class="pri" style="margin-top:12px;width:100%">Fermer</button>`, true);
  $('#aOk').onclick = fermer;
}
document.addEventListener('keydown', e => {
  if (studio) return toucheStudio(e);
  const fenetre = $('#modal').classList.contains('on');
  if (fenetre && e.key === 'Escape' && !$('#barreExp') && !document.getElementById('menuCtx')) {
    e.stopImmediatePropagation(); // l'écran du dessous (export, accueil) reste ouvert
    if (!fermetureOk()) return e.preventDefault();
  }
  if (dbl && fenetre && toucheDoublage(e)) return;
  if (fenetre && e.key !== 'Escape') return; // fenêtre ouverte : les raccourcis du montage ne touchent pas la timeline derrière
  const tag = (e.target.tagName || '').toLowerCase(), saisie = tag === 'input' && !['range', 'checkbox', 'color'].includes(e.target.type) || tag === 'textarea' || tag === 'select';
  const cmd = e.metaKey || e.ctrlKey, k = e.key, kl = k.length === 1 ? k.toLowerCase() : k;
  if (k === 'Escape') { if (document.getElementById('menuCtx')) { fermerMenu(); return; } if ($('#modal').classList.contains('on') && !$('#barreExp')) fermer(); else if (selObjs.size) { selObjs.clear(); tout(); } return; }
  if (cmd && !saisie) {
    const faire = f => { e.preventDefault(); f(); };
    if (kl === 'z') return faire(() => undo(e.shiftKey ? 1 : -1));
    if (kl === 'a') return faire(() => { selObjs = new Set(proj.clips); tout(); aide(`${proj.clips.length} clips sélectionnés : Suppr, D (détacher le son), clic droit…`); });
    if (kl === 'd' && e.shiftKey) return faire(ouvrirDoublage);
    if (kl === 'o' && e.shiftKey) return faire(ouvrirTableauProjets);
    if (kl === 'b') return faire(couper); if (kl === 'd') return faire(dupliquer); if (kl === 'n') return faire(nouveau); if (kl === 'o') return faire(ouvrirProjet);
    if (kl === 's') return faire(sauver); if (kl === 'i') return faire(() => $('#fichiers').click()); if (kl === 'e') return faire(exporter);
    if (kl === 'k') return faire(() => ouvrirAssistant());
    if (kl === 'r' && e.shiftKey) return faire(ouvrirStudio);
    if (kl === 'g' && e.shiftKey) return faire(ouvrirGenerateur);
    if (kl === 'r') return faire(() => $('#bApercu').click()); if (kl === 'c') return faire(copier); if (kl === 'v') return faire(() => coller(e.altKey));
    if (k === '[') return faire(() => deplacer(-1)); if (k === ']') return faire(() => deplacer(1));
    return;
  }
  if (cmd && saisie && kl === 'z') return; // annulation du champ de texte
  if (saisie) return;
  const f = fn => { e.preventDefault(); fn(); };
  if (k === ' ') return f(() => (e.altKey ? lireOriginal() : lire()));
  if (kl === 'a' && !e.shiftKey) return f(() => choisirOutil('selection')); if (kl === 'b') return f(() => choisirOutil('lame')); if (kl === 'n') return f(basculerAimant); if (kl === 'g') return f(() => basculerVue('grille'));
  if (kl === 's') return f(couper); if (kl === 'd') return f(detacherSelection); if (kl === 'm') return f(marqueur); if (kl === 'i') return f(() => rogner(true)); if (kl === 'o') return f(() => rogner(false));
  if (kl === 'k') return f(stopLecture); if (kl === 'j') return f(() => saut(-1)); if (kl === 'l') return f(() => saut(1));
  if (kl === 'f') return f(() => { const s = $('#stage'); if (document.fullscreenElement) document.exitFullscreen(); else s.requestFullscreen && s.requestFullscreen(); });
  if (kl === 't') return f(() => allerOnglet('titres'));
  if (kl === 'z' && e.shiftKey) return f(fitZoom);
  if (k === 'Delete' || k === 'Backspace') { if (sel >= 0 || selA >= 0 || selP >= 0 || selT >= 0) f(supprimer); return; }
  if (k === 'ArrowLeft' || k === 'ArrowRight') return f(() => { stopLecture(); placerTete(gt + (k === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 1 : 1 / proj.fps)); });
  if (k === 'ArrowUp' || k === 'ArrowDown') return f(() => { const n = clamp((sel < 0 ? 0 : sel) + (k === 'ArrowUp' ? -1 : 1), 0, proj.clips.length - 1); if (proj.clips.length) { stopLecture(); choisir(n); } });
  if (k === 'Home') return f(() => placerTete(0)); if (k === 'End') return f(() => placerTete(total() - 0.05));
  if (k === '[') return f(() => repere(-1)); if (k === ']') return f(() => repere(1));
  if (k === '+' || k === '=') return f(() => setZoom(zoom * 1.3)); if (k === '-') return f(() => setZoom(zoom / 1.3));
  if (k === '?') return f(afficherAide);
  if (/^[1-9]$/.test(k)) return f(() => allerOnglet(TABS[+k - 1]));
  if (k === '0') return f(() => allerOnglet('packs'));
});

// Prise du studio interrompue (application fermée ou plantée pendant l'enregistrement) : sa copie de secours est proposée
async function proposerPrisesInterrompues() {
  let l = []; try { l = (await (await api('/api/prise/secours')).json()).prises || []; } catch (e) { return; }
  if (!l.length || !confirm(`${l.length > 1 ? `${l.length} prises du studio ont été interrompues` : 'Une prise du studio a été interrompue'} (QuentMovie s’est fermé pendant l’enregistrement). Une copie de secours a été gardée.\n\nLa récupérer dans tes médias ?`)) return;
  for (const f of l) {
    try { aide('Récupération de la prise…'); const j = await (await api('/api/prise/recuperer?fichier=' + enc(f), { method: 'POST' })).json(); await chargerMedias(); navigateur(); aide(`✅ Prise récupérée : ${esc(j.file)} (dans tes médias).`); }
    catch (e) { aide(`<span class="err">Prise non récupérée : ${esc(e.message)} (le fichier reste dans Movies/QuentMovie/prises-a-verifier).</span>`); }
  }
}
