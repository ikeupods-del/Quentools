<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuentStudio</title>
<style>
  :root { --fond: #16181f; --carte: #1f222c; --bord: #2c303d; --texte: #eceef4; --doux: #9aa0b3; --vert: #c6e84a; --rouge: #e53935; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; background: var(--fond); color: var(--texte); }
  header { display: flex; align-items: center; gap: 14px; padding: 18px 24px; border-bottom: 1px solid var(--bord); }
  header h1 { margin: 0; font-size: 22px; }
  .rond { width: 34px; height: 34px; border-radius: 50%; background: var(--vert); box-shadow: inset -4px -4px 0 #9cbf2c; }
  main { padding: 20px 24px; display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 14px; padding: 16px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; background: #343947; color: var(--texte); }
  button.principal { background: var(--vert); color: #1b2008; font-weight: 700; }
  button:disabled { opacity: .45; cursor: default; }
  .barre { height: 8px; background: #2a2e3a; border-radius: 6px; overflow: hidden; margin: 12px 0 4px; }
  .barre i { display: block; height: 100%; width: 0; background: var(--vert); transition: width .3s; }
  .compteurs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .compteur b { display: block; font-size: 26px; }
  .compteur span, .doux { color: var(--doux); font-size: 13px; }
  #journal { font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--doux); white-space: pre-wrap; max-height: 210px; overflow: auto; margin: 0; }
  .videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
  .video { background: #191b23; border-radius: 12px; padding: 8px; }
  .video img { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-radius: 8px; background: #000; }
  .video p { margin: 6px 0; font-size: 12px; color: var(--doux); }
  .video .actions button { padding: 6px 8px; font-size: 12px; }
  .erreur { color: #ff8a80; }
  .pastille { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 12px; background: #2c303d; }
  .pastille.ok { background: #31411a; color: var(--vert); }
  .switch { margin-left: auto; display: flex; background: #262a35; border-radius: 12px; padding: 4px; }
  .switch button { background: transparent; padding: 8px 14px; border-radius: 9px; color: var(--doux); }
  .switch button.actif { background: var(--vert); color: #1b2008; font-weight: 700; }
  body.invest { --vert: #f6c846; }
  body.invest .rond { background: #f6c846; box-shadow: inset -4px -4px 0 #c9971e; }
  .sujet { display: none; gap: 10px; margin-top: 14px; }
  body.invest .sujet { display: flex; }
  .sujet select { flex: 1; font: inherit; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--bord); background: #14161d; color: var(--texte); }
  p.sujet { display: none; } body.invest p.sujet { display: block; }
  .sujet input { flex: 1; font: inherit; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--bord); background: #14161d; color: var(--texte); }
  .verif { color: #ffcf6e; }
  .ligne { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .ligne select { font: inherit; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--bord); background: #14161d; color: var(--texte); }
  label.case { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .options label.case { margin: 7px 0; }
  .options input[type=range] { width: 100%; }
  #brouillon { border-color: var(--vert); }
  #brouillon h3 { margin: 14px 0 6px; font-size: 14px; }
  #brouillon input, #brouillon textarea { width: 100%; font: inherit; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--bord); background: #14161d; color: var(--texte); }
  #brouillon textarea { resize: vertical; min-height: 44px; }
  .replique { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: start; margin: 6px 0; }
  .replique b { font-size: 12px; padding-top: 10px; }
  .faits { font-size: 12px; color: var(--doux); margin: 8px 0 0; padding-left: 18px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #2b3a1a; color: #e9f7c8; padding: 10px 16px; border-radius: 10px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><div class="rond"></div><h1 id="nomSerie">QuentStudio</h1><span class="doux" id="sousTitre">vidéos 9:16 de 62 s</span>
  <div class="switch" role="tablist" aria-label="Série">
    <button data-serie="quentools">Quentools</button><button data-serie="quentinvest">QuentInvest</button>
  </div></header>
<div id="majBandeau" hidden style="background:#2b3a1a;color:#e9f7c8;padding:10px 24px;display:flex;gap:12px;align-items:center"><span id="majTxt"></span><button id="majGo" class="principal" hidden>Redémarrer pour installer</button></div>
<main>
  <section>
    <div class="carte">
      <div class="actions">
        <button class="principal" data-mode="auto">Nouvelle vidéo</button>
        <button data-mode="bibliotheque">Nouvelle vidéo (bibliothèque)</button>
        <button data-mode="ia">Nouvelle vidéo (IA locale)</button>
      </div>
      <div class="sujet">
        <input id="sujet" maxlength="200" placeholder="Sujet pour l'IA, ex. : résume le krach boursier de 1929">
        <button class="principal" id="surSujet">Créer sur ce sujet</button>
      </div>
      <div class="sujet">
        <select id="fiches" aria-label="Sujets prêts"></select>
        <button id="surFiche">Créer ce sujet</button>
      </div>
      <p class="doux sujet" id="fichesInfo"></p>
      <div class="ligne">
        <label>Nombre de vidéos <select id="nb"><option value="1">1</option><option value="3">3</option><option value="5">5</option><option value="10">10</option></select></label>
        <label class="case"><input type="checkbox" data-opt="relire"> Relire et modifier le texte avant de fabriquer</label>
      </div>
      <div class="barre"><i id="barre"></i></div>
      <div id="statut" class="doux">Prêt.</div>
    </div>
    <div class="carte" id="brouillon" style="margin-top:16px" hidden></div>
    <div class="carte" style="margin-top:16px">
      <b>Vidéos</b> <span class="doux" id="dossier"></span>
      <div class="videos" id="videos"></div>
    </div>
  </section>
  <aside>
    <div class="carte compteurs">
      <div class="compteur"><b id="nbBiblio">–</b><span>scénarios dans la bibliothèque</span></div>
      <div class="compteur"><b id="nbReserve">–</b><span>prêts en avance</span></div>
      <div class="compteur"><b id="nbHisto">–</b><span id="libHisto">sketchs déjà publiés</span></div>
      <div class="compteur"><span>IA locale</span><br><span class="pastille" id="ia">–</span><br><button id="iaInstaller" hidden style="margin-top:6px;padding:6px 10px;font-size:12px">Installer l’IA (2,5 Go, une fois)</button><br><span>Voix</span><br><span class="pastille" id="voix">–</span></div>
    </div>
    <div class="carte" style="margin-top:16px">
      <button id="avance" style="width:100%">Générer 20 scénarios en avance</button>
      <p class="doux" id="avanceTxt">Travaille en arrière-plan : tu peux continuer à faire des vidéos.</p>
    </div>
    <div class="carte options" style="margin-top:16px" id="carteIA"><b>IA locale</b>
      <label class="case"><input type="checkbox" data-opt="ia"> Utiliser l’IA locale (sinon : fiches, bibliothèque et générateur, sans aucun risque de plantage)</label>
    </div>
    <div class="carte options" style="margin-top:16px"><b>Dans la vidéo</b>
      <label class="case"><input type="checkbox" data-opt="karaoke"> Mots surlignés pendant qu’ils sont dits</label>
      <label class="case"><input type="checkbox" data-opt="barre"> Barre de progression en haut</label>
      <label class="case" id="caseChiffres"><input type="checkbox" data-opt="chiffres"> Chiffre clé affiché en grand</label>
      <label class="case"><input type="checkbox" data-opt="bruitages"> Bruitages de transition</label>
      <label class="case"><input type="checkbox" data-opt="musique"> Musique de fond (baisse quand on parle)</label>
      <input type="range" min="20" max="200" step="10" data-opt="volume_musique" aria-label="Volume de la musique"><span class="doux" id="volTxt"></span>
    </div>
    <div class="carte" style="margin-top:16px"><b>Journal</b><pre id="journal"></pre></div>
  </aside>
</main>
<script>
const $ = s => document.querySelector(s);
const post = (u, b = {}) => fetch(u, { method: 'POST', body: JSON.stringify(b) }).then(r => r.json());
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nb = () => +$('#nb').value || 1;
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => post('/api/video', { mode: b.dataset.mode, n: nb() }).then(maj));
document.querySelectorAll('[data-opt]').forEach(el => el.onchange = () => post('/api/options', { [el.dataset.opt]: el.type === 'checkbox' ? el.checked : +el.value }).then(maj));
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2600); }
let sigBrouillon = '';
function afficherBrouillon(e) {
  const br = e.brouillon, el = $('#brouillon');
  const sig = br ? JSON.stringify(br) : '';
  if (sig === sigBrouillon) return;
  sigBrouillon = sig; el.hidden = !br;
  if (!br) { el.innerHTML = ''; return; }
  const v = br.video, noms = e.series[br.serie].noms, invest = br.serie === 'quentinvest';
  el.innerHTML = `<b>Texte à relire</b> <span class="doux">${esc(v.episode || '')} · ${esc(v.mode || '')}</span>
    ${v.verifier ? '<p class="verif">Sujet libre : vérifie les faits et les chiffres avant de fabriquer.</p>' : ''}
    ${v.sketchs.map((s, i) => `<h3>${invest ? 'Partie' : 'Sketch'} ${i + 1}</h3><input data-t="${i}" value="${esc(s.titre)}" maxlength="60" aria-label="Titre">
      ${s.plans.map((p, j) => `<div class="replique"><b>${esc(noms[p.qui])}</b><textarea data-p="${i}:${j}" maxlength="120" rows="2">${esc(p.texte)}</textarea></div>`).join('')}`).join('')}
    <h3>Question pour les commentaires</h3><input id="brQ" value="${esc(v.question)}" maxlength="90">
    ${(v.faits || []).length ? `<details style="margin-top:10px"><summary class="doux">Faits de la fiche (source des chiffres)</summary><ul class="faits">${v.faits.map(f => `<li>${esc(f)}</li>`).join('')}</ul></details>` : ''}
    <div class="actions" style="margin-top:14px"><button class="principal" id="brOk">Fabriquer la vidéo</button><button id="brAutre">Autre texte</button><button id="brAnnuler">Annuler</button></div>
    <p class="doux">22 mots au plus par réplique. Une modification est vérifiée avant la fabrication.</p>`;
  $('#brOk').onclick = () => {
    const sk = v.sketchs.map((s, i) => ({ titre: el.querySelector(`[data-t="${i}"]`).value, plans: s.plans.map((p, j) => el.querySelector(`[data-p="${i}:${j}"]`).value) }));
    const modifie = JSON.stringify(sk) !== JSON.stringify(v.sketchs.map(s => ({ titre: s.titre, plans: s.plans.map(p => p.texte) }))) || $('#brQ').value !== v.question;
    post('/api/brouillon/fabriquer', { sketchs: sk, question: $('#brQ').value, modifie }).then(r => { if (!r.ok && r.message) alert(r.message); maj(); });
  };
  $('#brAutre').onclick = () => post('/api/video', { mode: 'auto', sujet: v.sujet || '' }).then(maj);
  $('#brAnnuler').onclick = () => post('/api/brouillon/annuler').then(maj);
}
$('#avance').onclick = () => post('/api/avance').then(maj);
$('#majGo').onclick = () => post('/api/maj/installer').then(r => { if (r.ok) $('#majTxt').textContent = 'Installation… QuentStudio va redémarrer.'; });
$('#iaInstaller').onclick = () => post('/api/ia/installer').then(r => { if (r.message) alert(r.message); maj(); });
$('#surSujet').onclick = () => { const s = $('#sujet').value.trim(); if (!s) return $('#sujet').focus(); post('/api/video', { mode: 'auto', sujet: s, n: nb() }).then(maj); };
$('#surFiche').onclick = () => { const s = $('#fiches').value; if (!s) return $('#fiches').focus(); post('/api/video', { mode: 'auto', sujet: s, n: nb() }).then(maj); };
let signatureFiches = '';
function remplirFiches(e) {
  const sig = JSON.stringify(e.fiches);
  if (sig === signatureFiches) return;
  signatureFiches = sig;
  const choix = $('#fiches').value;
  const groupes = e.themes.map(t => {
    const fs = e.fiches.filter(f => f.theme === t);
    return fs.length ? `<optgroup label="${esc(t)}">${fs.map(f => `<option value="${esc(f.titre)}">${esc(f.titre)}${f.publie ? ' ✓' : ''}</option>`).join('')}</optgroup>` : '';
  }).join('');
  $('#fiches').innerHTML = `<option value="">Choisir un sujet prêt (${e.fiches.length}, sans IA)…</option>` + groupes;
  $('#fiches').value = choix;
  const reste = e.fiches.filter(f => !f.publie).length;
  $('#fichesInfo').textContent = `${reste} sujet${reste > 1 ? 's' : ''} prêt${reste > 1 ? 's' : ''} jamais publié${reste > 1 ? 's' : ''} (✓ = déjà publié). Avec l’IA locale, tout autre sujet d’économie.`;
}
$('#sujet').onkeydown = e => { if (e.key === 'Enter') $('#surSujet').click(); };
document.querySelectorAll('[data-serie]').forEach(b => b.onclick = () => post('/api/serie', { serie: b.dataset.serie }).then(r => { if (!r.ok) alert('Attends la fin du travail en cours pour changer de série.'); vus = ''; maj(); }));
let vus = '';
async function maj() {
  let e;
  try { e = await fetch('/api/etat').then(r => r.json()); } catch (_) { return; }
  const invest = e.serie === 'quentinvest';
  const m = e.maj || {};
  $('#majBandeau').hidden = !['telechargement', 'pret'].includes(m.etat);
  $('#majTxt').textContent = m.etat === 'pret' ? `QuentStudio ${m.version} est prête (installée à la fermeture).` : m.etat === 'telechargement' ? `Nouvelle version ${m.version} : téléchargement ${Math.round((m.avancement || 0) * 100)} %` : '';
  $('#majGo').hidden = m.etat !== 'pret';
  document.body.classList.toggle('invest', invest);
  document.querySelectorAll('[data-serie]').forEach(b => { b.classList.toggle('actif', b.dataset.serie === e.serie); b.disabled = !!e.travail || !!e.avance; });
  $('#nomSerie').textContent = e.series[e.serie].nom;
  $('#sousTitre').textContent = e.series[e.serie].sous_titre + ' · vidéos 9:16 de 62 s · version ' + e.version;
  $('[data-mode="bibliotheque"]').textContent = invest ? 'Nouvelle vidéo (fiches)' : 'Nouvelle vidéo (bibliothèque)';
  $('#avance').textContent = invest ? 'Écrire 20 épisodes en avance (IA)' : 'Générer 20 scénarios en avance';
  if (invest) remplirFiches(e);
  const o = e.options || {};
  document.querySelectorAll('[data-opt]').forEach(el => { if (document.activeElement === el) return; if (el.type === 'checkbox') el.checked = !!o[el.dataset.opt]; else el.value = o[el.dataset.opt]; el.disabled = el.dataset.opt === 'volume_musique' && !o.musique; });
  $('#volTxt').textContent = ' volume de la musique : ' + (o.volume_musique || 0) + ' %';
  $('#caseChiffres').hidden = !invest;
  $('#carteIA').hidden = !!e.sans_ia;
  afficherBrouillon(e);
  $('#surFiche').disabled = !!e.travail;
  $('#surSujet').disabled = !!e.travail;
  $('#nbBiblio').textContent = e.bibliotheque.toLocaleString('fr-FR');
  $('#nbReserve').textContent = e.reserve;
  $('#nbHisto').textContent = e.historique;
  $('#libHisto').textContent = invest ? 'sujets déjà publiés' : 'sketchs déjà publiés';
  const ins = e.ia_install || {};
  $('#ia').textContent = e.sans_ia ? 'version sans IA' : !o.ia ? 'coupée (réglage)' : e.ia === 'ok' ? e.modele : ins.en_cours ? `installation ${Math.round((ins.avancement || 0) * 100)} %` : e.ia === 'modele absent' ? 'à installer' : 'absente (mode sans IA)';
  $('#iaInstaller').hidden = !(e.ia === 'modele absent' && !ins.en_cours) || !!e.sans_ia || !o.ia;
  if (ins.erreur && !ins.en_cours) $('#iaInstaller').textContent = 'Reprendre l’installation de l’IA';
  $('#ia').className = 'pastille' + (e.ia === 'ok' ? ' ok' : '');
  $('#voix').textContent = e.voix === 'piper' ? 'Piper (Pierre, Jessica)' : e.voix === 'telechargement' ? 'téléchargement de la voix…' : 'bips de secours (voix non téléchargée)';
  $('#voix').className = 'pastille' + (e.voix === 'piper' ? ' ok' : '');
  document.querySelectorAll('[data-mode]').forEach(b => b.disabled = !!e.travail || (b.dataset.mode === 'ia' && e.ia !== 'ok'));
  $('#barre').style.width = (e.travail ? Math.max(3, e.avancement * 100) : 0) + '%';
  $('#statut').innerHTML = e.travail ? esc(e.travail) + ' : ' + Math.round(e.avancement * 100) + ' %' : e.erreur ? '<span class="erreur">' + esc(e.erreur) + '</span>' : 'Prêt.';
  $('#avance').disabled = !!e.avance;
  $('#avanceTxt').textContent = e.avance ? 'Génération en cours : ' + e.avance : 'Travaille en arrière-plan : tu peux continuer à faire des vidéos.';
  $('#journal').textContent = e.journal.join('\n');
  $('#journal').scrollTop = 1e6;
  $('#dossier').textContent = e.dossier;
  const cle = JSON.stringify(e.videos);
  if (cle !== vus) {
    vus = cle;
    $('#videos').innerHTML = e.videos.map(v => `<div class="video">
      ${v.vignette ? `<img src="/vignette/${encodeURIComponent(v.nom)}?${Date.now()}" alt="">` : '<img alt="">'}
      <p>${esc(v.titres.join(' · '))}<br>${esc(v.mode || '')}${v.voix === 'bips' ? ' · bips' : ''}${v.a_verifier ? '<br><span class="verif">À relire avant publication (sujet libre)</span>' : ''}</p>
      <div class="actions"><button data-a="ouvrir">Voir</button><button data-a="airdrop">AirDrop</button><button data-a="finder">Finder</button>${v.texte ? '<button data-a="texte" title="Titre, description et hashtags copiés">Texte</button>' : ''}${v.couverture ? '<button data-a="couverture">Couverture</button>' : ''}</div>
    </div>`).join('') || '<p class="doux">Aucune vidéo pour l’instant.</p>';
    $('#videos').querySelectorAll('.video').forEach((el, i) => el.querySelectorAll('[data-a]').forEach(b =>
      b.onclick = () => post('/api/' + b.dataset.a, { nom: e.videos[i].nom }).then(r => { if (b.dataset.a === 'texte' && r.texte) { try { navigator.clipboard.writeText(r.texte); } catch (_) {} return toast('Texte de publication copié : colle-le sous ta vidéo.'); } if (r.message) alert(r.message); if (r.par === 'finder') alert('AirDrop direct indisponible : la vidéo est montrée dans le Finder et la fenêtre AirDrop est ouverte.'); })));
  }
}
maj(); setInterval(maj, 1000);
</script>
</body>
</html>
