<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>QuenTools : publicité</title>
<!-- Publicité QuenTools (30 s, motion design) : studio de création d'apps et d'outils.
     Rendu : PUB=quentools node tools/pub/render.js port 30  (et land 25). Aperçu : PUB=quentools node tools/pub/apercu.js port
     Règles : aucun prix (publicité), jamais l'IA comme moyen de création, écrans du Pack Commerçant = exemple fictif signalé. -->
<style>
@font-face{font-family:B;src:url("../../assets/fonts/bricolage.woff2");font-weight:200 800}
@font-face{font-family:I;src:url("../../assets/fonts/inter.woff2");font-weight:100 900}
*{box-sizing:border-box}
:root{--v:#5b3df5;--v2:#7a62ff;--lime:#d7f24a;--ink:#ffffff;--bg:#120e2b;--soft:rgba(255,255,255,.78);--red:#ff5a6e;--green:#4cc08a}
body{margin:0;background:#000}
body.port{--W:1080px;--H:1920px;--ph:1080px;--h1:112px;--h2:58px}
body.land{--W:1920px;--H:1080px;--ph:780px;--h1:96px;--h2:46px}
.stage{position:relative;width:var(--W);height:var(--H);overflow:hidden;font-family:I,system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 900px at 85% 20%,#7a62ff55,transparent 70%),radial-gradient(900px 800px at 0% 100%,#d7f24a1a,transparent 70%),linear-gradient(140deg,#2a1a8f,#3b25d0 55%,#24127a)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.06) 2px,transparent 2px);background-size:72px 72px}
.scene{position:absolute;inset:0;display:flex;opacity:0}
.port .scene{flex-direction:column;padding:150px 84px 120px;gap:34px}
.land .scene{flex-direction:row;align-items:center;padding:96px 120px;gap:70px}
.txt{flex:none}.land .txt{width:46%}.land .vis{align-self:stretch}
.vis{position:relative;flex:1;display:grid;place-items:center;min-height:0}
.kick{display:inline-block;background:var(--lime);color:#120e2b;border-radius:999px;padding:12px 30px;font:800 32px I;margin-bottom:28px}
h1{font:800 var(--h1)/1.02 B;letter-spacing:-.035em;margin:0}
h2{font:700 var(--h2)/1.15 B;letter-spacing:-.02em;margin:24px 0 0;color:var(--soft)}
.w{display:inline-block;white-space:pre}
.hl{background:linear-gradient(transparent 58%,var(--lime) 58% 92%,transparent 92%)}
.y{color:var(--lime)}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
/* problème */
.notif{position:absolute;display:flex;align-items:center;gap:20px;background:#fff;color:#1a1530;border-radius:28px;padding:22px 30px;font:700 34px/1.2 I;box-shadow:0 30px 60px -20px #000b;white-space:nowrap}
.notif .d{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:32px;color:#fff;flex:none}
.sheet{position:absolute;width:560px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 30px 70px -20px #000b}
.sheet div{display:grid;grid-template-columns:repeat(5,1fr)}.sheet span{height:46px;border:1px solid #d9dce3}.sheet div:first-child span{background:#1f7a46}
.paper{position:absolute;width:300px;height:400px;background:#fbf8f1;border-radius:12px;box-shadow:0 30px 60px -20px #000a;padding:30px 26px}
.paper i{display:block;height:10px;border-radius:5px;background:#cfc9bb;margin:0 0 16px}.paper b{display:block;font:800 24px B;color:#333;margin-bottom:22px}
.cross{position:absolute;font:800 260px/1 B;color:var(--red);text-shadow:0 20px 50px #000a}
/* logo et icônes */
.logo{display:flex;align-items:center;gap:30px;font:800 92px B;letter-spacing:-.03em}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:38px 46px}
.land .apps{gap:30px 40px}
.app{display:grid;justify-items:center;gap:14px;font:700 30px I;text-align:center}
.ico{width:150px;height:150px;border-radius:40px;display:grid;place-items:center;overflow:hidden;box-shadow:0 24px 40px -18px #000c}
.land .ico{width:124px;height:124px;border-radius:32px}
.port .ico{width:200px;height:200px;border-radius:52px}.port .app{font-size:36px;gap:18px}.port .apps{gap:56px 60px}
.port .sheet{width:640px}.port .paper{width:340px;height:450px}
.ico img{width:100%;height:100%;object-fit:cover}.ico svg{width:56%;height:56%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* téléphones */
.phone{position:absolute;height:var(--ph);width:calc(var(--ph)*.4621 + 24px);border:14px solid #0f0d18;border-radius:80px;background:#000;overflow:hidden;box-shadow:0 60px 120px -30px #000,0 0 0 2px #3c3858}
.phone img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:top}
.chip{position:absolute;display:flex;align-items:center;gap:16px;border-radius:999px;padding:20px 34px;font:800 40px B;box-shadow:0 26px 50px -20px #000c;white-space:nowrap}
.chip.ok{background:var(--green);color:#06210f}.chip.li{background:var(--lime);color:#120e2b}.chip.wh{background:#fff;color:#1a1530}
.stamps{position:absolute;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;background:#fff;border-radius:34px;padding:30px;box-shadow:0 30px 60px -20px #000c}
.stamps span{width:84px;height:84px;border-radius:50%;border:4px dashed #c9c4d8;display:grid;place-items:center;font:800 36px B;color:#b9b4c8}
.stamps span.on{border:0;background:#b4436c;color:#fff}
/* devis */
.quote{width:100%;max-width:820px;background:#fff;color:#1a1530;border-radius:34px;padding:44px 48px;box-shadow:0 50px 100px -30px #000d}
.quote h4{margin:0 0 26px;font:800 40px B;display:flex;justify-content:space-between;align-items:center}
.quote h4 small{font:700 26px I;color:#6b6680}
.quote .r{display:flex;justify-content:space-between;padding:20px 6px;border-bottom:2px solid #ece9f3;font:600 34px I}
.quote .r span:last-child{font-weight:800;font-variant-numeric:tabular-nums}
.quote .tot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding:24px 28px;border-radius:22px;background:#ece8ff;font:800 44px B;color:#3b25d0}
.sign{position:absolute;font:700 64px 'Brush Script MT',cursive;color:#3b25d0}
/* écran d'accueil */
.home{position:absolute;inset:0;background:linear-gradient(160deg,#ffb46b,#ff6f91 45%,#7a62ff);padding:120px 34px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:34px 18px;align-content:start}
.home i{display:block;width:100%;aspect-ratio:1;border-radius:26px;background:#ffffff4d}
.land .home{padding-top:90px;gap:24px 14px}.land .home i{border-radius:20px}
.newapp{border-radius:26px;aspect-ratio:1;background:var(--v);display:grid;place-items:center;box-shadow:0 18px 30px -10px #0008}
.newapp svg{width:62%;height:62%}
.sheetbar{position:absolute;left:0;right:0;bottom:0;background:#fff;color:#1a1530;border-radius:36px 36px 0 0;padding:34px 34px 60px;font:700 32px I;text-align:center}
.sheetbar b{display:block;margin-top:18px;background:var(--v);color:#fff;border-radius:20px;padding:20px;font:800 34px B}
.nostore{position:absolute;display:flex;align-items:center;gap:16px;background:#fff;color:#1a1530;border-radius:999px;padding:18px 32px;font:800 36px B;box-shadow:0 26px 50px -20px #000c}
.nostore s{color:#8a8599}
/* promesses */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:30px;width:100%;max-width:980px}
.tile{border-radius:34px;background:#ffffff16;border:3px solid #ffffff2c;padding:40px 30px;font:800 44px/1.12 B}
.tile .t{display:grid;place-items:center;width:110px;height:110px;margin-bottom:24px;border-radius:30px;background:var(--lime);color:#120e2b;font-size:60px}
.land .tile{font-size:38px;padding:30px 28px}.land .tile .t{width:90px;height:90px;font-size:48px}
/* final */
#s6 .txt{margin:auto;text-align:center;width:auto;display:grid;justify-items:center}
.url{display:inline-block;margin-top:40px;background:var(--lime);color:#120e2b;border-radius:999px;padding:22px 60px;font:800 60px B}
.small{margin-top:28px;font:700 36px I;color:var(--soft)}
.legal{position:absolute;left:0;right:0;bottom:46px;text-align:center;font:500 26px I;color:#ffffff88;padding:0 80px}
.bar{position:absolute;left:0;bottom:0;height:10px;background:var(--lime);width:0}
.wipe{position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(90deg,transparent,var(--lime) 40%,#fff);opacity:0;transform:translateX(-120%) skewX(-12deg)}
.fic{position:absolute;font:700 24px I;color:#ffffffaa;letter-spacing:.12em;text-transform:uppercase}
</style></head>
<body>
<div class="stage" id="stage"><div class="grid"></div>
  <section class="scene" id="s0"><div class="txt"><h1 id="h0"></h1></div><div class="vis" id="v0"></div></section>
  <section class="scene" id="s1"><div class="txt"><div class="logo" id="lg1"></div><h1 id="h1" style="margin-top:30px"></h1></div><div class="vis"><div class="apps" id="apps"></div></div></section>
  <section class="scene" id="s2"><div class="txt"><span class="kick">Pack Commerçant</span><h1 id="h2"></h1><h2 id="h2b"></h2></div><div class="vis" id="v2"></div></section>
  <section class="scene" id="s3"><div class="txt"><span class="kick">Outil métier</span><h1 id="h3"></h1><h2 id="h3b"></h2></div><div class="vis" id="v3"></div></section>
  <section class="scene" id="s4"><div class="txt"><span class="kick">Application web</span><h1 id="h4"></h1><h2 id="h4b"></h2></div><div class="vis" id="v4"></div></section>
  <section class="scene" id="s5"><div class="txt"><h1 id="h5"></h1></div><div class="vis"><div class="tiles" id="tiles"></div></div></section>
  <section class="scene" id="s6"><div class="txt"><div class="logo" id="lg6"></div><h1 id="h6" style="margin-top:34px"></h1><div class="url" id="url">quentools.fr</div><div class="small" id="dv">Devis gratuit sous 48 h</div></div><div class="legal" id="legal">Écrans du Pack Commerçant : exemple fictif.</div></section>
  <div class="wipe" id="wipe"></div><div class="bar" id="bar"></div>
</div>
<script>
const FMT = new URLSearchParams(location.search).get('fmt') === 'land' ? 'land' : 'port';
document.body.className = FMT;
const $ = s => document.querySelector(s), P = FMT === 'port';
const DUR = 30, ANIMS = [], CUES = [], COUNTERS = [];
/* Plans : [début, fin] en secondes, coupes sur les temps de la musique (120 battements par minute). */
const SC = { s0: [0, 4], s1: [4, 8], s2: [8, 14], s3: [14, 19], s4: [19, 23.5], s5: [23.5, 26.5], s6: [26.5, 30] };
const EASE = 'cubic-bezier(.2,.8,.2,1)', BACK = 'cubic-bezier(.34,1.56,.64,1)', LIN = 'linear';
function an(el, kf, t0, d, ease = EASE, fill = 'both') { const a = el.animate(kf, { duration: d * 1000, delay: t0 * 1000, easing: ease, fill }); a.pause(); ANIMS.push(a); return a; }
const cue = (t, k) => CUES.push({ t, k });
const NB = ' ';
function words(el, text, t0, step = 0.14, cls = {}) {
  el.innerHTML = ''; cue(t0 + .02, 'swish');
  text.split(' ').forEach((w, i) => { const s = document.createElement('span'); s.className = 'w' + (cls[i] ? ' ' + cls[i] : ''); s.textContent = w.replace(/_/g, NB) + ' '; el.appendChild(s);
    an(s, [{ opacity: 0, transform: 'translateY(46px) scale(.9)' }, { opacity: 1, transform: 'none' }], t0 + i * step, .34, BACK); });
}
function scene(id) { const el = $('#' + id), [s, e] = SC[id], d = e - s + (id === 's6' ? 0 : .05);
  an(el, [{ opacity: 0, offset: 0 }, { opacity: 1, offset: .05 }, { opacity: 1, offset: .95 }, { opacity: id === 's6' ? 1 : 0, offset: 1 }], s, d, LIN);
  an(el, [{ transform: 'scale(1.04)' }, { transform: 'scale(1)' }], s, d, 'ease-out'); }
const pop = (el, t, d = .4, from = .6) => { cue(t + .02, 'pop'); return an(el, [{ opacity: 0, transform: `scale(${from})` }, { opacity: 1, transform: 'none' }], t, d, BACK); };
const slide = (el, t, dx = 0, dy = 60, d = .45) => { cue(t + .02, 'swish'); return an(el, [{ opacity: 0, transform: `translate(${dx}px,${dy}px)` }, { opacity: 1, transform: 'none' }], t, d); };
const ICON = { cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  check: '<polyline points="20 6 9 17 4 12"/>', lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>', euro: '<path d="M18 7a7 7 0 1 0 0 10"/><line x1="4" y1="10" x2="14" y2="10"/><line x1="4" y1="14" x2="13" y2="14"/>',
  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>', chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  bag: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>', chart: '<polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/>',
  food: '<path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2"/><line x1="6" y1="2" x2="6" y2="22"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>', x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' };
const ic = k => `<svg class="i" viewBox="0 0 24 24">${ICON[k]}</svg>`;
const MARK = s => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="#fff"/><circle cx="30" cy="30" r="14" fill="none" stroke="#5b3df5" stroke-width="7"/><path d="M37 37l12 12" stroke="#d7f24a" stroke-width="8" stroke-linecap="round"/></svg>`;
const IMG = f => `../../${f}`;

/* ---------------- S0 : le problème (0 – 4 s) ---------------- */
{
  scene('s0');
  words($('#h0'), P ? `Excel, papiers, messages à_toute_heure_?` : `Excel, papiers, messages à_toute_heure_?`, .15, .2, { 3: 'hl', 4: 'hl' });
  const v = $('#v0');
  v.innerHTML = `<div class="sheet" id="xl" style="${P ? 'left:4%;top:4%' : 'left:2%;top:6%'};transform:rotate(-6deg)">${'<div><span></span><span></span><span></span><span></span><span></span></div>'.repeat(7)}</div>
    <div class="paper" id="pp" style="${P ? 'right:6%;top:2%' : 'right:4%;top:2%'};transform:rotate(8deg)"><b>Devis n° 0127</b><i style="width:90%"></i><i></i><i style="width:70%"></i><i></i><i style="width:55%"></i><i></i><i style="width:80%"></i></div>`;
  const N = [['#ff5a6e', 'cal', 'Rendez-vous annulé', P ? 'left:2%;top:44%' : 'left:0;top:42%'], ['#25d366', 'chat', '« Vous êtes ouvert dimanche ? »', P ? 'right:0;top:58%' : 'right:0;top:60%'], ['#5b3df5', 'phone', '3 appels manqués', P ? 'left:8%;top:74%' : 'left:14%;top:78%']];
  N.forEach(([c, i, t, pos], k) => { const n = document.createElement('div'); n.className = 'notif'; n.style.cssText = pos; n.innerHTML = `<span class="d" style="background:${c}">${ic(i)}</span>${t}`; v.appendChild(n);
    an(n, [{ opacity: 0, transform: 'translateY(-80px) scale(.8)' }, { opacity: 1, transform: 'none' }], 1.0 + k * .5, .35, BACK); cue(1.02 + k * .5, 'alert'); });
  pop($('#xl'), .4, .4, .7); pop($('#pp'), .7, .4, .7);
  an(v, [{ transform: 'translateX(0)' }, { transform: 'translateX(-10px)' }, { transform: 'translateX(10px)' }, { transform: 'translateX(0)' }], 2.6, .3, 'ease-in-out');
  cue(3.7, 'whoosh');
}
/* ---------------- S1 : QuenTools (4 – 8 s) ---------------- */
{
  scene('s1');
  $('#lg1').innerHTML = MARK(P ? 120 : 100) + '<span>QuenTools</span>'; pop($('#lg1'), 4.1, .5, .5); cue(4.15, 'thump');
  words($('#h1'), `crée vos apps et_vos_outils.`, 4.55, .16, { 2: 'hl', 3: 'hl' });
  const A = [['wouf/icons/icon-192.png', 'Wouf'], ['assets/paperdecrypt/icon-192.png', 'Paperdecrypt'], ['infikit/icons/icon-192.png', 'Infikit'],
    [['linear-gradient(140deg,#ffb35c,#f0602a)', 'food'], 'Gourmet AI'], [['linear-gradient(140deg,#6d7cff,#3b3fd9)', 'bag'], 'Freelance Kit'], [['linear-gradient(140deg,#d7f24a,#a8c91f)', 'cal'], 'Pack Commerçant']];
  const g = $('#apps');
  A.forEach(([s, n], k) => { const d = document.createElement('div'); d.className = 'app';
    d.innerHTML = (typeof s === 'string' ? `<span class="ico"><img src="${IMG(s)}" alt=""></span>` : `<span class="ico" style="background:${s[0]}"><svg viewBox="0 0 24 24" style="${s[1] === 'cal' ? 'stroke:#120e2b' : ''}">${ICON[s[1]]}</svg></span>`) + `<span>${n}</span>`;
    g.appendChild(d); pop(d, 5.2 + k * .22, .38, .3); });
  cue(7.7, 'whoosh');
}
/* ---------------- S2 : Pack Commerçant (8 – 14 s) ---------------- */
{
  scene('s2');
  words($('#h2'), `Vos clients réservent, paient l’acompte et_reviennent.`, 8.15, .13, { 1: '', 6: 'hl' });
  const h = $('#h2b'); h.textContent = 'Réservation, fidélité, avis Google.'; slide(h, 9.2, 0, 30);
  const v = $('#v2');
  const pos = P ? ['left:6%;top:0', 'right:4%;top:6%'] : ['left:6%;top:0', 'right:2%;top:4%'];
  v.innerHTML = `<div class="phone" id="pa" style="${pos[0]};transform:rotate(-4deg)"><img src="${IMG('design/flyer/tel-reservation.jpg')}" alt=""></div>
    <div class="phone" id="pb" style="${pos[1]};transform:rotate(5deg)"><img src="${IMG('design/flyer/tel-fidelite.jpg')}" alt=""></div>
    <div class="chip ok" id="acp" style="${P ? 'left:2%;top:42%' : 'left:0;top:52%'}">${ic('check')}Acompte de 10 € reçu</div>
    <div class="stamps" id="stp" style="${P ? 'right:2%;bottom:2%' : 'right:0;bottom:0'}">${Array.from({ length: 8 }, (_, i) => `<span id="st${i}">${i + 1}</span>`).join('')}</div>
    <div class="chip li" id="avis" style="${P ? 'left:0;bottom:24%' : 'right:0;top:0'}">★★★★★ Laisser un avis</div>
    <span class="fic" style="${P ? 'right:4%;bottom:-60px' : 'right:2%;bottom:-40px'}">Exemple fictif</span>`;
  if (!P) { $('#pa').style.height = '640px'; $('#pa').style.width = 'calc(640px*.4621 + 24px)'; $('#pb').style.height = '640px'; $('#pb').style.width = 'calc(640px*.4621 + 24px)'; }
  slide($('#pa'), 8.2, -80, 0, .5); slide($('#pb'), 8.6, 80, 0, .5);
  an($('#pa'), [{ transform: 'rotate(-4deg) translateY(0)' }, { transform: 'rotate(-4deg) translateY(-24px)' }], 8.2, 5.8, 'ease-in-out');
  an($('#acp'), [{ opacity: 0, transform: 'scale(.4)' }, { opacity: 1, transform: 'none' }], 9.9, .4, BACK); cue(9.95, 'ding');
  pop($('#stp'), 10.8, .45, .6);
  for (let i = 0; i < 3; i++) { const s = $('#st' + i); an(s, [{ background: 'transparent', color: '#b9b4c8', transform: 'scale(1)' }, { background: '#b4436c', color: '#fff', transform: 'scale(1.25)' }, { background: '#b4436c', color: '#fff', transform: 'scale(1)' }], 11.3 + i * .35, .3, BACK); cue(11.32 + i * .35, 'click'); }
  pop($('#avis'), 12.6, .4, .5); cue(13.7, 'whoosh');
}
/* ---------------- S3 : outil métier (14 – 19 s) ---------------- */
{
  scene('s3');
  words($('#h3'), `Vos devis faits sur téléphone, devant_le_client.`, 14.15, .13, { 4: 'hl' });
  const h = $('#h3b'); h.textContent = 'Planning, suivi, commandes, calculs.'; slide(h, 15.1, 0, 30);
  const v = $('#v3');
  v.innerHTML = `<div class="quote" id="qt"><h4><span>Devis n° 0128</span><small>Exemple</small></h4>
    <div class="r" id="r1"><span>Déplacement et diagnostic</span><span>45 €</span></div>
    <div class="r" id="r2"><span>Remplacement du mitigeur</span><span>120 €</span></div>
    <div class="r" id="r3"><span>Pièces</span><span>85 €</span></div>
    <div class="tot" id="tot"><span>Total</span><span id="num">0 €</span></div></div>
    <div class="chip wh" id="sent" style="${P ? 'right:0;bottom:-2%' : 'right:-20px;bottom:-30px'}">${ic('check')}Envoyé au client</div>`;
  pop($('#qt'), 14.2, .5, .9);
  ['#r1', '#r2', '#r3'].forEach((r, k) => { slide($(r), 15.0 + k * .4, 70, 0, .35); });
